name: Linux publication acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document dependencies
        run: bash scripts/setup.sh
      - name: Prepare CI browser and Chinese fonts
        run: |
          npx --no-install playwright-core install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          echo "BROWSER_EXECUTABLE=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Test and publish sample plus full book
        run: bash scripts/verify.sh
      - name: Validate isolated Linux CPU environment
        run: PYTHON=python3 bash scripts/setup.sh --cpu
      - name: Audit all scripts and run all chapter experiments in isolation
        run: bash scripts/verify-experiments.sh
      - name: Preserve acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-publication-reports
          path: |
            build/qa/
            build/full-script-audit/*/results.json
            build/full-script-audit/*/logs/
            build/full-script-audit/*/evidence/
            build/environment/
            build/pdf/*.build.json
          if-no-files-found: ignore
