<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="c06-xor-impossibility-title c06-xor-impossibility-desc"><title id="c06-xor-impossibility-title">图06-2：XOR无法被单一仿射阈值分类器表示</title><desc id="c06-xor-impossibility-desc">负类在零零和一一，正类在零一和一零。正类条件相加要求w1加w2加2b大于等于零，负类条件相加要求同一个量小于零，形成矛盾。</desc><rect x="0" y="0" width="900" height="510" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">XOR的限制来自单条直线能表达什么</text><text x="30" y="78" font-size="21" >两类对角线共享中点(0.5,0.5)；右侧用本章阈值约定给出矛盾。</text><rect x="80" y="140" width="300" height="300" fill="#fff" stroke="#8a9eb4" stroke-width="2"/><line x1="80" y1="440" x2="380" y2="140" stroke="#bd611a" stroke-width="3" stroke-dasharray="8 5"/><line x1="80" y1="140" x2="380" y2="440" stroke="#246cc0" stroke-width="3" stroke-dasharray="8 5"/><rect x="70" y="430" width="20" height="20" fill="#bd611a" /><text x="100" y="423" font-size="21" text-anchor="start">(0,0)</text><rect x="370" y="130" width="20" height="20" fill="#bd611a" /><text x="360" y="168" font-size="21" text-anchor="end">(1,1)</text><circle cx="80" cy="140" r="10" fill="#246cc0"/><text x="100" y="168" font-size="21" text-anchor="start">(0,1)</text><circle cx="380" cy="440" r="10" fill="#246cc0"/><text x="360" y="423" font-size="21" text-anchor="end">(1,0)</text><circle cx="230.0" cy="290.0" r="7" fill="#172c44"/><text x="230" y="475" font-size="21" text-anchor="middle">两类对角线的中点相同</text><text x="455" y="160" font-size="24" font-weight="700">负类要求：</text><text x="455" y="200" font-size="23" >b &lt; 0；w₁+w₂+b &lt; 0</text><text x="455" y="245" font-size="23" fill="#bd611a">相加：w₁+w₂+2b &lt; 0</text><text x="455" y="305" font-size="24" font-weight="700">正类要求：</text><text x="455" y="345" font-size="23" >w₁+b ≥ 0；w₂+b ≥ 0</text><text x="455" y="390" font-size="23" fill="#246cc0">相加：w₁+w₂+2b ≥ 0</text><text x="455" y="455" font-size="23" font-weight="700">同一个量无法同时 &lt;0 和 ≥0。</text></g></svg>
