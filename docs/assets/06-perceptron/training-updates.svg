<svg xmlns="http://www.w3.org/2000/svg" width="900" height="615" viewBox="0 0 900 615" role="img" aria-labelledby="c06-training-updates-title c06-training-updates-desc"><title id="c06-training-updates-title">图06-4：两种任务每轮实际更新次数</title><desc id="c06-training-updates-desc">OR六轮更新次数为三、一、二、二、一、零，总共九次。XOR在三十轮中每轮更新四次，达到预算仍未收敛。OR曲线只画到实际运行的第六轮。</desc><rect x="0" y="0" width="900" height="615" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">每轮更新数：可分时停止，XOR持续出现违例</text><text x="30" y="78" font-size="21" >固定数据顺序与学习率1；更新数包含落在边界上的样本。</text><line x1="90" y1="395.0" x2="820" y2="395.0" stroke="#d0dbe7" stroke-width="1" /><text x="75" y="402.0" font-size="21" text-anchor="end">0</text><line x1="90" y1="335.0" x2="820" y2="335.0" stroke="#d0dbe7" stroke-width="1" /><text x="75" y="342.0" font-size="21" text-anchor="end">1</text><line x1="90" y1="275.0" x2="820" y2="275.0" stroke="#d0dbe7" stroke-width="1" /><text x="75" y="282.0" font-size="21" text-anchor="end">2</text><line x1="90" y1="215.0" x2="820" y2="215.0" stroke="#d0dbe7" stroke-width="1" /><text x="75" y="222.0" font-size="21" text-anchor="end">3</text><line x1="90" y1="155.0" x2="820" y2="155.0" stroke="#d0dbe7" stroke-width="1" /><text x="75" y="162.0" font-size="21" text-anchor="end">4</text><line x1="90" y1="125" x2="90" y2="395" stroke="#172c44" stroke-width="2" /><line x1="90" y1="395" x2="820" y2="395" stroke="#172c44" stroke-width="2" /><text x="90.0" y="427" font-size="21" text-anchor="middle">1</text><text x="190.68965517241378" y="427" font-size="21" text-anchor="middle">5</text><text x="316.55172413793105" y="427" font-size="21" text-anchor="middle">10</text><text x="568.2758620689656" y="427" font-size="21" text-anchor="middle">20</text><text x="820.0" y="427" font-size="21" text-anchor="middle">30</text><text x="30" y="115" font-size="21" >更新数</text><text x="820" y="458" font-size="22" text-anchor="end">训