<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="c06-or-xor-boundaries-title c06-or-xor-boundaries-desc"><title id="c06-or-xor-boundaries-title">图06-3：实际训练后的OR决策边界和XOR退化终态</title><desc id="c06-or-xor-boundaries-desc">OR终态权重为2和2，偏置负1，直线x1加x2等于0.5正确分开全部四点。XOR终态权重和偏置全零，按零分数预测正类的约定全部预测正类，两个负类错误，没有有效分割线。</desc><rect x="0" y="0" width="900" height="640" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">同一训练规则：OR可分，XOR终态仍然出错</text><text x="30" y="77" font-size="21" >点的形状表示真实标签；背景表示最终模型预测，参数来自实际运行。</text><text x="45" y="123" font-size="23" font-weight="700">OR：w=(2,2)，b=−1</text><rect x="65" y="165" width="300" height="300" fill="#e5effc" stroke="#8a9eb4" stroke-width="1"/><polygon points="65.00,465.00 265.00,465.00 65.00,265.00" fill="#fae9dc"/><line x1="65.0" y1="265.0" x2="265.0" y2="465.0" stroke="#172c44" stroke-width="3" /><line x1="115.0" y1="165" x2="115.0" y2="465" stroke="#d0dbe7" stroke-width="1" /><line x1="65" y1="415.0" x2="365" y2="415.0" stroke="#d0dbe7" stroke-width="1" /><text x="115.0" y="493" font-size="21" text-anchor="middle">0</text><text x="53" y="422.0" font-size="21" text-anchor="end">0</text><line x1="315.0" y1="165" x2="315.0" y2="465" stroke="#d0dbe7" stroke-width="1" /><line x1="65" y1="215.0" x2="365" y2="215.0" stroke="#d0dbe7" stroke-width="1" /><text x="315.0" y="493" font-size="21" text-anchor="middle">1</text><text x="53" y="222.0" font-size="21" text-anchor="end">1</text><rect x="105.0" y="405.0" width="20" height="20" fill="#bd611a" stroke="#fff" stroke-width="2"/><circle cx="115.0" cy="215.0" r="10" fill="#246cc0" stroke="#fff" stroke-width="2"/><circle cx="315.0" cy="415.0" r="10" fill="#246cc0" stroke="#fff" stroke-width="2"/><circle cx="315.0" cy="215.0" r="10" fill="#246cc0" stroke="#fff" stroke-width="2"/><text x="363" y="526" font-size="23" text-anchor="end">x₁</text><text x="60" y="152" font-size="23" >x₂</text><text x="45" y="566" font-size="21" >准确率100%；边界 x₁+x₂=0.5</text><text x="485" y="123" font-size="23" font-weight="700">XOR：w=(0,0)，b=0</text><rect x="505" y="165" width="300" height="300" fill="#e5effc" stroke="#8a9eb4" stroke-width="1"/><line x1="555.0" y1="165" x2="555.0" y2="465" stroke="#d0dbe7" stroke-width="1" /><line x1="505" y1="415.0" x2="805" y2="415.0" stroke="#d0dbe7" stroke-width="1" /><text x="555.0" y="493" font-size="21" text-anchor="middle">0</text><text x="493" y="422.0" font-size="21" text-anchor="end">0</text><line x1="755.0" y1="165" x2="755.0" y2="465" stroke="#d0dbe7" stroke-width="1" /><line x1="505" y1="215.0" x2="805" y2="215.0" stroke="#d0dbe7" stroke-width="1" /><text x="755.0" y="493" font-size="21" text-anchor="middle">1</text><text x="493" y="222.0" font-size="21" text-anchor="end">1</text><rect x="545.0" y="405.0" width="20" height="20" fill="#bd611a" stroke="#fff" stroke-width="2"/><circle cx="555.0" cy="415.0" r="17" fill="none" stroke="#bd611a" stroke-width="2" stroke-dasharray="4 3"/><text x="578.0" y="401.0" font-size="21" >错</text><circle cx="555.0" cy="215.0" r="10" fill="#246cc0" stroke="#fff" stroke-width="2"/><circle cx="755.0" cy="415.0" r="10" fill="#246cc0" stroke="#fff" stroke-width="2"/><rect x="745.0" y="205.0" width="20" height="20" fill="#bd611a" stroke="#fff" stroke-width="2"/><circle cx="755.0" cy="215.0" r="17" fill="none" stroke="#bd611a" stroke-width="2" stroke-dasharray="4 3"/><text x="778.0" y="201.0" font-size="21" >错</text><text x="803" y="526" font-size="23" text-anchor="end">x₁</text><text x="500" y="152" font-size="23" >x₂</text><text x="485" y="566" font-size="21" >准确率50%；全部预测+1，无分割线</text><text x="30" y="607" font-size="21" >● 真值+1；■ 真值−1；虚线外圈标出误分类。训练分数零时按+1预测。</text></g></svg>
