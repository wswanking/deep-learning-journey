<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img" aria-labelledby="c06-perceptron-unit-title c06-perceptron-unit-desc"><title id="c06-perceptron-unit-title">图06-1：感知机的仿射计算与阈值激活</title><desc id="c06-perceptron-unit-desc">输入d个数值分量，各自乘权重后求和，加标量偏置得到z。阈值函数在z大于等于0时输出正一，否则负一。</desc><rect x="0" y="0" width="900" height="475" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">一个感知机：加权求和，加偏置，再做阈值判断</text><text x="30" y="78" font-size="21" >输入是数值向量；输出是 −1 / +1 标签，分数本身不是概率。</text><rect x="45" y="125" width="115" height="60" fill="#e6effb" rx="10" stroke="#5f8dbe" stroke-width="2"/><text x="102" y="163" font-size="26" text-anchor="middle">x₁</text><line x1="160" y1="155" x2="375" y2="260" stroke="#246cc0" stroke-width="3" /><text x="230" y="181.75" font-size="23" >w₁</text><rect x="45" y="230" width="115" height="60" fill="#e6effb" rx="10" stroke="#5f8dbe" stroke-width="2"/><text x="102" y="268" font-size="26" text-anchor="middle">x₂</text><line x1="160" y1="260" x2="375" y2="260" stroke="#246cc0" stroke-width="3" /><text x="230" y="250.0" font-size="23" >w₂</text><rect x="45" y="335" width="115" height="60" fill="#e6effb" rx="10" stroke="#5f8dbe" stroke-width="2"/><text x="102" y="373" font-size="26" text-anchor="middle">x₃</text><line x1="160" y1="365" x2="375" y2="260" stroke="#246cc0" stroke-width="3" /><text x="230" y="318.25" font-size="23" >w₃</text><circle cx="410" cy="260" r="44" fill="#fff" stroke="#5f8dbe" stroke-width="2"/><text x="410" y="269" font-size="25" text-anchor="middle">Σ + b</text><text x="410" y="337" font-size="22" text-anchor="middle">分数 z</text><line x1="455" y1="260" x2="565" y2="260" stroke="#246cc0" stroke-width="3" /><rect x="565" y="215" width="165" height="90" fill="#fff" rx="12" stroke="#5f8dbe" stroke-width="2"/><text x="647" y="251" font-size="23" text-anchor="middle">阈值激活</text><text x="647" y="284" font-size="23" text-anchor="middle">g(z)</text><line x1="730" y1="260" x2="790" y2="260" stroke="#246cc0" stroke-width="3" /><text x="835" y="252" font-size="28" text-anchor="middle">ŷ</text><text x="835" y="285" font-size="22" text-anchor="middle">±1</text><text x="30" y="439" font-size="22" >d=3示意：3个权重 + 1个偏置；g(z)=+1（z≥0），否则−1。</text></g></svg>
