<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Dropout训练与评估</title><desc id="desc">固定示意掩码1,0,1,0在丢弃概率一半时把2,4,6,8映射到4,0,12,0；期望保持，评估为恒等映射。</desc><rect width="1200" height="640" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="29" fill="#16344f" text-anchor="start">图10-3  Inverted Dropout：保留项在训练时缩放</text><text x="155.00" y="125.00" font-size="25" fill="#16344f" text-anchor="middle">输入 h</text><rect x="105" y="165" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="155.00" y="203.00" font-size="27" fill="#16344f" text-anchor="middle">2</text><rect x="105" y="235" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="155.00" y="273.00" font-size="27" fill="#16344f" text-anchor="middle">4</text><rect x="105" y="305" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="155.00" y="343.00" font-size="27" fill="#16344f" text-anchor="middle">6</text><rect x="105" y="375" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="155.00" y="413.00" font-size="27" fill="#16344f" text-anchor="middle">8</text><line x1="215.00" y1="295.00" x2="305.00" y2="295.00" stroke="#16344f" stroke-width="3"/><path d="M 295.35 300.27 L 305.00 295.00 L 295.35 289.73" fill="none" stroke="#16344f" stroke-width="3"/><text x="440.00" y="125.00" font-size="25" fill="#16344f" text-anchor="middle">一次掩码 m</text><rect x="390" y="165" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="440.00" y="203.00" font-size="27" fill="#16344f" text-anchor="middle">1</text><rect x="390" y="235" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="440.00" y="273.00" font-size="27" fill="#16344f" text-anchor="middle">0</text><rect x="390" y="305" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="440.00" y="343.00" font-size="27" fill="#16344f" text-anchor="middle">1</text><rect x="390" y="375" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="440.00" y="413.00" font-size="27" fill="#16344f" text-anchor="middle">0</text><line x1="500.00" y1="295.00" x2="590.00" y2="295.00" stroke="#16344f" stroke-width="3"/><path d="M 580.35 300.27 L 590.00 295.00 L 580.35 289.73" fill="none" stroke="#16344f" stroke-width="3"/><text x="725.00" y="125.00" font-size="25" fill="#16344f" text-anchor="middle">训练输出 h′</text><rect x="675" y="165" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="725.00" y="203.00" font-size="27" fill="#16344f" text-anchor="middle">4</text><rect x="675" y="235" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="725.00" y="273.00" font-size="27" fill="#16344f" text-anchor="middle">0</text><rect x="675" y="305" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="725.00" y="343.00" font-size="27" fill="#16344f" text-anchor="middle">12</text><rect x="675" y="375" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="725.00" y="413.00" font-size="27" fill="#16344f" text-anchor="middle">0</text><text x="1010.00" y="125.00" font-size="25" fill="#16344f" text-anchor="middle">评估：直接取h</text><rect x="960" y="165" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1010.00" y="203.00" font-size="27" fill="#16344f" text-anchor="middle">2</text><rect x="960" y="235" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1010.00" y="273.00" font-size="27" fill="#16344f" text-anchor="middle">4</text><rect x="960" y="305" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1010.00" y="343.00" font-size="27" fill="#16344f" text-anchor="middle">6</text><rect x="960" y="375" width="100" height="55" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1010.00" y="413.00" font-size="27" fill="#16344f" text-anchor="middle">8</text><text x="55.00" y="530.00" font-size="25" fill="#16344f" text-anchor="start">丢弃概率p=0.5；h′=m·h/(1−p)。单次输出不必等于原值。</text><text x="55.00" y="590.00" font-size="24" fill="#16344f" text-anchor="start">精确枚举16种等概率掩码可得 E[h′]=h；eval模式直接保留h。</text></g></svg>
