<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">数据协议与初始化尺度</title><desc id="desc">训练数据更新权重，验证数据选择方案，测试数据在冻结后评价；Kaiming初始化以输入连接数和ReLU二阶矩近似控制尺度。</desc><rect width="1200" height="600" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="29" fill="#16344f" text-anchor="start">图10-4  数据职责与初始化：在比较前固定协议</text><rect x="50" y="120" width="290" height="145" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="195.00" y="172.00" font-size="29" fill="#16344f" text-anchor="middle">训练集</text><text x="195.00" y="225.00" font-size="23" fill="#16344f" text-anchor="middle">仅它提供参数梯度</text><rect x="455" y="120" width="290" height="145" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="600.00" y="172.00" font-size="29" fill="#16344f" text-anchor="middle">验证集</text><text x="600.00" y="225.00" font-size="23" fill="#16344f" text-anchor="middle">选超参数与最佳轮</text><rect x="860" y="120" width="290" height="145" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1005.00" y="172.00" font-size="29" fill="#16344f" text-anchor="middle">测试集</text><text x="1005.00" y="225.00" font-size="23" fill="#16344f" text-anchor="middle">配置冻结后最终评价</text><line x1="345.00" y1="195.00" x2="440.00" y2="195.00" stroke="#16344f" stroke-width="3"/><path d="M 430.35 200.27 L 440.00 195.00 L 430.35 189.73" fill="none" stroke="#16344f" stroke-width="3"/><line x1="750.00" y1="195.00" x2="845.00" y2="195.00" stroke="#16344f" stroke-width="3"/><path d="M 835.35 200.27 L 845.00 195.00 L 835.35 189.73" fill="none" stroke="#16344f" stroke-width="3"/><text x="60.00" y="325.00" font-size="25" fill="#16344f" text-anchor="start">比较三种方法：同一数据划分、同一初始化、同一预算与早停规则。</text><rect x="60" y="380" width="1070" height="160" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="85.00" y="425.00" font-size="25" fill="#16344f" text-anchor="start">ReLU隐藏层的尺度直觉（满足独立、对称等近似条件）：</text><text x="85.00" y="472.00" font-size="24" fill="#16344f" text-anchor="start">输入二阶矩 → d_in个加权项相加 → ReLU约保留一半二阶矩</text><text x="85.00" y="515.00" font-size="23" fill="#16344f" text-anchor="start">选择 Var(W)≈2/d_in，有助于控制逐层尺度；不是任意数据的精确保证。</text></g></svg>
