<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" role="img" aria-labelledby="title desc"><title id="title">单轮指令文本模板</title><desc id="desc">明确本章指令和回答标记的文本序列，提示占28字节，两个回答字节与一个换行参与监督；模板使用固定字节词表。</desc><rect width="1240" height="580" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="27" fill="#16344f" text-anchor="start">图22-2  本章文本模板：角色标记也是UTF-8字节，不是新增特殊词元</text><rect x="40" y="170" width="710" height="140" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="395.00" y="240.00" font-size="25" fill="#235bc7" text-anchor="middle">[指令] ↵ 复制 af ↵ [回答] ↵</text><text x="395.00" y="269.00" font-size="20" fill="#235bc7" text-anchor="middle">提示：28字节，位置0…27</text><rect x="810" y="170" width="150" height="140" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="885.00" y="240.00" font-size="25" fill="#007d75" text-anchor="middle">af</text><text x="885.00" y="269.00" font-size="20" fill="#007d75" text-anchor="middle">2字节</text><rect x="1020" y="170" width="150" height="140" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1095.00" y="240.00" font-size="25" fill="#007d75" text-anchor="middle">↵</text><text x="1095.00" y="269.00" font-size="20" fill="#007d75" text-anchor="middle">1字节</text><line x1="755.00" y1="240.00" x2="800.00" y2="240.00" stroke="#16344f" stroke-width="3"/><path d="M 790.35 245.27 L 800.00 240.00 L 790.35 234.73" fill="none" stroke="#16344f" stroke-width="3"/><line x1="965.00" y1="240.00" x2="1010.00" y2="240.00" stroke="#16344f" stroke-width="3"/><path d="M 1000.35 245.27 L 1010.00 240.00 L 1000.35 234.73" fill="none" stroke="#16344f" stroke-width="3"/><text x="45.00" y="390.00" font-size="24" fill="#16344f" text-anchor="start">全串：提示＋回答＋LF；此短提示共31字节，长措辞模板共37字节。</text><text x="45.00" y="455.00" font-size="23" fill="#16344f" text-anchor="start">训练输入去掉最后一个字节；标签从第二字节开始，模型一直预测下一个字节。</text><text x="45.00" y="520.00" font-size="23" fill="#16344f" text-anchor="start">推理只提供提示，等待模型续写；LF字节10是本任务终止符，不是全局EOS。</text></g></svg>
