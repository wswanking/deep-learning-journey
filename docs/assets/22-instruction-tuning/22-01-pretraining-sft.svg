<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="title desc"><title id="title">预训练与SFT对照</title><desc id="desc">同一个第21章微型语言模型基座复制为不更新、回答监督和整段监督三组，只有训练监督目标改变。</desc><rect width="1240" height="660" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="28" fill="#16344f" text-anchor="start">图22-1  从预训练到SFT：同一模型结构，改变训练数据与监督目标</text><rect x="40" y="160" width="230" height="100" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="155.00" y="210.00" font-size="25" fill="#16344f" text-anchor="middle">普通短句语料</text><text x="155.00" y="239.00" font-size="20" fill="#16344f" text-anchor="middle">第21章预训练</text><rect x="370" y="160" width="245" height="100" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="492.50" y="210.00" font-size="25" fill="#16344f" text-anchor="middle">35,328参数基座</text><text x="492.50" y="239.00" font-size="20" fill="#16344f" text-anchor="middle">冻结为三组共同起点</text><line x1="275.00" y1="210.00" x2="360.00" y2="210.00" stroke="#16344f" stroke-width="3"/><path d="M 350.35 215.27 L 360.00 210.00 L 350.35 204.73" fill="none" stroke="#16344f" stroke-width="3"/><rect x="775" y="70" width="385" height="95" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="967.50" y="117.50" font-size="25" fill="#16344f" text-anchor="middle">不更新基座</text><text x="967.50" y="146.50" font-size="20" fill="#16344f" text-anchor="middle">只做最终评价</text><rect x="775" y="245" width="385" height="95" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="967.50" y="292.50" font-size="25" fill="#16344f" text-anchor="middle">回答监督SFT</text><text x="967.50" y="321.50" font-size="20" fill="#16344f" text-anchor="middle">只计回答及结束换行</text><rect x="775" y="420" width="385" height="95" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="967.50" y="467.50" font-size="25" fill="#16344f" text-anchor="middle">整段监督对照</text><text x="967.50" y="496.50" font-size="20" fill="#16344f" text-anchor="middle">计提示和回答的下词损失</text><line x1="620.00" y1="180.00" x2="765.00" y2="118.00" stroke="#16344f" stroke-width="3"/><path d="M 758.20 126.64 L 765.00 118.00 L 754.05 116.95" fill="none" stroke="#16344f" stroke-width="3"/><line x1="620.00" y1="215.00" x2="765.00" y2="292.00" stroke="#16344f" stroke-width="3"/><path d="M 754.00 292.13 L 765.00 292.00 L 758.95 282.81" fill="none" stroke="#16344f" stroke-width="3"/><line x1="620.00" y1="245.00" x2="765.00" y2="467.00" stroke="#16344f" stroke-width="3"/><path d="M 755.31 461.80 L 765.00 467.00 L 764.14 456.03" fill="none" stroke="#16344f" stroke-width="3"/><text x="45.00" y="615.00" font-size="24" fill="#16344f" text-anchor="start">两种SFT使用同一权重、批次顺序与800更新；验证选模后才比较测试生成。</text></g></svg>
