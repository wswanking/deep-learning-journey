<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 630" role="img" aria-labelledby="title desc"><title id="title">关联指令分组划分</title><desc id="desc">一对不同字母的两个顺序、两个任务、两个措辞共有八条关联记录，按无序字母对分组整体划分，避免近重复跨集合。</desc><rect width="1240" height="630" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="28" fill="#16344f" text-anchor="start">图22-4  按底层字母对分组：同一问题的变体一起进入一个划分</text><rect x="40" y="175" width="330" height="145" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="205.00" y="247.50" font-size="25" fill="#16344f" text-anchor="middle">一组 pair:ab</text><text x="205.00" y="276.50" font-size="20" fill="#16344f" text-anchor="middle">ab / ba 两个顺序</text><rect x="455" y="120" width="330" height="100" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="620.00" y="170.00" font-size="25" fill="#16344f" text-anchor="middle">两项任务</text><text x="620.00" y="199.00" font-size="20" fill="#16344f" text-anchor="middle">复制 / 反转</text><rect x="455" y="315" width="330" height="100" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="620.00" y="365.00" font-size="25" fill="#16344f" text-anchor="middle">各两种措辞</text><text x="620.00" y="394.00" font-size="20" fill="#16344f" text-anchor="middle">共8条关联记录</text><line x1="375.00" y1="230.00" x2="445.00" y2="170.00" stroke="#16344f" stroke-width="3"/><path d="M 441.10 180.29 L 445.00 170.00 L 434.24 172.28" fill="none" stroke="#16344f" stroke-width="3"/><line x1="375.00" y1="285.00" x2="445.00" y2="365.00" stroke="#16344f" stroke-width="3"/><path d="M 434.67 361.21 L 445.00 365.00 L 442.61 354.26" fill="none" stroke="#16344f" stroke-width="3"/><rect x="890" y="175" width="300" height="145" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1040.00" y="247.50" font-size="25" fill="#16344f" text-anchor="middle">整体分组后划分</text><text x="1040.00" y="276.50" font-size="20" fill="#16344f" text-anchor="middle">不把8条拆到不同集合</text><line x1="790.00" y1="170.00" x2="880.00" y2="225.00" stroke="#16344f" stroke-width="3"/><path d="M 869.01 224.47 L 880.00 225.00 L 874.51 215.47" fill="none" stroke="#16344f" stroke-width="3"/><line x1="790.00" y1="365.00" x2="880.00" y2="280.00" stroke="#16344f" stroke-width="3"/><path d="M 876.60 290.46 L 880.00 280.00 L 869.36 282.79" fill="none" stroke="#16344f" stroke-width="3"/><text x="50.00" y="515.00" font-size="24" fill="#16344f" text-anchor="start">15组按固定种子分成9 / 3 / 3组，对应训练72、验证24、测试24条。</text><text x="50.00" y="580.00" font-size="23" fill="#16344f" text-anchor="start">逐行随机划分可能让同一字母对的近重复变体跨集，夸大未见组合的表现。</text></g></svg>
