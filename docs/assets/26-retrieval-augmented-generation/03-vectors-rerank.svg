<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>图26-3 向量分数与候选重排的作用范围</title><rect width="960" height="440" rx="12" fill="#f7fafc"/><g font-family="Microsoft YaHei, SimSun, Arial, sans-serif"><text x="26" y="38" font-size="25" fill="#18324f">图26-3 向量分数与候选重排的作用范围</text><rect x="28" y="86" width="420" height="245" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="48" y="120" font-size="23" fill="#18324f">查询 u=(1,1)</text><text x="48" y="168" font-size="20" fill="#18324f">v₁=(2,0)：点积2，余弦0.7071</text><text x="48" y="214" font-size="20" fill="#18324f">v₂=(1,1)：点积2，余弦1</text><text x="48" y="272" font-size="20" fill="#18324f">先明确是否归一化，再比较排名。</text><rect x="490" y="86" width="442" height="245" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="510" y="120" font-size="21" fill="#18324f">检索候选 → 联合检查 → 上下文</text><text x="510" y="168" font-size="20" fill="#18324f">双塔：问题与片段分开编码</text><text x="510" y="211" font-size="20" fill="#18324f">重排：只处理已收到的k个候选</text><text x="510" y="254" font-size="18" fill="#18324f">本章规则检查实体与字段，无神经训练</text><text x="510" y="298" font-size="20" fill="#18324f">候选外证据：重排不能自动找回</text><text x="28" y="385" font-size="20" fill="#18324f">矩阵评分 s = Vû；小索引精确扫描。语义泛化另需训练与评价。</text></g></svg>
