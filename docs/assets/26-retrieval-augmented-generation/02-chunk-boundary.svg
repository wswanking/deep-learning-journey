<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>图26-2 切分边界：宽度8、重叠2、步幅6</title><rect width="960" height="440" rx="12" fill="#f7fafc"/><g font-family="Microsoft YaHei, SimSun, Arial, sans-serif"><text x="26" y="38" font-size="25" fill="#18324f">图26-2 切分边界：宽度8、重叠2、步幅6</text><text x="28" y="82" font-size="23" fill="#18324f">原串：A B C D E F G H I J K L M N</text><rect x="28" y="110" width="430" height="85" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="44" y="138" font-size="19" fill="#18324f">第一块 [0,8)</text><text x="44" y="174" font-size="27" fill="#18324f">ABCDEFGH</text><rect x="490" y="110" width="430" height="85" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="506" y="138" font-size="19" fill="#18324f">第二块 [6,14)</text><text x="506" y="174" font-size="27" fill="#18324f">GHIJKLMN</text><rect x="28" y="220" width="430" height="85" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="44" y="248" font-size="19" fill="#18324f">无重叠 [0,8)</text><text x="44" y="284" font-size="27" fill="#18324f">ABCDEFGH</text><rect x="490" y="220" width="430" height="85" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="506" y="248" font-size="19" fill="#18324f">无重叠 [8,14)</text><text x="506" y="284" font-size="27" fill="#18324f">IJKLMN</text><text x="28" y="350" font-size="21" fill="#18324f">证据 GHIJ：重叠2时第二块完整保留；重叠0时两块都截断。</text><text x="28" y="394" font-size="19" fill="#18324f">增加重叠也增加重复编码；字符坐标不能直接当作字节token预算。</text></g></svg>
