<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>图26-1 离线入库与在线回答：保留完整证据链</title><rect width="960" height="440" rx="12" fill="#f7fafc"/><g font-family="Microsoft YaHei, SimSun, Arial, sans-serif"><text x="26" y="38" font-size="25" fill="#18324f">图26-1 离线入库与在线回答：保留完整证据链</text><text x="28" y="85" font-size="21" fill="#18324f">离线：版本化的资料与表示</text><rect x="28" y="106" width="185" height="72" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="40" y="136" font-size="21" fill="#18324f">原文快照</text><text x="40" y="162" font-size="16" fill="#18324f">文档ID / 原文区间</text><rect x="270" y="106" width="185" height="72" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="282" y="136" font-size="21" fill="#18324f">切分与编码</text><text x="282" y="162" font-size="16" fill="#18324f">宽度 / 重叠 / 特征</text><rect x="512" y="106" width="185" height="72" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="524" y="136" font-size="21" fill="#18324f">精确向量索引</text><text x="524" y="162" font-size="16" fill="#18324f">24 × 280，float64</text><path d="M214 142 H264 m-8 -5 l8 5 l-8 5" fill="none" stroke="#3175bb" stroke-width="2"/><path d="M456 142 H506 m-8 -5 l8 5 l-8 5" fill="none" stroke="#3175bb" stroke-width="2"/><text x="28" y="226" font-size="21" fill="#18324f">在线：每个中间结果都能追溯</text><rect x="28" y="248" width="198" height="72" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="40" y="278" font-size="21" fill="#18324f">问题向量</text><text x="40" y="304" font-size="16" fill="#18324f">沿用冻结IDF</text><rect x="263" y="248" width="198" height="72" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="275" y="278" font-size="21" fill="#18324f">检索 → 重排</text><text x="275" y="304" font-size="16" fill="#18324f">k=3，最多2块</text><rect x="498" y="248" width="198" height="72" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="510" y="278" font-size="21" fill="#18324f">上下文 → 回答</text><text x="510" y="304" font-size="16" fill="#18324f">记录真实输入</text><rect x="733" y="248" width="198" height="72" rx="8" fill="#edf5ff" stroke="#88aacd"/><text x="745" y="278" font-size="21" fill="#18324f">引用核验</text><text x="745" y="304" font-size="16" fill="#18324f">ID / 区间 / 支持</text><path d="M227 284 H257 m-8 -5 l8 5 l-8 5" fill="none" stroke="#3175bb" stroke-width="2"/><path d="M462 284 H492 m-8 -5 l8 5 l-8 5" fill="none" stroke="#3175bb" stroke-width="2"/><path d="M697 284 H727 m-8 -5 l8 5 l-8 5" fill="none" stroke="#3175bb" stroke-width="2"/><text x="28" y="375" font-size="21" fill="#18324f">检索分数、回答正确与引用支持，分别评价。</text><text x="28" y="408" font-size="18" fill="#18324f">本章检索用字符统计；生成探针读取第21章真实35,328参数基座。</text></g></svg>
