<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="c17-01-architecture-title c17-01-architecture-desc"><title id="c17-01-architecture-title">自编码器数据流与重建目标</title><desc id="c17-01-architecture-desc">原创结构图，区分输入、代码、编码器、解码器和重建；没有外部标签。</desc><defs><marker id="c17-01-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="1000" height="490" fill="#f6f9fc" rx="14"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" fill="#193047"><text x="30" y="44" font-size="29" font-weight="700">图17-1  编码、瓶颈和重建：目标来自输入自身</text><rect x="30" y="175" width="150" height="100" fill="white" rx="10" stroke="#88a7c3" stroke-width="2"/><text x="105.0" y="213" font-size="24" text-anchor="middle">输入 x</text><text x="105.0" y="252" font-size="21" text-anchor="middle">d维</text><rect x="235" y="175" width="180" height="100" fill="white" rx="10" stroke="#88a7c3" stroke-width="2"/><text x="325.0" y="213" font-size="24" text-anchor="middle">编码器 fθ</text><text x="325.0" y="252" font-size="21" text-anchor="middle">d → r</text><rect x="465" y="155" width="100" height="100" fill="white" rx="10" stroke="#88a7c3" stroke-width="2"/><text x="515.0" y="193" font-size="24" text-anchor="middle">代码 z</text><text x="515.0" y="232" font-size="21" text-anchor="middle">r维</text><rect x="615" y="175" width="170" height="100" fill="white" rx="10" stroke="#88a7c3" stroke-width="2"/><text x="700.0" y="213" font-size="24" text-anchor="middle">解码器 gψ</text><text x="700.0" y="252" font-size="21" text-anchor="middle">r → d</text><rect x="835" y="175" width="135" height="100" fill="white" rx="10" stroke="#88a7c3" stroke-width="2"/><text x="902.5" y="213" font-size="24" text-anchor="middle">重建 x̂</text><text x="902.5" y="252" font-size="21" text-anchor="middle">d维</text><line x1="180" y1="220" x2="230" y2="220" stroke="#246cc0" stroke-width="3" marker-end="url(#c17-01-architecture-arrow)"/><line x1="415" y1="220" x2="460" y2="220" stroke="#246cc0" stroke-width="3" marker-end="url(#c17-01-architecture-arrow)"/><line x1="565" y1="220" x2="610" y2="220" stroke="#246cc0" stroke-width="3" marker-end="url(#c17-01-architecture-arrow)"/><line x1="785" y1="220" x2="830" y2="220" stroke="#246cc0" stroke-width="3" marker-end="url(#c17-01-architecture-arrow)"/><path d="M105.000,275.000 L105.000,330.000 L900.000,330.000 L900.000,278.000" fill="none" stroke="#246cc0" stroke-width="2" stroke-dasharray="7 5"/><text x="500" y="360" font-size="22" text-anchor="middle">比较输入与重建：按全部样本、全部坐标平均平方误差</text><text x="30" y="415" font-size="22" >r &lt; d 限制通过的坐标数；可压缩结构，也可能丢掉有用信息。</text><text x="30" y="457" font-size="22" >代码坐标没有天然语义：可逆地改坐标并配套改解码器，重建仍可相同。</text></g></svg>
