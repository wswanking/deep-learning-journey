<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 645" role="img" aria-labelledby="c17-05-reconstruction-denoising-generation-title c17-05-reconstruction-denoising-generation-desc"><title id="c17-05-reconstruction-denoising-generation-title">普通重建、去噪和采样所需的信息</title><desc id="c17-05-reconstruction-denoising-generation-desc">原创关系图，明确输入与目标的区别，以及生成使用需要额外代码分布。</desc><defs><marker id="c17-05-reconstruction-denoising-generation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="1000" height="645" fill="#f6f9fc" rx="14"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" fill="#193047"><text x="30" y="44" font-size="28" font-weight="700">图17-5  三种输入与目标关系：普通重建、去噪、采样</text><rect x="30" y="98" width="940" height="105" fill="white" rx="12" stroke="#88a7c3" stroke-width="2"/><text x="50" y="140" font-size="24" font-weight="700">普通重建</text><text x="235" y="140" font-size="24" >输入 x → 编码 → 解码 → 重建</text><text x="235" y="178" font-size="21" >目标：同一个 x</text><rect x="30" y="238" width="940" height="105" fill="white" rx="12" stroke="#88a7c3" stroke-width="2"/><text x="50" y="280" font-size="24" font-weight="700">去噪任务</text><text x="235" y="280" font-size="24" >输入 x̃ → 编码 → 解码 → 重建</text><text x="235" y="318" font-size="21" >目标：扰动前 x</text><rect x="30" y="378" width="940" height="105" fill="white" rx="12" stroke="#88a7c3" stroke-width="2"/><text x="50" y="420" font-size="24" font-weight="700">生成使用</text><text x="235" y="420" font-size="24" >采样 z ~ p(z) → 解码 → 新输出</text><text x="235" y="458" font-size="21" >需定义代码采样分布</text><text x="30" y="565" font-size="22" >重建目标没有自动规定 p(z)；任意远处的代码可能落在训练未约束区域。</text><text x="30" y="610" font-size="22" >本章CPU实验属于第一行；第二、三行是关系说明，不冒充已训练结果。</text></g></svg>
