<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 645" role="img" aria-labelledby="c17-02-pca-projection-title c17-02-pca-projection-desc"><title id="c17-02-pca-projection-title">PCA投影与精确误差手算</title><desc id="c17-02-pca-projection-desc">四个手算点及正交投影，实线为保留子空间，虚线为残差；不是实验散点。</desc><defs><marker id="c17-02-pca-projection-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="1000" height="645" fill="#f6f9fc" rx="14"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" fill="#193047"><text x="30" y="44" font-size="28" font-weight="700">图17-2  PCA手算：投影到一条直线，丢掉垂直分量</text><text x="30" y="82" font-size="22" >四点 (±2, ±0.5)；训练均值为0；保留方差较大的横轴。</text><line x1="125" y1="165" x2="125" y2="425" stroke="#193047" stroke-width="2" /><line x1="125" y1="425" x2="835" y2="425" stroke="#193047" stroke-width="2" /><text x="125.0" y="451" font-size="16" text-anchor="middle">-2.5</text><text x="480.0" y="451" font-size="16" text-anchor="middle">0</text><text x="835.0" y="451" font-size="16" text-anchor="middle">2.5</text><line x1="125" y1="425" x2="835" y2="425" stroke="#cedae5" stroke-width="1.5" /><text x="115" y="431" font-size="16" text-anchor="end">-1</text><line x1="125" y1="360.0" x2="835" y2="360.0" stroke="#cedae5" stroke-width="1.5" /><text x="115" y="366.0" font-size="16" text-anchor="end">-0.5</text><line x1="125" y1="295.0" x2="835" y2="295.0" stroke="#cedae5" stroke-width="1.5" /><text x="115" y="301.0" font-size="16" text-anchor="end">0</text><line x1="125" y1="230.0" x2="835" y2="230.0" stroke="#cedae5" stroke-width="1.5" /><text x="115" y="236.0" font-size="16" text-anchor="end">0.5</text><line x1="125" y1="165" x2="835" y2="165" stroke="#cedae5" stroke-width="1.5" /><text x="115" y="171" font-size="16" text-anchor="end">1</text><text x="480.0" y="485" font-size="20" text-anchor="middle">第一坐标 x₁</text><text x="125" y="145" font-size="19" >第二坐标 x₂</text><line x1="125.0" y1="295.0" x2="835.0" y2="295.0" stroke="#246cc0" stroke-width="3" /><line x1="196.0" y1="360.0" x2="196.0" y2="295.0" stroke="#ba5a18" stroke-width="2" stroke-dasharray="5 4"/><circle cx="196.000" cy="360.000" r="6" fill="#ba5a18"/><line x1="196.0" y1="230.0" x2="196.0" y2="295.0" stroke="#ba5a18" stroke-width="2" stroke-dasharray="5 4"/><circle cx="196.000" cy="230.000" r="6" fill="#ba5a18"/><rect x="190.0" y="289.0" width="12" height="12" fill="#246cc0" /><line x1="764.0" y1="360.0" x2="764.0" y2="295.0" stroke="#ba5a18" stroke-width="2" stroke-dasharray="5 4"/><circle cx="764.000" cy="360.000" r="6" fill="#ba5a18"/><line x1="764.0" y1="230.0" x2="764.0" y2="295.0" stroke="#ba5a18" stroke-width="2" stroke-dasharray="5 4"/><circle cx="764.000" cy="230.000" r="6" fill="#ba5a18"/><rect x="758.0" y="289.0" width="12" height="12" fill="#246cc0" /><text x="30" y="535" font-size="22" >橙圆：原输入；蓝方：重建。四个点各丢掉 ±0.5 的纵向分量。</text><text x="30" y="575" font-size="22" >每样本平方范数误差 = 0.25；每坐标MSE = 0.25 / 2 = 0.125。</text><text x="30" y="615" font-size="22" >C = diag(4, 0.25)；保留横向方差4，丢弃方差0.25。</text></g></svg>
