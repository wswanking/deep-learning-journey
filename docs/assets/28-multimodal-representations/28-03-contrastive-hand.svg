<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="510" viewBox="0 0 1180 510" role="img"><title>双向对比损失手算</title><desc>两个正交图像向量和文字向量，温度1时对角logit1，非对角0，展示行和列归一化以及最终平均。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="35" y="45" font-size="28" fill="#163451" text-anchor="start">图28-3 两对样例手算：行找文字，列找图像</text><text x="90" y="115" font-size="24" fill="#163451" text-anchor="start">logits S</text><rect x="90" y="155" width="110" height="87" fill="#dce9ff" stroke="white"/><text x="145" y="210" font-size="22" fill="#163451" text-anchor="middle">1</text><rect x="203" y="155" width="110" height="87" fill="#faf4ec" stroke="white"/><text x="258" y="210" font-size="22" fill="#163451" text-anchor="middle">0</text><rect x="90" y="245" width="110" height="87" fill="#faf4ec" stroke="white"/><text x="145" y="300" font-size="22" fill="#163451" text-anchor="middle">0</text><rect x="203" y="245" width="110" height="87" fill="#dce9ff" stroke="white"/><text x="258" y="300" font-size="22" fill="#163451" text-anchor="middle">1</text><text x="455" y="115" font-size="24" fill="#163451" text-anchor="start">沿行softmax</text><rect x="455" y="155" width="110" height="87" fill="#dce9ff" stroke="white"/><text x="510" y="210" font-size="22" fill="#163451" text-anchor="middle">0.731059</text><rect x="568" y="155" width="110" height="87" fill="#faf4ec" stroke="white"/><text x="623" y="210" font-size="22" fill="#163451" text-anchor="middle">0.268941</text><rect x="455" y="245" width="110" height="87" fill="#faf4ec" stroke="white"/><text x="510" y="300" font-size="22" fill="#163451" text-anchor="middle">0.268941</text><rect x="568" y="245" width="110" height="87" fill="#dce9ff" stroke="white"/><text x="623" y="300" font-size="22" fill="#163451" text-anchor="middle">0.731059</text><text x="820" y="115" font-size="24" fill="#163451" text-anchor="start">沿列softmax</text><rect x="820" y="155" width="110" height="87" fill="#dce9ff" stroke="white"/><text x="875" y="210" font-size="22" fill="#163451" text-anchor="middle">0.731059</text><rect x="933" y="155" width="110" height="87" fill="#faf4ec" stroke="white"/><text x="988" y="210" font-size="22" fill="#163451" text-anchor="middle">0.268941</text><rect x="820" y="245" width="110" height="87" fill="#faf4ec" stroke="white"/><text x="875" y="300" font-size="22" fill="#163451" text-anchor="middle">0.268941</text><rect x="933" y="245" width="110" height="87" fill="#dce9ff" stroke="white"/><text x="988" y="300" font-size="22" fill="#163451" text-anchor="middle">0.731059</text><text x="40" y="405" font-size="24" fill="#163451" text-anchor="start">每个正确项概率 e/(e+1) ≈ 0.731059；每项负对数 ≈ 0.313262。</text><text x="40" y="460" font-size="23" fill="#163451" text-anchor="start">两方向各对2项取平均，再各乘1/2：最终L = log(1+e⁻¹)，不再除以矩阵4项。</text></g></svg>
