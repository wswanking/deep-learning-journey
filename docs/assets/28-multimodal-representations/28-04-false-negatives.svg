<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>假负例与多正例相关性</title><desc>两幅同语义图像和两条相同文字构成多重相关，单正例对角损失存在ln2下界。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="35" y="45" font-size="28" fill="#163451" text-anchor="start">图28-4 假负例：两个不同记录可能具有相同语义</text><rect x="55" y="120" width="280" height="75" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="195.0" y="165.5" font-size="24" fill="#2459bf" text-anchor="middle">图像1：红色圆形</text><rect x="55" y="280" width="280" height="75" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="195.0" y="325.5" font-size="24" fill="#2459bf" text-anchor="middle">图像2：另一红圆形</text><path d="M335,157L470,157" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M460,150L470,157L460,164" fill="none" stroke="#2459bf" stroke-width="3"/><path d="M335,317L470,317" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M460,310L470,317L460,324" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="470" y="120" width="300" height="75" rx="12" fill="#f5f9ff" stroke="#008b86" stroke-width="2"/><text x="620.0" y="165.5" font-size="24" fill="#008b86" text-anchor="middle">文字1：红色圆形</text><rect x="470" y="280" width="300" height="75" rx="12" fill="#f5f9ff" stroke="#008b86" stroke-width="2"/><text x="620.0" y="325.5" font-size="24" fill="#008b86" text-anchor="middle">文字2：红色圆形</text><path d="M335,157L470,317" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray="7 5"/><path d="M335,317L470,157" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray="7 5"/><text x="830" y="185" font-size="23" fill="#163451" text-anchor="start">实线：指定正例</text><text x="830" y="250" font-size="23" fill="#cf6b12" text-anchor="start">虚线：同样相关</text><text x="830" y="315" font-size="23" fill="#cf6b12" text-anchor="start">不能当真负例</text><text x="40" y="440" font-size="23" fill="#163451" text-anchor="start">若两条文字向量相同，任一行两个logit相同；单正例目标仍强制只有对角正确。</text><text x="40" y="490" font-size="23" fill="#163451" text-anchor="start">两候选时正确概率最多1/2，单正例损失至少ln2；语义未错，配对假设已不合适。</text><text x="40" y="540" font-size="23" fill="#163451" text-anchor="start">训练每批只放每种概念1张图；检索评价把同一概念的多张图都计为相关。</text></g></svg>
