<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="570" viewBox="0 0 1210 570" role="img"><title>图文双塔与相似度</title><desc>独立图像编码器和文字属性编码器输出同维归一化向量，通过矩阵点积学习匹配。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="35" y="45" font-size="28" fill="#163451" text-anchor="start">图28-2 图文双塔：分别编码，在同一嵌入空间比较</text><rect x="40" y="110" width="320" height="80" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="200.0" y="158.0" font-size="24" fill="#2459bf" text-anchor="middle">图像：RGB [B,3,16,16]</text><path d="M360,150L415,150" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M405,143L415,150L405,157" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="415" y="110" width="330" height="80" rx="12" fill="#f5f9ff" stroke="#008b86" stroke-width="2"/><text x="580.0" y="158.0" font-size="24" fill="#008b86" text-anchor="middle">视觉编码器 → 图像向量</text><path d="M745,150L800,150" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M790,143L800,150L790,157" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="800" y="110" width="240" height="80" rx="12" fill="#f5f9ff" stroke="#cf6b12" stroke-width="2"/><text x="920.0" y="158.0" font-size="24" fill="#cf6b12" text-anchor="middle">投影 + L2归一化</text><rect x="40" y="295" width="320" height="80" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="200.0" y="343.0" font-size="24" fill="#2459bf" text-anchor="middle">文字：颜色/形状 [B,2]</text><path d="M360,335L415,335" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M405,328L415,335L405,342" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="415" y="295" width="330" height="80" rx="12" fill="#f5f9ff" stroke="#008b86" stroke-width="2"/><text x="580.0" y="343.0" font-size="24" fill="#008b86" text-anchor="middle">属性编码器 → 文字向量</text><path d="M745,335L800,335" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M790,328L800,335L790,342" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="800" y="295" width="240" height="80" rx="12" fill="#f5f9ff" stroke="#cf6b12" stroke-width="2"/><text x="920.0" y="343.0" font-size="24" fill="#cf6b12" text-anchor="middle">投影 + L2归一化</text><rect x="1080" y="205" width="110" height="90" rx="12" fill="#f5f9ff" stroke="#cf6b12" stroke-width="2"/><text x="1135.0" y="258.0" font-size="24" fill="#cf6b12" text-anchor="middle">点积</text><path d="M920,190L920,220" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M920,220L1060,220" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M1060,220L1060,232" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M1060,232L1080,232" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M1070,225L1080,232L1070,239" fill="none" stroke="#cf6b12" stroke-width="3"/><path d="M1040,335L1060,335" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M1060,335L1060,273" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M1060,273L1080,273" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M1070,266L1080,273L1070,280" fill="none" stroke="#cf6b12" stroke-width="3"/><text x="40" y="465" font-size="24" fill="#163451" text-anchor="start">图文不需逐坐标相同；匹配对的点积应高于不匹配候选。</text><text x="40" y="520" font-size="23" fill="#163451" text-anchor="start">相似度矩阵S = 图像嵌入 × 文字嵌入ᵀ / τ；双向交叉熵沿行/列分别归一化。</text></g></svg>
