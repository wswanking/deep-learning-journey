<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="560" viewBox="0 0 1230 560" role="img"><title>图像patch与视觉词元</title><desc>原创红圆形分为16个图像patch，展开48维并投影32维，加位置后形成连续视觉词元。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="35" y="45" font-size="28" fill="#163451" text-anchor="start">图28-1 从RGB图像到视觉词元：patch是空间小块，不是离散文字编号</text><rect x="50" y="110" width="240" height="240" fill="#10151a"/><circle cx="170" cy="230" r="78" fill="#d52c22"/><path d="M50,110L50,350" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M50,110L290,110" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M110,110L110,350" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M50,170L290,170" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M170,110L170,350" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M50,230L290,230" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M230,110L230,350" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M50,290L290,290" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M290,110L290,350" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><path d="M50,350L290,350" fill="none" stroke="#a7bbd4" stroke-width="2" stroke-dasharray=""/><text x="50" y="390" font-size="23" fill="#163451" text-anchor="start">16×16×3 → 16块4×4×3</text><path d="M300,225L355,225" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M345,218L355,225L345,232" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="355" y="180" width="280" height="90" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="495.0" y="233.0" font-size="24" fill="#2459bf" text-anchor="middle">48维 → 32维投影</text><path d="M635,225L700,225" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M690,218L700,225L690,232" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="710" y="150" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="731" y="185" font-size="18" fill="#163451" text-anchor="middle">1</text><rect x="767" y="150" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="788" y="185" font-size="18" fill="#163451" text-anchor="middle">2</text><rect x="824" y="150" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="845" y="185" font-size="18" fill="#163451" text-anchor="middle">3</text><rect x="881" y="150" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="902" y="185" font-size="18" fill="#163451" text-anchor="middle">4</text><rect x="938" y="150" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="959" y="185" font-size="18" fill="#163451" text-anchor="middle">5</text><rect x="995" y="150" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="1016" y="185" font-size="18" fill="#163451" text-anchor="middle">6</text><rect x="1052" y="150" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="1073" y="185" font-size="18" fill="#163451" text-anchor="middle">7</text><rect x="1109" y="150" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="1130" y="185" font-size="18" fill="#163451" text-anchor="middle">8</text><rect x="710" y="240" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="731" y="275" font-size="18" fill="#163451" text-anchor="middle">9</text><rect x="767" y="240" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="788" y="275" font-size="18" fill="#163451" text-anchor="middle">10</text><rect x="824" y="240" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="845" y="275" font-size="18" fill="#163451" text-anchor="middle">11</text><rect x="881" y="240" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="902" y="275" font-size="18" fill="#163451" text-anchor="middle">12</text><rect x="938" y="240" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="959" y="275" font-size="18" fill="#163451" text-anchor="middle">13</text><rect x="995" y="240" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="1016" y="275" font-size="18" fill="#163451" text-anchor="middle">14</text><rect x="1052" y="240" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="1073" y="275" font-size="18" fill="#163451" text-anchor="middle">15</text><rect x="1109" y="240" width="43" height="55" fill="#dce9ff" stroke="#2459bf"/><text x="1130" y="275" font-size="18" fill="#163451" text-anchor="middle">16</text><text x="710" y="390" font-size="24" fill="#163451" text-anchor="start">16个连续向量 + 位置嵌入</text><text x="40" y="465" font-size="24" fill="#163451" text-anchor="start">编码器允许每个patch读取整幅图的其他patch，再池化为图像级表示。</text><text x="40" y="515" font-size="23" fill="#163451" text-anchor="start">本章保留forward_tokens输出[B,16,32]；用于检索的投影归一化表示是[B,16]。</text></g></svg>
