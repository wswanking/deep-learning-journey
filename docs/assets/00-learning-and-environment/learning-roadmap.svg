<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="c00-road-title c00-road-desc">
  <title id="c00-road-title">图00-1：深度学习教程六阶段学习路线</title>
  <desc id="c00-road-desc">从00到05章学习准备与基础出发，依次学习06到10章神经网络训练、11到16章典型网络与Transformer、17到19章表示与生成、20到27章大语言模型、28到30章多模态与综合实践。每阶段连起概念、手算、代码与实验记录。</desc>
  <defs>
    <marker id="c00-road-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677f"/></marker>
  </defs>
  <rect width="900" height="720" rx="16" fill="#f7f9fc"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44">
    <text x="30" y="42" font-size="28" font-weight="700">从可解释的小计算，走向语言与多模态模型</text>
    <text x="30" y="73" font-size="20" fill="#52677f">按编号前进；每一步保留输入、计算、结果与证据。</text>
    <g fill="none" stroke="#52677f" stroke-width="3" marker-end="url(#c00-road-arrow)">
      <path d="M 420 165 H 476"/>
      <path d="M 675 235 V 261 H 225 V 286"/>
      <path d="M 420 360 H 476"/>
      <path d="M 675 430 V 456 H 225 V 481"/>
      <path d="M 420 555 H 476"/>
    </g>
    <g>
      <rect x="30" y="95" width="390" height="140" rx="12" fill="#e7f1ff" stroke="#2369bd" stroke-width="2"/>
      <rect x="480" y="95" width="390" height="140" rx="12" fill="#ffffff" stroke="#a6b7c9" stroke-width="2"/>
      <rect x="30" y="290" width="390" height="140" rx="12" fill="#ffffff" stroke="#a6b7c9" stroke-width="2"/>
      <rect x="480" y="290" width="390" height="140" rx="12" fill="#ffffff" stroke="#a6b7c9" stroke-width="2"/>
      <rect x="30" y="485" width="390" height="140" rx="12" fill="#ffffff" stroke="#a6b7c9" stroke-width="2"/>
      <rect x="480" y="485" width="390" height="140" rx="12" fill="#eaf6ef" stroke="#38805b" stroke-width="2"/>
    </g>
    <g font-size="24" font-weight="700">
      <text x="50" y="130">① 00—05 学习准备与基础</text>
      <text x="500" y="130">② 06—10 网络如何学习</text>
      <text x="50" y="325">③ 11—16 典型网络与注意力</text>
      <text x="500" y="325">④ 17—19 表示与生成模型</text>
      <text x="50" y="520">⑤ 20—27 大语言模型</text>
      <text x="500" y="520">⑥ 28—30 多模态与项目</text>
    </g>
    <g font-size="22" fill="#364e68">
      <text x="50" y="170">环境 → 数学 → 机器学习</text>
      <text x="50" y="207">当前第00章：先打通运行流程</text>
      <text x="500" y="170">前向 → 反向 → 优化 → 泛化</text>
      <text x="500" y="207">解释参数如何改变预测</text>
      <text x="50" y="365">CNN → RNN → Transformer</text>
      <text x="50" y="402">追踪不同结构的输入与输出</text>
      <text x="500" y="365">自编码器 → 对抗生成 → 扩散</text>
      <text x="500" y="402">理解目标、采样和失败现象</text>
      <text x="50" y="560">预训练 → 微调 → 推理与评估</text>
      <text x="50" y="597">用小实验串起文本学习链路</text>
      <text x="500" y="560">图文表示 → 视觉语言 → 综合</text>
      <text x="500" y="597">交付可复现结果与局限分析</text>
    </g>
    <path d="M 30 652 H 870" stroke="#c7d3df" stroke-width="2"/>
    <text x="30" y="685" font-size="22" fill="#364e68">每一阶段：概念与矢量图 → 手算 → CPU代码 → 记录、评估与复现</text>
