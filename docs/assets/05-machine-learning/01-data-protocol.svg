<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">训练验证测试与训练集预处理</title><desc id="desc">依据本章数学定义原创绘制，全部由矢量文字、路径和矩形组成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="700" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="40" y="44" font-size="27" fill="#183044" text-anchor="start">图05-1  先划分数据，再拟合预处理；测试集保留到方案冻结</text><rect x="420" y="80" width="360" height="70" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="600" y="125" font-size="25" fill="#183044" text-anchor="middle">带标签样本 D = {(x, y)}</text><rect x="40" y="218" width="320" height="120" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="200" y="258" font-size="25" fill="#176aa0" text-anchor="middle">训练集 60%</text><text x="200" y="305" font-size="21" fill="#183044" text-anchor="middle">拟合均值/标准差，更新参数</text><path d="M600 160 L200 207" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="218" width="320" height="120" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="600" y="258" font-size="25" fill="#ad5015" text-anchor="middle">验证集 20%</text><text x="600" y="305" font-size="21" fill="#183044" text-anchor="middle">选择学习率与检查点</text><path d="M600 160 L600 207" fill="none" stroke="#ad5015" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="218" width="320" height="120" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="1000" y="258" font-size="25" fill="#087c63" text-anchor="middle">测试集 20%</text><text x="1000" y="305" font-size="21" fill="#183044" text-anchor="middle">方案冻结后评估一次</text><path d="M600 160 L1000 207" fill="none" stroke="#087c63" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="400" width="320" height="142" rx="12" fill="#edf5fb" stroke="#a8bdcd" stroke-width="2"/><text x="200" y="443" font-size="24" fill="#176aa0" text-anchor="middle">仅训练集拟合变换 T</text><text x="200" y="486" font-size="21" fill="#183044" text-anchor="middle">μ、σ 固定后应用到三份数据</text><text x="200" y="521" font-size="20" fill="#476276" text-anchor="middle">不能用验证/测试重新估计</text><path d="M200 348 L200 390" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="400" width="320" height="142" rx="12" fill="#fff3e6" stroke="#a8bdcd" stroke-width="2"/><text x="600" y="443" font-size="24" fill="#ad5015" text-anchor="middle">训练候选模型</text><text x="600" y="486" font-size="21" fill="#183044" text-anchor="middle">预测 → 损失 → 梯度 → 更新</text><text x="600" y="521" font-size="21" fill="#476276" text-anchor="middle">训练集决定参数 θ</text><path d="M370 469 L430 469" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="400" width="320" height="142" rx="12" fill="#edf7f0" stroke="#a8bdcd" stroke-width="2"/><text x="1000" y="443" font-size="23" fill="#087c63" text-anchor="middle">冻结选择后的模型与 T</text><text x="1000" y="486" font-size="21" fill="#183044" text-anchor="middle">验证选方案；测试估计效果</text><text x="1000" y="521" font-size="21" fill="#476276" text-anchor="middle">测试结果不再反馈调参</text><path d="M770 469 L830 469" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="605" font-size="22" fill="#183044" text-anchor="start">注意：验证集不参与梯度更新，但已经参与方案选择，因此其分数也不是最终独立报告。</text><text x="40" y="650" font-size="21" fill="#183044" text-anchor="start">随机划分适用于这里的独立同分布合成样本；用户/病人/文档分组或时间预测需采用对应划分。</text></g></svg>
