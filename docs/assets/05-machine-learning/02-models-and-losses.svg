<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 845" role="img" aria-labelledby="title desc"><title id="title">回归二分类多分类的得分概率损失</title><desc id="desc">依据本章数学定义原创绘制，全部由矢量文字、路径和矩形组成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="845" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="40" y="44" font-size="27" fill="#183044" text-anchor="start">图05-2  同一线性得分，三种任务需要不同输出含义与损失</text><rect x="40" y="95" width="1120" height="180" rx="12" fill="#f4f7fa" stroke="#a8bdcd" stroke-width="2"/><text x="60" y="130" font-size="25" fill="#176aa0" text-anchor="start">回归</text><text x="65" y="179" font-size="23" fill="#183044" text-anchor="start">ŷ = wᵀx + b</text><path d="M330 173 L392 173" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><text x="415" y="179" font-size="23" fill="#176aa0" text-anchor="start">输出：任意实数</text><path d="M695 173 L748 173" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><text x="775" y="179" font-size="21" fill="#183044" text-anchor="start">ℓ = (ŷ − y)²</text><text x="65" y="238" font-size="22" fill="#476276" text-anchor="start">预测(0,1)、目标(1,3)：平均损失2.5</text><rect x="40" y="310" width="1120" height="180" rx="12" fill="#f4f7fa" stroke="#a8bdcd" stroke-width="2"/><text x="60" y="345" font-size="25" fill="#ad5015" text-anchor="start">二分类</text><text x="65" y="394" font-size="23" fill="#183044" text-anchor="start">z = wᵀx + b</text><path d="M330 388 L392 388" fill="none" stroke="#ad5015" stroke-width="3" marker-end="url(#arrow)"/><text x="415" y="394" font-size="23" fill="#ad5015" text-anchor="start">p = sigmoid(z)</text><path d="M695 388 L748 388" fill="none" stroke="#ad5015" stroke-width="3" marker-end="url(#arrow)"/><text x="775" y="394" font-size="21" fill="#183044" text-anchor="start">ℓ = −y log p − (1−y) log(1−p)</text><text x="65" y="453" font-size="22" fill="#476276" text-anchor="start">z=log 3 → p=0.75；y=1时损失0.2877</text><rect x="40" y="525" width="1120" height="180" rx="12" fill="#f4f7fa" stroke="#a8bdcd" stroke-width="2"/><text x="60" y="560" font-size="25" fill="#087c63" text-anchor="start">互斥多分类</text><text x="65" y="609" font-size="23" fill="#183044" text-anchor="start">z = Wx + b</text><path d="M330 603 L392 603" fill="none" stroke="#087c63" stroke-width="3" marker-end="url(#arrow)"/><text x="415" y="609" font-size="23" fill="#087c63" text-anchor="start">p = softmax(z)</text><path d="M695 603 L748 603" fill="none" stroke="#087c63" stroke-width="3" marker-end="url(#arrow)"/><text x="775" y="609" font-size="21" fill="#183044" text-anchor="start">ℓ = −log p_y</text><text x="65" y="668" font-size="22" fill="#476276" text-anchor="start">z=(log 2,0,0) → p=(0.5,0.25,0.25)</text><line x1="925" y1="242" x2="1110" y2="242" stroke="#7e95a5" stroke-width="1.5"/><path d="M928.00 241.57 L930.17 241.46 L932.35 241.33 L934.52 241.17 L936.70 240.98 L938.88 240.76 L941.05 240.49 L943.23 240.18 L945.40 239.81 L947.58 239.39 L949.75 238.90 L951.92 238.34 L954.10 237.70 L956.27 236.98 L958.45 236.17 L960.63 235.28 L962.80 234.28 L964.98 233.19 L967.15 232.00 L969.33 230.72 L971.50 229.34 L973.67 227.87 L975.85 226.32 L978.02 224.70 L980.20 223.02 L982.38 221.29 L984.55 219.53 L986.73 217.75 L988.90 215.99 L991.08 214.25 L993.25 212.56 L995.42 210.95 L997.60 209.42 L999.77 208.02 L1001.95 206.76 L1004.13 205.65 L1006.30 204.72 L1008.48 203.97 L1010.65 203.44 L1012.83 203.11 L1015.00 203.00 L1017.17 203.11 L1019.35 203.44 L1021.52 203.97 L1023.70 204.72 L1025.88 205.65 L1028.05 206.76 L1030.22 208.02 L1032.40 209.42 L1034.58 210.95 L1036.75 212.56 L1038.92 214.25 L1041.10 215.99 L1043.28 217.75 L1045.45 219.53 L1047.63 221.29 L1049.80 223.02 L1051.97 224.70 L1054.15 226.32 L1056.33 227.87 L1058.50 229.34 L1060.67 230.72 L1062.85 232.00 L1065.03 233.19 L1067.20 234.28 L1069.38 235.28 L1071.55 236.17 L1073.72 236.98 L1075.90 237.70 L1078.08 238.34 L1080.25 238.90 L1082.42 239.39 L1084.60 239.81 L1086.78 240.18 L1088.95 240.49 L1091.13 240.76 L1093.30 240.98 L1095.47 241.17 L1097.65 241.33 L1099.83 241.46 L1102.00 241.57 " fill="none" stroke="#176aa0" stroke-width="2.5"/><text x="1015" y="267" font-size="15" fill="#176aa0" text-anchor="middle">正态噪声 N(0,1)</text><text x="40" y="756" font-size="21" fill="#183044" text-anchor="start">log为自然对数；所有损失先按样本计算，再对B个样本平均。类别编号本身没有大小/距离意义。</text><text x="40" y="799" font-size="21" fill="#183044" text-anchor="start">代码：MSE接预测；BCEWithLogits接原始z；CrossEntropy接(B,C)原始z和(B,)整数标签。</text></g></svg>
