<svg xmlns="http://www.w3.org/2000/svg" width="900" height="635" viewBox="0 0 900 635" role="img" aria-labelledby="c15-causal-padding-masks-title c15-causal-padding-masks-desc"><title id="c15-causal-padding-masks-title">图15-4：因果掩码与有效键掩码的交集</title><desc id="c15-causal-padding-masks-desc">两个四乘四掩码矩阵分别表示长度四和填充后真实长度二的序列。允许位置在softmax前保留，禁止位置权重为零。无效查询行用橙框注明仍需要输出或损失的独立处理。</desc><defs><marker id="c15-causal-padding-masks-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="635" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">因果与padding掩码：只决定哪些键可以参与</text><text x="30" y="83" font-size="21" >蓝色=允许，灰色×=禁止；行是查询位置，列是键位置，编号从1开始。</text><text x="60" y="132" font-size="24" font-weight="700">长度4：因果mask</text><text x="130" y="170" font-size="22" text-anchor="middle">1</text><text x="190" y="170" font-size="22" text-anchor="middle">2</text><text x="250" y="170" font-size="22" text-anchor="middle">3</text><text x="310" y="170" font-size="22" text-anchor="middle">4</text><text x="80" y="214" font-size="22" text-anchor="end">1</text><rect x="100" y="180" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="130" y="219" font-size="25" text-anchor="middle">1</text><rect x="160" y="180" width="60" height="60" fill="#e4e8ef" stroke="#71869d"/><text x="190" y="219" font-size="25" text-anchor="middle">×</text><rect x="220" y="180" width="60" height="60" fill="#e4e8ef" stroke="#71869d"/><text x="250" y="219" font-size="25" text-anchor="middle">×</text><rect x="280" y="180" width="60" height="60" fill="#e4e8ef" stroke="#71869d"/><text x="310" y="219" font-size="25" text-anchor="middle">×</text><text x="80" y="274" font-size="22" text-anchor="end">2</text><rect x="100" y="240" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="130" y="279" font-size="25" text-anchor="middle">1</text><rect x="160" y="240" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="190" y="279" font-size="25" text-anchor="middle">1</text><rect x="220" y="240" width="60" height="60" fill="#e4e8ef" stroke="#71869d"/><text x="250" y="279" font-size="25" text-anchor="middle">×</text><rect x="280" y="240" width="60" height="60" fill="#e4e8ef" stroke="#71869d"/><text x="310" y="279" font-size="25" text-anchor="middle">×</text><text x="80" y="334" font-size="22" text-anchor="end">3</text><rect x="100" y="300" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="130" y="339" font-size="25" text-anchor="middle">1</text><rect x="160" y="300" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="190" y="339" font-size="25" text-anchor="middle">1</text><rect x="220" y="300" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="250" y="339" font-size="25" text-anchor="middle">1</text><rect x="280" y="300" width="60" height="60" fill="#e4e8ef" stroke="#71869d"/><text x="310" y="339" font-size="25" text-anchor="middle">×</text><text x="80" y="394" font-size="22" text-anchor="end">4</text><rect x="100" y="360" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="130" y="399" font-size="25" text-anchor="middle">1</text><rect x="160" y="360" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="190" y="399" font-size="25" text-anchor="middle">1</text><rect x="220" y="360" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="250" y="399" font-size="25" text-anchor="middle">1</text><rect x="280" y="360" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="310" y="399" font-size="25" text-anchor="middle">1</text><text x="495" y="132" font-size="24" font-weight="700">长度2：因果 AND 有效键</text><text x="565" y="170" font-size="22" text-anchor="middle">1</text><text x="625" y="170" font-size="22" text-anchor="middle">2</text><text x="685" y="170" font-size="22