ddle">×</text><text x="515" y="394" font-size="22" text-anchor="end">4</text><rect x="535" y="360" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="565" y="399" font-size="25" text-anchor="middle">1</text><rect x="595" y="360" width="60" height="60" fill="#cce0f8" stroke="#71869d"/><text x="625" y="399" font-size="25" text-anchor="middle">1</text><rect x="655" y="360" width="60" height="60" fill="#e4e8ef" stroke="#71869d"/><text x="685" y="399" font-size="25" text-anchor="middle">×</text><rect x="715" y="360" width="60" height="60" fill="#e4e8ef" stroke="#71869d"/><text x="745" y="399" font-size="25" text-anchor="middle">×</text><rect x="535" y="300" width="240" height="120" fill="none" stroke="#bd611a" stroke-width="3" stroke-dasharray="7 4"/><text x="655" y="459" font-size="20" text-anchor="middle">橙框：padding查询行，另行忽略</text><text x="30" y="511" font-size="22" >每个有效查询至少保留一个键；本实现拒绝整行全部禁止。</text><text x="30" y="554" font-size="22" >只屏蔽padding键不会自动把padding查询的输出设零。</text><text x="30" y="597" font-size="21" >实际干预：改变未来/填充值1000，前两位置输出差与相应梯度均为0。</text></g></svg>
