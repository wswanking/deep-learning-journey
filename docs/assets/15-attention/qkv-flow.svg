<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="c15-qkv-flow-title c15-qkv-flow-desc"><title id="c15-qkv-flow-title">图15-1：查询、键、值与输出的单头数据流</title><desc id="c15-qkv-flow-desc">查询和键点积缩放生成每个查询对应所有键的分数，按最后键轴归一化得到权重，再与值矩阵相乘。注明所有形状与掩码位置。</desc><defs><marker id="c15-qkv-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="610" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">单头注意力：先匹配，再按权重汇总内容</text><text x="30" y="83" font-size="22" >Q的每一行提出一次查询；K与V的每一行是一对地址与内容。</text><rect x="30" y="135" width="180" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="120.0" y="171" font-size="24" text-anchor="middle" font-weight="700">Q：n_q × d_k</text><text x="120.0" y="208" font-size="22" text-anchor="middle">查询向量</text><rect x="30" y="285" width="180" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="120.0" y="321" font-size="24" text-anchor="middle" font-weight="700">K：n_k × d_k</text><text x="120.0" y="358" font-size="22" text-anchor="middle">匹配用的键</text><rect x="295" y="200" width="210" height="105" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="400.0" y="236" font-size="24" text-anchor="middle" font-weight="700">QKᵀ / √d_k</text><text x="400.0" y="273" font-size="22" text-anchor="middle">n_q × n_k 分数</text><rect x="610" y="200" width="245" height="105" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="732.5" y="236" font-size="24" text-anchor="middle" font-weight="700">按键轴softmax</text><text x="732.5" y="273" font-size="22" text-anchor="middle">每行权重和为1</text><rect x="30" y="440" width="235" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="147.5" y="476" font-size="24" text-anchor="middle" font-weight="700">V：n_k × d_v</text><text x="147.5" y="513" font-size="22" text-anchor="middle">待汇总的内容</text><rect x="610" y="440" width="245" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="732.5" y="476" font-size="24" text-anchor="middle" font-weight="700">O = A V</text><text x="732.5" y="513" font-size="22" text-anchor="middle">n_q × d_v 输出</text><path d="M 210.000 181.000 L 250.000 181.000 L 250.000 227.000 L 290.000 227.000" fill="none" stroke="#246cc0" stroke-width="3" marker-end="url(#c15-qkv-flow-arrow)"/><path d="M 210.000 331.000 L 250.000 331.000 L 250.000 277.000 L 290.000 277.000" fill="none" stroke="#246cc0" stroke-width="3" marker-end="url(#c15-qkv-flow-arrow)"/><line x1="505" y1="252" x2="605" y2="252" stroke="#246cc0" stroke-width="3" marker-end="url(#c15-qkv-flow-arrow)"/><line x1="732" y1="305" x2="732" y2="435" stroke="#246cc0" stroke-width="3" marker-end="url(#c15-qkv-flow-arrow)"/><line x1="265" y1="485" x2="605" y2="485" stroke="#246cc0" stroke-width="3" marker-end="url(#c15-qkv-flow-arrow)"/><text x="745" y="375" font-size="25" >A</text><text x="30" y="574" font-size="23" >mask在softmax之前应用；d_k与d_v可以不同。</text></g></svg>
