<svg xmlns="http://www.w3.org/2000/svg" width="900" height="625" viewBox="0 0 900 625" role="img" aria-labelledby="c15-scaling-experiment-title c15-scaling-experiment-desc"><title id="c15-scaling-experiment-title">图15-3：缩放前后的实际分数方差与注意力熵</title><desc id="c15-scaling-experiment-desc">固定随机种子，五个键维度各生成五百一十二组查询和八键，画出实际方差与平均熵。未缩放方差随维度上升，除以维度平方根后接近一，明确独立标准正态的前提。</desc><defs><marker id="c15-scaling-experiment-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="625" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">为什么除以√d_k：在明确随机假设下看数值尺度</text><text x="30" y="83" font-size="22" >每个维度独立标准正态；每个维度配置512个查询、每查询8个键。</text><text x="50" y="137" font-size="23" font-weight="700">分数方差（对数轴）</text><line x1="85" y1="430.0" x2="385" y2="430.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="437.0" font-size="20" text-anchor="end">1</text><line x1="85" y1="343.33333333333337" x2="385" y2="343.33333333333337" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="350.33333333333337" font-size="20" text-anchor="end">10</text><line x1="85" y1="256.6666666666667" x2="385" y2="256.6666666666667" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="263.6666666666667" font-size="20" text-anchor="end">100</text><line x1="85" y1="170.0" x2="385" y2="170.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="177.0" font-size="20" text-anchor="end">1000</text><text x="85.0" y="462" font-size="19" text-anchor="middle">2</text><text x="170.71428571428572" y="462" font-size="19" text-anchor="middle">8</text><text x="256.42857142857144" y="462" font-size="19" text-anchor="middle">32</text><text x="342.1428571428571" y="462" font-size="19" text-anchor="middle">128</text><text x="385.0" y="462" font-size="19" text-anchor="middle">256</text><path d="M 85.000 403.0