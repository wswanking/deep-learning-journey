<svg xmlns="http://www.w3.org/2000/svg" width="900" height="575" viewBox="0 0 900 575" role="img" aria-labelledby="c15-attention-counterexample-title c15-attention-counterexample-desc"><title id="c15-attention-counterexample-title">图15-5：不同权重相同输出的真实数值反例</title><desc id="c15-attention-counterexample-desc">两个相同值向量分别用零点九零点一和零点一零点九加权，输出完全相同。用可手算且已程序验证的例子说明注意力热图不能自动等同于完整因果解释。</desc><defs><marker id="c15-attention-counterexample-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="575" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">不同注意力权重，可以得到完全相同的输出</text><text x="30" y="83" font-size="23" >一个最小反例：两个值向量相同，V₁=V₂=(2,3)。</text><text x="30" y="173" font-size="25" font-weight="700">方案A</text><rect x="165" y="140" width="378.0" height="65" fill="#246cc0" /><text x="354.0" y="183" font-size="25" text-anchor="middle" fill="#fff">0.9</text><rect x="543.0" y="140" width="42.0" height="65" fill="#bd611a" /><text x="564.0" y="183" font-size="25" text-anchor="middle" fill="#fff">0.1</text><text x="630" y="182" font-size="27" font-weight="700">O=(2,3)</text><text x="165" y="246" font-size="24" >0.9V₁+0.1V₂=(2,3)</text><text x="30" y="348" font-size="25" font-weight="700">方案B</text><rect x="165" y="315" width="42.0" height="65" fill="#246cc0" /><text x="186.0" y="358" font-size="25" text-anchor="middle" fill="#fff">0.1</text><rect x="207.0" y="315" width="378.0" height="65" fill="#bd611a" /><text x="396.0" y="358" font-size="25" text-anchor="middle" fill="#fff">0.9</text><text x="630" y="357" font-size="27" font-weight="700">O=(2,3)</text><text x="165" y="421" font-size="24" >0.1V₁+0.9V₂=(2,3)</text><text x="30" y="493" font-size="22" >热图反映此层的混合系数；输出还依赖V、后续层与残差等路径。</text><text x="30" y="538" font-size="21" >解释需要明确问题和干预；不能只凭颜色深浅断言输入的因果重要性。</text></g></svg>
