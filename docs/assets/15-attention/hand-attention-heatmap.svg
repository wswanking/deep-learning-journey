<svg xmlns="http://www.w3.org/2000/svg" width="900" height="585" viewBox="0 0 900 585" role="img" aria-labelledby="c15-hand-attention-heatmap-title c15-hand-attention-heatmap-desc"><title id="c15-hand-attention-heatmap-title">图15-2：两查询三键的真实权重与手算输出</title><desc id="c15-hand-attention-heatmap-desc">权重矩阵来自实际运行，第一行零点五零点二五零点二五，第二行零点二五零点五零点二五。按行加权同一组值，得到一点五二和一三两个输出。</desc><defs><marker id="c15-hand-attention-heatmap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="585" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">手算权重热图：每一行独立归一化</text><text x="30" y="83" font-size="21" >分数行为(ln2,0,0)与(0,ln2,0)；exp后分别为(2,1,1)、(1,2,1)。</text><text x="247.5" y="137" font-size="23" text-anchor="middle">键/值 1</text><text x="422.5" y="137" font-size="23" text-anchor="middle">键/值 2</text><text x="597.5" y="137" font-size="23" text-anchor="middle">键/值 3</text><text x="125" y="211" font-size="23" text-anchor="end">查询1</text><rect x="160" y="155" width="175" height="95" fill="#9dc2ef" stroke="#71869d"/><text x="247.5" y="212" font-size="29" text-anchor="middle">0.50</text><rect x="335" y="155" width="175" height="95" fill="#dbe9fb" stroke="#71869d"/><text x="422.5" y="212" font-size="29" text-anchor="middle">0.25</text><rect x="510" y="155" width="175" height="95" fill="#dbe9fb" stroke="#71869d"/><text x="597.5" y="212" font-size="29" text-anchor="middle">0.25</text><text x="735" y="211" font-size="23" >行和=1</text><text x="125" y="306" font-size="23" text-anchor="end">查询2</text><rect x="160" y="250" width="175" height="95" fill="#dbe9fb" stroke="#71869d"/><text x="247.5" y="307" font-size="29" text-anchor="middle">0.25</text><rect x="335" y="250" width="175" height="95" fill="#9dc2ef" stroke="#71869d"/><text x="422.5" y="307" font-size="29" text-anchor="middle">0.50</text><rect x="510" y="250" width="175" height="95" fill="#dbe9fb" stroke="#71869d"/><text x="597.5" y="307" font-size="29" text-anchor="middle">0.25</text><text x="735" y="306" font-size="23" >行和=1</text><text x="30" y="402" font-size="23" >V₁=(2,0)，V₂=(0,4)，V₃=(2,4)。颜色越深，权重越大。</text><text x="30" y="451" font-size="24" >O₁=0.5V₁+0.25V₂+0.25V₃=(1.5,2)。</text><text x="30" y="496" font-size="24" >O₂=0.25V₁+0.5V₂+0.25V₃=(1,3)。</text><text x="30" y="547" font-size="22" >这是人为构造、可逐项核对的输入；不是训练模型发现的语言关系。</text></g></svg>
