<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="c21-byte-shift-title c21-byte-shift-desc"><title id="c21-byte-shift-title">图21-1：UTF-8字节移位目标与补齐语义</title><desc id="c21-byte-shift-desc">红A和换行共五字节，输入前四字节对应后四字节目标。一个中文字符占多个字节，无BOS、EOS或保留PAD。补齐使用独立mask与忽略标签。</desc><defs><marker id="c21-byte-shift-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="500" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">一次移位：同一文档给出输入和下一字节目标</text><text x="30" y="82" font-size="22" >原创手算示意：文本“红A\n”编码为5个UTF-8字节。</text><rect x="35" y="120" width="160" height="58" fill="#e7f0fb" rx="7" stroke="#b6c6d8"/><text x="115" y="158" font-size="24" text-anchor="middle">位置</text><rect x="201" y="120" width="160" height="58" fill="#e7f0fb" rx="7" stroke="#b6c6d8"/><text x="281" y="158" font-size="24" text-anchor="middle">1</text><rect x="367" y="120" width="160" height="58" fill="#e7f0fb" rx="7" stroke="#b6c6d8"/><text x="447" y="158" font-size="24" text-anchor="middle">2</text><rect x="533" y="120" width="160" height="58" fill="#e7f0fb" rx="7" stroke="#b6c6d8"/><text x="613" y="158" font-size="24" text-anchor="middle">3</text><rect x="699" y="120" width="160" height="58" fill="#e7f0fb" rx="7" stroke="#b6c6d8"/><text x="779" y="158" font-size="24" text-anchor="middle">4</text><rect x="35" y="185" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="115" y="223" font-size="24" text-anchor="middle">输入ID</text><rect x="201" y="185" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="281" y="223" font-size="24" text-anchor="middle">231</text><rect x="367" y="185" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="447" y="223" font-size="24" text-anchor="middle">186</text><rect x="533" y="185" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="613" y="223" font-size="24" text-anchor="middle">162</text><rect x="699" y="185" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="779" y="223" font-size="24" text-anchor="middle">65</text><rect x="35" y="250" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="115" y="288" font-size="24" text-anchor="middle">目标ID</text><rect x="201" y="250" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="281" y="288" font-size="24" text-anchor="middle">186</text><rect x="367" y="250" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="447" y="288" font-size="24" text-anchor="middle">162</text><rect x="533" y="250" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="613" y="288" font-size="24" text-anchor="middle">65</text><rect x="699" y="250" width="160" height="58" fill="#fff" rx="7" stroke="#b6c6d8"/><text x="779" y="288" font-size="24" text-anchor="middle">10</text><text x="35" y="368" font-size="23" >红 = [231,186,162]，A = [65]，换行 = [10]。</text><text x="35" y="414" font-size="22" >每个位置只见当前位置及此前输入，预测右移一位的目标。</text><text x="35" y="460" font-size="21" >右侧补齐时：输入填0、mask=False、目标=-100；0本身仍是合法字节。</text></g></svg>
