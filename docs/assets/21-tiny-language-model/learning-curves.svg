<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="c21-learning-curves-title c21-learning-curves-desc"><title id="c21-learning-curves-title">图21-4：主模型与少数据组的真实训练验证曲线</title><desc id="c21-learning-curves-desc">由真实JSON绘制每50步交叉熵。主模型和少数据组都降训练损失，少数据组训练验证分离更大，学习曲线也非单调。</desc><defs><marker id="c21-learning-curves-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="680" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">真实学习曲线：每50步用完整划分做确定性评估</text><text x="30" y="82" font-size="22" >纵轴为平均交叉熵，单位nat/byte；横轴为优化器更新步。</text><text x="80" y="120" font-size="24" font-weight="700">主模型：32篇训练文档</text><line x1="80" y1="290.0" x2="825" y2="290.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="70" y="297.0" font-size="20" text-anchor="end">0</text><line x1="80" y1="240.0" x2="825" y2="240.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="70" y="247.0" font-size="20" text-anchor="end">2</text><line x1="80" y1="190.0" x2="825" y2="190.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="70" y="197.0" font-size="20" text-anchor="end">4</text><line x1="80" y1="140.0" x2="825" y2="140.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="70" y="147.0" font-size="20" text-anchor="end">6</text><line x1="80.0" y1="140" x2="80.0" y2="290" stroke="#d0dbe7" stroke-width="1.5" /><text x="80.0" y="317" font-size="20" text-anchor="middle">0</text><line x1="328.3333333333333" y1="140" x2="328.3333333333333" y2="290" stroke="#d0dbe7" stroke-width="1.5" /><text x="328.3333333333333" y="317" font-size="20" text-anchor="middle">200</text><line x1="576.6666666666666" y1="140" x2="576.6666666666666" y2="290" stroke="#d0dbe7" stroke-width="1.5" /><text x="576.6666666666666" y="317" font-size="20" text-anchor="middle">400</text><line x1="825.0" y1="140" x2="825.0" y2="290" stroke="#d0dbe7" stroke-width="1.5" /><text x="825.0" y="317" font-size="20" text-anchor="middle">600</text><path d="M 80.000 151.362 L 142.083 236.066 L 204.167 256.760 L 266.250 264.783 L 328.333 266.027 L 390.417 266.950 L 452.500 268.381 L 514.583 269.153 L 576.667 269.657 L 638.750 269.809 L 700.833 269.244 L 762.917 266.743 L 825.000 268.306" fill="none" stroke="#246cc0" stroke-width="3"/><path d="M 80.000 151.430 L 142.083 235.022 L 204.167 253.749 L 266.250 261.889 L 328.333 264.224 L 390.417 265.792 L 452.500 265.740 L 514.583 266.947 L 576.667 267.769 L 638.750 268.375 L 700.833 267.157 L 762.917 265.068 L 825.000 266.315" fill="none" stroke="#bd611a" stroke-width="3"/><text x="80" y="360" font-size="24" font-weight="700">同一模型：只给4篇训练文档</text><line x1="80" y1="530.0" x2="825" y2="530.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="70" y="537.0" font-size="20" text-anchor="end">0</text><line x1="80" y1="480.0" x2="825" y2="480.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="70" y="487.0" font-size="20" text-anchor="end">2</text><line x1="80" y1="430.0" x2="825" y2="430.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="70" y="437.0" font-size="20" text-anchor="end">4</text><line x1="80" y1="380.0" x2="825" y2="380.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="70" y="387.0" font-size="20" text-anchor="end">6</text><line x1="80.0" y1="380" x2="80.0" y2="530" stroke="#d0dbe7" stroke-width="1.5" /><text x="80.0" y="557" font-size="20" text-anchor="middle">0</text><line x1="328.3333333333333" y1="380" x2="328.3333333333333" y2="530" stroke="#d0dbe7" stroke-width="1.5" /><text x="328.3333333333333" y="557" font-size="20" text-anchor="middle">200</text><line x1="576.6666666666666" y1="380" x2="576.6666666666666" y2="530" stroke="#d0dbe7" stroke-width="1.5" /><text x="576.6666666666666" y="557" font-size="20" text-anchor="middle">400</text><line x1="825.0" y1="380" x2="825.0" y2="530" stroke="#d0dbe7" stroke-width="1.5" /><text x="825.0" y="557" font-size="20" text-anchor="middle">600</text><path d="M 80.000 391.323 L 142.083 477.811 L 204.167 501.125 L 266.250 508.113 L 328.333 513.829 L 390.417 513.140 L 452.500 514.071 L 514.583 514.068 L 576.667 513.497 L 638.750 514.767 L 700.833 513.342 L 762.917 512.336 L 825.000 512.797" fill="none" stroke="#246cc0" stroke-width="3"/><path d="M 80.000 391.430 L 142.083 472.396 L 204.167 489.136 L 266.250 492.648 L 328.333 496.100 L 390.417 493.555 L 452.500 493.609 L 514.583 493.570 L 576.667 491.595 L 638.750 491.491 L 700.833 489.793 L 762.917 490.160 L 825.000 490.116" fill="none" stroke="#bd611a" stroke-width="3"/><line x1="40" y1="590" x2="85" y2="590" stroke="#246cc0" stroke-width="4" /><text x="95" y="598" font-size="22" >训练集</text><line x1="255" y1="590" x2="300" y2="590" stroke="#bd611a" stroke-width="4" /><text x="310" y="598" font-size="22" >验证集</text><text x="30" y="643" font-size="22" >小数据组训练误差更低，但验证误差约1.60；不能只检查训练损失。</text></g></svg>
