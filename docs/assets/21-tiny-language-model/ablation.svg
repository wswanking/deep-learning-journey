<svg xmlns="http://www.w3.org/2000/svg" width="900" height="635" viewBox="0 0 900 635" role="img" aria-labelledby="c21-ablation-title c21-ablation-desc"><title id="c21-ablation-title">图21-5：层数与数据量配置对照及测试协议</title><desc id="c21-ablation-desc">真实最终步主模型两层35328参数，单层26912参数，少数据组同主模型参数量。单层本次验证误差更低；少数据训练误差低但验证更高。只测试主模型一次。</desc><defs><marker id="c21-ablation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="635" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">相同步数与输入预算下：较深模型没有自动获胜</text><text x="30" y="82" font-size="21" >三组均600步、B=8、T=64；累计307,200个预测目标，包含重复。</text><text x="35" y="145" font-size="24" font-weight="700">配置</text><text x="395" y="145" font-size="24" font-weight="700">参数量</text><text x="555" y="145" font-size="24" font-weight="700">训练CE</text><text x="715" y="145" font-size="24" font-weight="700">验证CE</text><rect x="25" y="174" width="850" height="65" fill="#fff" rx="7"/><text x="35" y="212" font-size="22" >主模型：2层/32篇</text><text x="395" y="212" font-size="22" >35,328</text><text x="555" y="212" font-size="22" >0.8678</text><text x="715" y="212" font-size="22" >0.9474</text><rect x="25" y="254" width="850" height="65" fill="#fff" rx="7"/><text x="35" y="292" font-size="22" >消融：1层/32篇</text><text x="395" y="292" font-size="22" >26,912</text><text x="555" y="292" font-size="22" >0.7095</text><text x="715" y="292" font-size="22" >0.7132</text><rect x="25" y="334" width="850" height="65" fill="#fff" rx="7"/><text x="35" y="372" font-size="22" >少数据：2层/4篇</text><text x="395" y="372" font-size="22" >35,328</text><text x="555" y="372" font-size="22" >0.6881</text><text x="715" y="372" font-size="22" >1.5953</text><text x="30" y="500" font-size="22" >固定种子的一次小实验；参数量、优化难度和初始参数不同。</text><text x="30" y="547" font-size="21" >1层验证误差更低是本次配置事实，不能据此宣称1层普遍优于2层。</text><text x="30" y="594" font-size="21" >测试集只评估固定主模型一次：CE=1.002630，逐字节困惑度=2.725440。</text></g></svg>
