<svg xmlns="http://www.w3.org/2000/svg" width="900" height="605" viewBox="0 0 900 605" role="img" aria-labelledby="c21-checkpoint-title c21-checkpoint-desc"><title id="c21-checkpoint-title">图21-3：连续训练与保存恢复的实际相等核验</title><desc id="c21-checkpoint-desc">实测237步保存后恢复至600步，参数最大差零，评估历史与采样器状态相同。区分推理检查点与含优化器随机状态的训练检查点，限定同版本同硬件。</desc><defs><marker id="c21-checkpoint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="605" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">恢复训练需要优化过程状态，而不只是推理权重</text><text x="30" y="82" font-size="22" >相同CPU、版本、确定性设置；固定采样器与训练预算。</text><rect x="30" y="130" width="840" height="95" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450.0" y="164" font-size="24" text-anchor="middle" font-weight="700">路线A：连续执行600步</text><text x="450.0" y="198" font-size="21" text-anchor="middle">最终参数、评估历史、下一批采样器状态</text><rect x="30" y="275" width="370" height="95" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="215.0" y="309" font-size="24" text-anchor="middle" font-weight="700">路线B：执行237步后保存</text><text x="215.0" y="343" font-size="21" text-anchor="middle">model / AdamW / next_step</text><rect x="500" y="275" width="370" height="95" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="685.0" y="309" font-size="24" text-anchor="middle" font-weight="700">读取状态后继续至600步</text><text x="685.0" y="343" font-size="21" text-anchor="middle">采样RNG / torch RNG / 协议</text><line x1="400" y1="320" x2="495" y2="320" stroke="#246cc0" stroke-width="3" marker-end="url(#c21-checkpoint-arrow)"/><text x="30" y="430" font-size="25" font-weight="700">实测：最终参数最大绝对差 = 0。</text><text x="30" y="475" font-size="23" >两条评估历史逐项相同；最终采样器状态相同。</text><text x="30" y="520" font-size="21" >base-model.pt仅供推理/后续微调；step-237-checkpoint.pt才含恢复状态。</text><text x="30" y="565" font-size="22" >固定随机种子不等于跨硬件、跨PyTorch版本逐位可复现。</text></g></svg>
