<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-labelledby="c21-tiny-decoder-title c21-tiny-decoder-desc"><title id="c21-tiny-decoder-title">图21-2：微型decoder结构与参数账本</title><desc id="c21-tiny-decoder-desc">输入字节和位置嵌入送入两层pre-LN因果自注意力及GELU前馈残差块，最终映射256字节logits。详细参数账本对应实际模型35328参数。</desc><defs><marker id="c21-tiny-decoder-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="790" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">35,328个可训练参数：完整的微型decoder-only模型</text><text x="30" y="82" font-size="22" >B=批大小，T≤64，d=32；4个头各8维；2个pre-LN残差块。</text><rect x="30" y="130" width="250" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="155.0" y="164" font-size="24" text-anchor="middle" font-weight="700">输入ID [B,T]</text><text x="155.0" y="198" font-size="21" text-anchor="middle">UTF-8字节 0..255</text><rect x="350" y="130" width="520" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="610.0" y="164" font-size="24" text-anchor="middle" font-weight="700">字节嵌入 + 可学习位置嵌入</text><text x="610.0" y="198" font-size="21" text-anchor="middle">[B,T,32]；8,192 + 2,048 参数</text><line x1="280" y1="175" x2="345" y2="175" stroke="#246cc0" stroke-width="3" marker-end="url(#c21-tiny-decoder-arrow)"/><rect x="350" y="275" width="520" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="610.0" y="309" font-size="24" text-anchor="middle" font-weight="700">LayerNorm → 因果多头注意力 → 残差</text><text x="610.0" y="343" font-size="21" text-anchor="middle">Q/K/V各32→32；只读真实前缀键</text><line x1="610" y1="220" x2="610" y2="270" stroke="#246cc0" stroke-width="3" marker-end="url(#c21-tiny-decoder-arrow)"/><rect x="350" y="420" width="520" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="610.0" y="454" font-size="24" text-anchor="middle" font-weight="700">LayerNorm → 32→64→32 GELU → 残差</text><text x="610.0" y="488" font-size="21" text-anchor="middle">以上两段构成1块；每块8,416参数</text><line x1="610" y1="365" x2="610" y2="415" stroke="#246cc0" stroke-width="3" marker-end="url(#c21-tiny-decoder-arrow)"/><text x="35" y="328" font-size="23" font-weight="700">两段重复2次</text><text x="35" y="371" font-size="21" >不共享输入/输出权重</text><text x="35" y="414" font-size="22" >dropout=0</text><rect x="350" y="565" width="520" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="610.0" y="599" font-size="24" text-anchor="middle" font-weight="700">末尾LayerNorm → 线性词表头</text><text x="610.0" y="633" font-size="21" text-anchor="middle">[B,T,256] logits；64 + 8,192 参数</text><line x1="610" y1="510" x2="610" y2="560" stroke="#246cc0" stroke-width="3" marker-end="url(#c21-tiny-decoder-arrow)"/><text x="30" y="703" font-size="22" >注意力维度不含偏置；FFN含偏置；标准化各含缩放与平移。</text><text x="30" y="748" font-size="24" >10,240 + 2×8,416 + 64 + 8,192 = 35,328。</text></g></svg>
