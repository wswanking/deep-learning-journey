<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" aria-labelledby="c21-generation-boundaries-title c21-generation-boundaries-desc"><title id="c21-generation-boundaries-title">图21-6：真实生成样例与语言模型能力边界</title><desc id="c21-generation-boundaries-desc">摘录预先固定的三种提示。英文生成变更颜色并重复，中文复现训练模板，算术提示转为无关句子，一种采样非法UTF8。完整所有输出保存在实验JSON，不能只挑成功文本。</desc><defs><marker id="c21-generation-boundaries-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="730" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="26" font-weight="700">采样把预测分布变成文本，但不会补足训练中缺少的任务</text><text x="30" y="82" font-size="21" >下列均来自固定提示与完整预声明输出，不按好看程度挑选种子。</text><rect x="30" y="120" width="840" height="125" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="50" y="151" font-size="24" font-weight="700">The red / 贪心</text><text x="50" y="190" font-size="21" >star rests on the table. ... this green square.</text><text x="50" y="225" font-size="21" >末尾发生重复：“quiarquiaroom is quia”</text><rect x="30" y="265" width="840" height="125" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="50" y="296" font-size="24" font-weight="700">红色 / 贪心与温度0.8</text><text x="50" y="335" font-size="21" >三角形放在桌上。记录写着：红色三角形。</text><text x="50" y="370" font-size="21" >房间很安静，窗边有一束光。</text><rect x="30" y="410" width="840" height="125" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="50" y="441" font-size="24" font-weight="700">计算3+5= / 贪心</text><text x="50" y="480" font-size="21" >写着桌上。记录写着：红色方块。</text><text x="50" y="515" font-size="21" >房间很安静，窗边有一束光。</text><text x="30" y="602" font-size="21" >示意节录处标“...” ；完整6条输出与字节ID保存在results.json。</text><text x="30" y="646" font-size="21" >英文颜色不一致、重复；算术提示未回答8；一种采样产生非法UTF-8。</text><text x="30" y="690" font-size="22" >困惑度低只说明本协议的下一字节预测好；不构成推理能力证据。</text></g></svg>
