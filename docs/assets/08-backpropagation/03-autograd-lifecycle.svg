<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 755" role="img" aria-labelledby="title desc"><title id="title">计算图生命周期与梯度缓冲区</title><desc id="desc">依据链式法则和本章原创数值例子绘制，蓝箭头为前向依赖，橙字为最终损失的反向梯度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="755" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="40" y="44" font-size="27" fill="#183044" text-anchor="start">图08-3  一步训练的生命周期：图、梯度缓冲区和参数各有职责</text><rect x="40" y="115" width="235" height="158" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="157" y="155" font-size="24" fill="#176aa0" text-anchor="middle">① 前向建图</text><text x="157" y="204" font-size="18" fill="#183044" text-anchor="middle">当前参数 → 新输出/损失</text><text x="157" y="244" font-size="18" fill="#4d6678" text-anchor="middle">保存反向需要的中间值</text><rect x="335" y="115" width="235" height="158" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="452" y="155" font-size="24" fill="#176aa0" text-anchor="middle">② backward</text><text x="452" y="204" font-size="18" fill="#183044" text-anchor="middle">按链式法则求梯度</text><text x="452" y="244" font-size="18" fill="#4d6678" text-anchor="middle">叶参数的.grad累加</text><rect x="630" y="115" width="235" height="158" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="747" y="155" font-size="24" fill="#176aa0" text-anchor="middle">③ 更新参数</text><text x="747" y="204" font-size="18" fill="#183044" text-anchor="middle">no_grad环境下更新</text><text x="747" y="244" font-size="18" fill="#4d6678" text-anchor="middle">反向完成后再修改</text><rect x="925" y="115" width="235" height="158" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="1042" y="155" font-size="24" fill="#176aa0" text-anchor="middle">④ 下一步</text><text x="1042" y="204" font-size="18" fill="#183044" text-anchor="middle">清空旧.grad，新前向</text><text x="1042" y="244" font-size="18" fill="#4d6678" text-anchor="middle">建立下一次执行的图</text><path d="M280 195 L325 195" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M575 195 L620 195" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M870 195 L915 195" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="330" width="1120" height="125" rx="12" fill="#fff4e8" stroke="#a8bdcd" stroke-width="2"/><text x="65" y="371" font-size="24" fill="#ad5015" text-anchor="start">图的反向保存值</text><text x="65" y="416" font-size="22" fill="#183044" text-anchor="start">默认backward后会释放不再需要的保存值；需要这些值的同一旧图再反向通常报错。</text><rect x="40" y="485" width="1120" height="125" rx="12" fill="#edf7f0" stroke="#a8bdcd" stroke-width="2"/><text x="65" y="526" font-size="24" fill="#087c63" text-anchor="start">梯度缓冲区 .grad</text><text x="65" y="571" font-size="22" fill="#183044" text-anchor="start">与图是否保留是两件事：新建两次前向也会累计.grad；每次独立更新前要清空。</text><text x="40" y="668" font-size="21" fill="#183044" text-anchor="start">retain_graph保留反向所需数据；create_graph用于求导数的导数；二者都不是常规清零操作。</text><text x="40" y="711" font-size="21" fill="#183044" text-anchor="start">detach切断依赖，但可能共享存储；no_grad控制记录，不等于模型训练/评估模式开关。</text></g></svg>
