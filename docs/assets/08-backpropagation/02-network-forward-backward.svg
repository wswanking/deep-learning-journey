<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" role="img" aria-labelledby="title desc"><title id="title">带数值的两层网络前向反向更新</title><desc id="desc">依据链式法则和本章原创数值例子绘制，蓝箭头为前向依赖，橙字为最终损失的反向梯度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="735" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="40" y="44" font-size="27" fill="#183044" text-anchor="start">图08-2  一次前向、反向与同步更新：2 → 2 → 1 ReLU网络</text><rect x="40" y="105" width="200" height="155" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="140" y="144" font-size="21" fill="#176aa0" text-anchor="middle">输入 x</text><text x="140" y="195" font-size="26" fill="#183044" text-anchor="middle">[1, 2]ᵀ</text><text x="140" y="236" font-size="20" fill="#4d6678" text-anchor="middle">(2,)</text><rect x="270" y="105" width="200" height="155" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="370" y="144" font-size="21" fill="#176aa0" text-anchor="middle">z¹ = W¹x + b¹</text><text x="370" y="195" font-size="26" fill="#183044" text-anchor="middle">[-1, 1.5]ᵀ</text><text x="370" y="236" font-size="20" fill="#4d6678" text-anchor="middle">(2,)</text><rect x="500" y="105" width="200" height="155" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="600" y="144" font-size="21" fill="#176aa0" text-anchor="middle">h¹ = ReLU(z¹)</text><text x="600" y="195" font-size="26" fill="#183044" text-anchor="middle">[0, 1.5]ᵀ</text><text x="600" y="236" font-size="20" fill="#4d6678" text-anchor="middle">(2,)</text><rect x="730" y="105" width="200" height="155" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="830" y="144" font-size="21" fill="#176aa0" text-anchor="middle">输出 o</text><text x="830" y="195" font-size="26" fill="#183044" text-anchor="middle">-1</text><text x="830" y="236" font-size="20" fill="#4d6678" text-anchor="middle">标量</text><rect x="960" y="105" width="200" height="155" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="1060" y="144" font-size="21" fill="#176aa0" text-anchor="middle">L = (o−1)²/2</text><text x="1060" y="195" font-size="26" fill="#183044" text-anchor="middle">2</text><text x="1060" y="236" font-size="20" fill="#4d6678" text-anchor="middle">标量</text><path d="M245 185 L265 185" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M475 185 L495 185" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M705 185 L725 185" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M935 185 L955 185" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="312" font-size="22" fill="#183044" text-anchor="start">W¹=[[1,−1],[0.5,0.5]]，b¹=[0,0]；W²=[2,−1]，b²=0.5；目标y=1。</text><path d="M1080 360 L925 360" fill="none" stroke="#ad5015" stroke-width="3" marker-end="url(#arrow)"/><text x="1000" y="399" font-size="22" fill="#ad5015" text-anchor="middle">δ² = o−y = −2</text><path d="M910 360 L710 360" fill="none" stroke="#ad5015" stroke-width="3" marker-end="url(#arrow)"/><text x="800" y="399" font-size="21" fill="#ad5015" text-anchor="middle">对h梯度：[−4,2]</text><path d="M695 360 L455 360" fill="none" stroke="#ad5015" stroke-width="3" marker-end="url(#arrow)"/><text x="575" y="399" font-size="21" fill="#ad5015" text-anchor="middle">ReLU门：[0,1]</text><path d="M440 360 L205 360" fill="none" stroke="#ad5015" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="399" font-size="21" fill="#ad5015" text-anchor="middle">δ¹ = [0,2]ᵀ</text><rect x="40" y="445" width="540" height="145" rx="12" fill="#fff4e8" stroke="#a8bdcd" stroke-width="2"/><text x="65" y="486" font-size="24" fill="#ad5015" text-anchor="start">第一层梯度</text><text x="65" y="531" font-size="23" fill="#183044" text-anchor="start">∇W¹ = [[0,0],[2,4]]；∇b¹ = [0,2]</text><text x="65" y="570" font-size="21" fill="#4d6678" text-anchor="start">负预激活分量的梯度被ReLU门挡住。</text><rect x="620" y="445" width="540" height="145" rx="12" fill="#edf7f0" stroke="#a8bdcd" stroke-width="2"/><text x="645" y="486" font-size="24" fill="#087c63" text-anchor="start">第二层梯度</text><text x="645" y="531" font-size="23" fill="#183044" text-anchor="start">∇W² = [0,−3]；∇b² = −2</text><text x="645" y="570" font-size="21" fill="#4d6678" text-anchor="start">所有梯度计算完毕后再一起改参数。</text><text x="40" y="646" font-size="24" fill="#183044" text-anchor="start">η=0.1同步更新：新h=[0,0.3]ᵀ，输出0.49，损失0.13005（原损失2）。</text><text x="40" y="690" font-size="22" fill="#183044" text-anchor="start">图中δ是对预激活的损失梯度；不是误差值本身，也不是参数的更新量。</text></g></svg>
