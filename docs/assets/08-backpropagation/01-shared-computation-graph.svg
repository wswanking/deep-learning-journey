<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" role="img" aria-labelledby="title desc"><title id="title">共享参数计算图与梯度相加</title><desc id="desc">依据链式法则和本章原创数值例子绘制，蓝箭头为前向依赖，橙字为最终损失的反向梯度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="735" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="40" y="44" font-size="27" fill="#183044" text-anchor="start">图08-1  同一参数有两条影响路径：反向贡献必须相加</text><rect x="60" y="125" width="180" height="142" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="150" y="161" font-size="22" fill="#176aa0" text-anchor="middle">输入 x</text><text x="150" y="206" font-size="29" fill="#183044" text-anchor="middle">2</text><text x="150" y="244" font-size="19" fill="#ad5015" text-anchor="middle">∂L/∂x = 3</text><rect x="60" y="365" width="180" height="142" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="150" y="401" font-size="22" fill="#176aa0" text-anchor="middle">参数 w</text><text x="150" y="446" font-size="29" fill="#183044" text-anchor="middle">1</text><text x="150" y="484" font-size="19" fill="#ad5015" text-anchor="middle">∂L/∂w = 9</text><rect x="400" y="125" width="180" height="142" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="490" y="161" font-size="22" fill="#176aa0" text-anchor="middle">a = wx</text><text x="490" y="206" font-size="29" fill="#183044" text-anchor="middle">2</text><text x="490" y="244" font-size="19" fill="#ad5015" text-anchor="middle">∂L/∂a = 3</text><rect x="750" y="245" width="180" height="142" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="840" y="281" font-size="22" fill="#176aa0" text-anchor="middle">s = a + w</text><text x="840" y="326" font-size="29" fill="#183044" text-anchor="middle">3</text><text x="840" y="364" font-size="19" fill="#ad5015" text-anchor="middle">∂L/∂s = 3</text><rect x="990" y="245" width="180" height="142" rx="12" fill="#eff5fa" stroke="#a8bdcd" stroke-width="2"/><text x="1080" y="281" font-size="22" fill="#176aa0" text-anchor="middle">L = s²/2</text><text x="1080" y="326" font-size="29" fill="#183044" text-anchor="middle">4.5</text><text x="1080" y="364" font-size="19" fill="#ad5015" text-anchor="middle">∂L/∂L = 1</text><path d="M250 188 L388 188" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M245 390 L388 240" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M592 201 L738 280" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M245 435 L737 360" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><path d="M937 310 L978 310" fill="none" stroke="#176aa0" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="340" font-size="19" fill="#4d6678" text-anchor="start">局部：∂a/∂w=x=2</text><text x="410" y="452" font-size="20" fill="#4d6678" text-anchor="start">直接分支：∂s/∂w=1</text><text x="650" y="202" font-size="19" fill="#4d6678" text-anchor="start">局部：∂s/∂a=1</text><rect x="40" y="550" width="1120" height="145" rx="12" fill="#fff4e8" stroke="#a8bdcd" stroke-width="2"/><text x="65" y="590" font-size="23" fill="#ad5015" text-anchor="start">w的间接贡献 = (∂L/∂s)(∂s/∂a)(∂a/∂w) = 3 × 1 × 2 = 6</text><text x="65" y="633" font-size="23" fill="#ad5015" text-anchor="start">w的直接贡献 = (∂L/∂s)(∂s/∂w) = 3 × 1 = 3</text><text x="65" y="675" font-size="22" fill="#183044" text-anchor="start">总梯度 = 6 + 3 = 9。局部导数只看当前算子，反向梯度包含之后的全部路径。</text></g></svg>
