<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 740" role="img" aria-labelledby="title desc"><title id="title">训练与采样流程区别</title><desc id="desc">训练随机选择一个噪声等级直接构造样本并回归噪声，采样则从噪声逐步反向迭代，时间步与优化更新步不能混淆。</desc><rect width="1300" height="740" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="28" fill="#16344f" text-anchor="start">图19-3  训练与采样：一次训练更新不需要遍历整条反向链</text><text x="50.00" y="110.00" font-size="25" fill="#235bc7" text-anchor="start">训练一次更新：有真实x₀与已知噪声标签</text><rect x="40" y="160" width="210" height="105" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="145.00" y="212.50" font-size="25" fill="#16344f" text-anchor="middle">取训练x₀</text><text x="145.00" y="242.50" font-size="20" fill="#16344f" text-anchor="middle">抽样t与ε</text><rect x="335" y="160" width="250" height="105" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="460.00" y="212.50" font-size="25" fill="#16344f" text-anchor="middle">闭式构造xₜ</text><text x="460.00" y="242.50" font-size="20" fill="#16344f" text-anchor="middle">无需先走t次加噪</text><rect x="670" y="160" width="245" height="105" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="792.50" y="212.50" font-size="25" fill="#16344f" text-anchor="middle">网络预测ε̂</text><text x="792.50" y="242.50" font-size="20" fill="#16344f" text-anchor="middle">输入xₜ与t</text><rect x="1000" y="160" width="245" height="105" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1122.50" y="212.50" font-size="25" fill="#16344f" text-anchor="middle">平均平方误差</text><text x="1122.50" y="242.50" font-size="20" fill="#16344f" text-anchor="middle">反传并更新θ</text><line x1="255.00" y1="212.00" x2="325.00" y2="212.00" stroke="#235bc7" stroke-width="3"/><path d="M 316.22 216.79 L 325.00 212.00 L 316.22 207.21" stroke="#235bc7" fill="none" stroke-width="3"/><line x1="590.00" y1="212.00" x2="660.00" y2="212.00" stroke="#235bc7" stroke-width="3"/><path d="M 651.22 216.79 L 660.00 212.00 L 651.22 207.21" stroke="#235bc7" fill="none" stroke-width="3"/><line x1="920.00" y1="212.00" x2="990.00" y2="212.00" stroke="#235bc7" stroke-width="3"/><path d="M 981.22 216.79 L 990.00 212.00 L 981.22 207.21" stroke="#235bc7" fill="none" stroke-width="3"/><text x="50.00" y="370.00" font-size="25" fill="#007d75" text-anchor="start">采样完整链：没有真实x₀，也没有真实ε标签</text><rect x="40" y="420" width="210" height="105" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="145.00" y="472.50" font-size="25" fill="#16344f" text-anchor="middle">从x₆₄开始</text><text x="145.00" y="502.50" font-size="20" fill="#16344f" text-anchor="middle">标准高斯</text><rect x="335" y="420" width="250" height="105" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="460.00" y="472.50" font-size="25" fill="#16344f" text-anchor="middle">调用εθ(xₜ,t)</text><text x="460.00" y="502.50" font-size="20" fill="#16344f" text-anchor="middle">构造反向均值</text><rect x="670" y="420" width="245" height="105" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="792.50" y="472.50" font-size="25" fill="#16344f" text-anchor="middle">采样xₜ₋₁</text><text x="792.50" y="502.50" font-size="20" fill="#16344f" text-anchor="middle">t&gt;1时加入新噪声</text><rect x="1000" y="420" width="245" height="105" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1122.50" y="472.50" font-size="25" fill="#16344f" text-anchor="middle">返回生成x₀</text><text x="1122.50" y="502.50" font-size="20" fill="#16344f" text-anchor="middle">共64次网络调用</text><line x1="255.00" y1="472.00" x2="325.00" y2="472.00" stroke="#007d75" stroke-width="3"/><path d="M 316.22 476.79 L 325.00 472.00 L 316.22 467.21" stroke="#007d75" fill="none" stroke-width="3"/><line x1="590.00" y1="472.00" x2="660.00" y2="472.00" stroke="#007d75" stroke-width="3"/><path d="M 651.22 476.79 L 660.00 472.00 L 651.22 467.21" stroke="#007d75" fill="none" stroke-width="3"/><line x1="920.00" y1="472.00" x2="990.00" y2="472.00" stroke="#007d75" stroke-width="3"/><path d="M 981.22 476.79 L 990.00 472.00 L 981.22 467.21" stroke="#007d75" fill="none" stroke-width="3"/><line x1="790.00" y1="530.00" x2="790.00" y2="605.00" stroke="#007d75" stroke-width="3"/><line x1="790.00" y1="605.00" x2="460.00" y2="605.00" stroke="#007d75" stroke-width="3"/><line x1="460.00" y1="605.00" x2="460.00" y2="535.00" stroke="#007d75" stroke-width="3"/><path d="M 464.79 543.78 L 460.00 535.00 L 455.21 543.78" stroke="#007d75" fill="none" stroke-width="3"/><text x="500.00" y="590.00" font-size="23" fill="#007d75" text-anchor="start">t递减并重复</text><text x="50.00" y="690.00" font-size="24" fill="#16344f" text-anchor="start">扩散时间t、训练更新次数、采样随机种子是三种不同的控制量。</text></g></svg>
