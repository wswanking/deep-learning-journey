<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 660" role="img" aria-labelledby="title desc"><title id="title">时间条件噪声预测网络</title><desc id="desc">二维加噪点与三维固定时间特征拼接为五维输入，经过两个48宽tanh隐藏层预测二维噪声，2738参数在所有时间步共享。</desc><rect width="1320" height="660" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="29" fill="#16344f" text-anchor="start">图19-2  时间条件噪声网络：参数共享，噪声等级作为输入</text><rect x="40" y="135" width="205" height="90" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="142.50" y="180.00" font-size="25" fill="#16344f" text-anchor="middle">加噪点 xₜ</text><text x="142.50" y="210.00" font-size="20" fill="#16344f" text-anchor="middle">B×2</text><rect x="40" y="365" width="205" height="90" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="142.50" y="410.00" font-size="25" fill="#16344f" text-anchor="middle">时间步 t</text><text x="142.50" y="440.00" font-size="20" fill="#16344f" text-anchor="middle">B个整数，1…64</text><rect x="350" y="365" width="310" height="100" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="505.00" y="415.00" font-size="25" fill="#16344f" text-anchor="middle">u=t/64</text><text x="505.00" y="445.00" font-size="20" fill="#16344f" text-anchor="middle">u、sin(πu)、cos(πu)</text><line x1="250.00" y1="410.00" x2="340.00" y2="410.00" stroke="#16344f" stroke-width="3"/><path d="M 331.22 414.79 L 340.00 410.00 L 331.22 405.21" stroke="#16344f" fill="none" stroke-width="3"/><rect x="750" y="240" width="225" height="100" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="862.50" y="290.00" font-size="25" fill="#16344f" text-anchor="middle">拼接输入</text><text x="862.50" y="320.00" font-size="20" fill="#16344f" text-anchor="middle">B×5</text><line x1="250.00" y1="180.00" x2="740.00" y2="275.00" stroke="#16344f" stroke-width="3"/><path d="M 730.47 278.04 L 740.00 275.00 L 732.30 268.62" stroke="#16344f" fill="none" stroke-width="3"/><line x1="665.00" y1="410.00" x2="740.00" y2="305.00" stroke="#16344f" stroke-width="3"/><path d="M 738.80 314.93 L 740.00 305.00 L 731.00 309.35" stroke="#16344f" fill="none" stroke-width="3"/><rect x="1040" y="240" width="225" height="100" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1152.50" y="290.00" font-size="25" fill="#16344f" text-anchor="middle">MLP → ε̂</text><text x="1152.50" y="320.00" font-size="20" fill="#16344f" text-anchor="middle">5→48→48→2</text><line x1="980.00" y1="290.00" x2="1030.00" y2="290.00" stroke="#16344f" stroke-width="3"/><path d="M 1021.22 294.79 L 1030.00 290.00 L 1021.22 285.21" stroke="#16344f" fill="none" stroke-width="3"/><text x="50.00" y="555.00" font-size="24" fill="#16344f" text-anchor="start">两个隐藏层用tanh；同一θ处理所有时间步，不是每个t训练一个网络。</text><text x="50.00" y="615.00" font-size="24" fill="#16344f" text-anchor="start">输出与xₜ同形为B×2；训练标签是实际加入的ε，采样时该标签未知。</text></g></svg>
