<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img"><title>离散token ID与嵌入查表及Unicode字节差别</title><desc>原创示意；嵌入依据花书12.4/15.4和PyTorch2.15，BPE依据Sennrich等2016第3.2节，Unicode依据UAX15/29。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="580" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="25" y="34" font-size="22" fill="#24374c">图14-1  文本先离散编码，再按ID查嵌入表；ID本身没有距离含义</text><rect x="40" y="90" width="240" height="80" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="60" y="120" font-size="21" fill="#24374c">文本：猫 狗 猫</text><text x="60" y="152" font-size="17" fill="#24374c">按空格分成3个token</text><path d="M290,130L355,130" stroke="#1475b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="370" y="90" width="235" height="80" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="390" y="120" font-size="21" fill="#24374c">token ID：[2,3,2]</text><text x="390" y="152" font-size="17" fill="#24374c">整数索引，不是连续特征</text><path d="M615,130L680,130" stroke="#1475b8" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="695" y="80" width="335" height="110" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="715" y="115" font-size="20" fill="#24374c">查表：[1,2]、[0,1]、[1,2]</text><text x="715" y="150" font-size="18" fill="#24374c">同一ID 2查到相同向量</text><text x="45" y="245" font-size="19" fill="#24374c">E的行与token ID一一对应</text><rect x="45" y="270" width="320" height="40" rx="5" fill="white" stroke="#afc4d6"/><text x="60" y="296" font-size="17" fill="#24374c">0 / PAD</text><text x="250" y="296" font-size="17" fill="#24374c">0</text><text x="315" y="296" font-size="17" fill="#24374c">0</text><rect x="45" y="312" width="320" height="40" rx="5" fill="white" stroke="#afc4d6"/><text x="60" y="338" font-size="17" fill="#24374c">1 / UNK</text><text x="250" y="338" font-size="17" fill="#24374c">−1</text><text x="315" y="338" font-size="17" fill="#24374c">0</text><rect x="45" y="354" width="320" height="40" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="60" y="380" font-size="17" fill="#24374c">2 / 猫</text><text x="250" y="380" font-size="17" fill="#24374c">1</text><text x="315" y="380" font-size="17" fill="#24374c">2</text><rect x="45" y="396" width="320" height="40" rx="5" fill="white" stroke="#afc4d6"/><text x="60" y="422" font-size="17" fill="#24374c">3 / 狗</text><text x="250" y="422" font-size="17" fill="#24374c">0</text><text x="315" y="422" font-size="17" fill="#24374c">1</text><rect x="45" y="438" width="320" height="40" rx="5" fill="white" stroke="#afc4d6"/><text x="60" y="464" font-size="17" fill="#24374c">4 / 梨</text><text x="250" y="464" font-size="17" fill="#24374c">−1</text><text x="315" y="464" font-size="17" fill="#24374c">2</text><text x="415" y="280" font-size="20" fill="#1475b8">列向量公式：e = Eᵀ one_hot(ID)</text><text x="415" y="320" font-size="18" fill="#24374c">ID 2出现两次：反向贡献汇总到E的同一行。</text><text x="415" y="360" font-size="18" fill="#24374c">padding_idx=0屏蔽该行查表梯度；</text><text x="415" y="394" font-size="18" fill="#24374c">它不会自动替平均池化、注意力或损失加mask。</text><rect x="405" y="430" width="625" height="110" rx="5" fill="#fff2e6" stroke="#afc4d6"/><text x="425" y="460" font-size="17" fill="#24374c">Unicode提醒：汉字“我”是1个码点，UTF-8为3字节。</text><text x="425" y="495" font-size="17" fill="#24374c">码点 U+6211 → 字节 E6 88 91 → byte ID 230,136,145</text><text x="425" y="527" font-size="17" fill="#24374c">固定byte分词时，1个汉字在这里对应3个token。</text></g></svg>
