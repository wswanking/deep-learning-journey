<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img"><title>三轮BPE合并的精确频次和词尾边界</title><desc>原创示意；嵌入依据花书12.4/15.4和PyTorch2.15，BPE依据Sennrich等2016第3.2节，Unicode依据UAX15/29。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="600" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="25" y="34" font-size="22" fill="#24374c">图14-2  原创BPE手算：每轮重计频次，冻结合并顺序后再编码</text><text x="185" y="105" font-size="20" fill="#1475b8">初始</text><text x="395" y="105" font-size="20" fill="#1475b8">合并1</text><text x="605" y="105" font-size="20" fill="#1475b8">合并2</text><text x="815" y="105" font-size="20" fill="#1475b8">合并3</text><text x="35" y="165" font-size="18" fill="#24374c">abab ×3</text><rect x="175" y="132" width="200" height="54" rx="5" fill="white" stroke="#afc4d6"/><text x="187" y="165" font-size="17" fill="#24374c">a b a b END</text><rect x="385" y="132" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="397" y="165" font-size="17" fill="#24374c">ab ab END</text><rect x="595" y="132" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="607" y="165" font-size="17" fill="#24374c">ab abEND</text><rect x="805" y="132" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="817" y="165" font-size="17" fill="#24374c">ababEND</text><text x="35" y="235" font-size="18" fill="#24374c">abac ×2</text><rect x="175" y="202" width="200" height="54" rx="5" fill="white" stroke="#afc4d6"/><text x="187" y="235" font-size="17" fill="#24374c">a b a c END</text><rect x="385" y="202" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="397" y="235" font-size="17" fill="#24374c">ab a c END</text><rect x="595" y="202" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="607" y="235" font-size="17" fill="#24374c">ab a c END</text><rect x="805" y="202" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="817" y="235" font-size="17" fill="#24374c">ab a c END</text><text x="35" y="305" font-size="18" fill="#24374c">cab ×1</text><rect x="175" y="272" width="200" height="54" rx="5" fill="white" stroke="#afc4d6"/><text x="187" y="305" font-size="17" fill="#24374c">c a b END</text><rect x="385" y="272" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="397" y="305" font-size="17" fill="#24374c">c ab END</text><rect x="595" y="272" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="607" y="305" font-size="17" fill="#24374c">c abEND</text><rect x="805" y="272" width="200" height="54" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="817" y="305" font-size="17" fill="#24374c">c abEND</text><text x="35" y="390" font-size="21" fill="#24374c">频次加权token总数：29 → 20 → 16 → 13</text><text x="35" y="435" font-size="18" fill="#24374c">① (a,b)：2×3 + 1×2 + 1×1 = 9 次，合成 ab。</text><text x="35" y="475" font-size="18" fill="#24374c">② (ab,END)：3 + 1 = 4 次，合成 abEND。</text><text x="35" y="515" font-size="18" fill="#24374c">③ (ab,abEND)：3 次，合成 ababEND。</text><text x="35" y="558" font-size="17" fill="#bc570e">END在图中表示原子符号 &lt;/w>；它标词尾，不是整段文本的EOS。</text></g></svg>
