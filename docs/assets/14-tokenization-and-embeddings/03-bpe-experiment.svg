<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img"><title>原创byte BPE的真实合并压缩结果</title><rect width="1080" height="520" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="25" y="35" font-size="23" fill="#26384c">图14-3  实际byte BPE：训练合并压缩与未见文本切分</text><path d="M80,85v280h540" fill="none" stroke="#52677e"/><path d="M80,365h540" stroke="#dee7ef"/><text x="25" y="370" font-size="13" fill="#26384c">0</text><path d="M80,295.0h540" stroke="#dee7ef"/><text x="25" y="300.0" font-size="13" fill="#26384c">56</text><path d="M80,225.0h540" stroke="#dee7ef"/><text x="25" y="230.0" font-size="13" fill="#26384c">112</text><path d="M80,155.0h540" stroke="#dee7ef"/><text x="25" y="160.0" font-size="13" fill="#26384c">169</text><path d="M80,85h540" stroke="#dee7ef"/><text x="25" y="90" font-size="13" fill="#26384c">225</text><polyline points="80.00,85.00 113.75,96.20 147.50,107.40 181.25,118.60 215.00,129.80 248.75,141.00 282.50,152.20 316.25,163.40 350.00,172.11 383.75,180.82 417.50,189.53 451.25,197.00 485.00,204.47 518.75,211.93 552.50,219.40 586.25,225.62 620.00,231.84" fill="none" stroke="#1475b8" stroke-width="3"/><text x="72.0" y="395" font-size="13" fill="#26384c">0</text><text x="207.0" y="395" font-size="13" fill="#26384c">4</text><text x="342.0" y="395" font-size="13" fill="#26384c">8</text><text x="477.0" y="395" font-size="13" fill="#26384c">12</text><text x="612.0" y="395" font-size="13" fill="#26384c">16</text><text x="80" y="430" font-size="16" fill="#26384c">横轴：从训练文本学习的合并次数；纵轴：按文档频次加权的token数。</text><text x="690" y="100" font-size="20" fill="#26384c">固定256个初始字节</text><text x="690" y="135" font-size="19" fill="#26384c">+ 16个合并token</text><text x="690" y="185" font-size="19" fill="#26384c">测试文本：我爱AI。</text><text x="690" y="220" font-size="18" fill="#26384c">码点 5，字节 11</text><text x="690" y="255" font-size="18" fill="#26384c">冻结BPE：4 tokens</text><text x="690" y="305" font-size="18" fill="#26384c">未见字“𠮷”：4字节可回退</text><text x="690" y="340" font-size="17" fill="#26384c">不代表已学会该字语义</text><text x="80" y="480" font-size="16" fill="#26384c">在测试集重学合并会泄漏分布；本图不使用外部tokenizer或商业模型的分词结果。</text></g></svg>
