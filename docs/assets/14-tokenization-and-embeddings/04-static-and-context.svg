<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img"><title>苹果的固定词嵌入与依上下文改变的示意表示</title><desc>原创示意；嵌入依据花书12.4/15.4和PyTorch2.15，BPE依据Sennrich等2016第3.2节，Unicode依据UAX15/29。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="570" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="25" y="34" font-size="22" fill="#24374c">图14-4  静态向量按ID固定；上下文表示还取决于周围输入</text><rect x="40" y="85" width="480" height="115" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="60" y="120" font-size="23" fill="#24374c">水果 · 苹果 · 甜</text><text x="60" y="155" font-size="18" fill="#24374c">邻居均值 [2,0]；同一苹果向量 [1,1]</text><text x="60" y="185" font-size="19" fill="#1475b8">h = [1,1] + [2,0] = [3,1]</text><rect x="40" y="240" width="480" height="115" rx="5" fill="#fff2e6" stroke="#afc4d6"/><text x="60" y="275" font-size="23" fill="#24374c">公司 · 苹果 · 发布</text><text x="60" y="310" font-size="18" fill="#24374c">邻居均值 [0,2]；同一苹果向量 [1,1]</text><text x="60" y="340" font-size="19" fill="#bc570e">h = [1,1] + [0,2] = [1,3]</text><path d="M635,425H1020M655,440V75" fill="none" stroke="#afc4d6" stroke-width="2"/><text x="651" y="458" font-size="14" fill="#24374c">0</text><text x="625" y="430" font-size="14" fill="#24374c">0</text><text x="721" y="458" font-size="14" fill="#24374c">1</text><text x="625" y="360" font-size="14" fill="#24374c">1</text><text x="791" y="458" font-size="14" fill="#24374c">2</text><text x="625" y="290" font-size="14" fill="#24374c">2</text><text x="861" y="458" font-size="14" fill="#24374c">3</text><text x="625" y="220" font-size="14" fill="#24374c">3</text><text x="931" y="458" font-size="14" fill="#24374c">4</text><text x="625" y="150" font-size="14" fill="#24374c">4</text><path d="M655,425L725,355" stroke="#1475b8" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M725,355L865,355" stroke="#1475b8" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M725,355L725,215" stroke="#1475b8" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="735" y="380" font-size="18" fill="#24374c">e=[1,1]</text><text x="845" y="330" font-size="18" fill="#1475b8">h水果=[3,1]</text><text x="735" y="195" font-size="18" fill="#bc570e">h公司=[1,3]</text><text x="45" y="490" font-size="18" fill="#24374c">h = 中心向量 + 两个邻居向量的均值；这里只是可手算的上下文函数。</text><text x="45" y="530" font-size="17" fill="#24374c">不是训练出来的RNN/Transformer；分词相同也不意味着后续上下文表示相同。</text></g></svg>
