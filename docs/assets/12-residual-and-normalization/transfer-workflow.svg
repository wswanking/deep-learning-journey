<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="c12-transfer-workflow-title c12-transfer-workflow-desc"><title id="c12-transfer-workflow-title">图12-4：源任务预训练与三种目标训练策略</title><desc id="c12-transfer-workflow-desc">先对四象限源任务预训练同形状骨干，替换成二分类头，对照随机初始化、冻结预训练特征、全部微调。三种方法使用相同目标训练集和步数，另外注明迁移的源任务成本及真实失败结果。</desc><defs><marker id="c12-transfer-workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="565" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">迁移学习：先定义来源，再明确更新哪些部分</text><text x="30" y="82" font-size="21" >本例自行预训练；没有下载ImageNet模型，也不声称获得通用视觉表征。</text><rect x="30" y="125" width="235" height="95" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="147.5" y="164" font-size="24" text-anchor="middle" font-weight="700">源任务：四象限</text><text x="147.5" y="200" font-size="22" text-anchor="middle">256点，4类</text><rect x="335" y="125" width="235" height="95" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="452.5" y="164" font-size="24" text-anchor="middle" font-weight="700">预训练骨干</text><text x="452.5" y="200" font-size="22" text-anchor="middle">源模型492参数</text><rect x="640" y="125" width="230" height="95" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="755.0" y="164" font-size="24" text-anchor="middle" font-weight="700">替换目标头</text><text x="755.0" y="200" font-size="22" text-anchor="middle">目标2类，32点</text><line x1="265" y1="171" x2="330" y2="171" stroke="#246cc0" stroke-width="3" marker-end="url(#c12-transfer-workflow-arrow)"/><line x1="570" y1="171" x2="635" y2="171" stroke="#246cc0" stroke-width="3" marker-end="url(#c12-transfer-workflow-arrow)"/><rect x="30" y="300" width="230" height="134" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="145" y="339" font-size="25" text-anchor="middle" font-weight="700">从零训练</text><text x="145" y="379" font-size="21" text-anchor="middle">随机骨干 + 相同新头</text><text x="145" y="416" font-size="21" text-anchor="middle">474参数可更新</text><rect x="335" y="300" width="230" height="134" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450" y="339" font-size="25" text-anchor="middle" font-weight="700">冻结特征</text><text x="450" y="379" font-size="21" text-anchor="middle">预训练骨干固定</text><text x="450" y="416" font-size="21" text-anchor="middle">仅18个头参数更新</text><rect x="640" y="300" width="230" height="134" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="755" y="339" font-size="25" text-anchor="middle" font-weight="700">微调</text><text x="755" y="379" font-size="21" text-anchor="middle">预训练骨干继续更新</text><text x="755" y="416" font-size="21" text-anchor="middle">474参数可更新</text><text x="30" y="484" font-size="22" >比较相同目标数据与100步预算；迁移另有200步预训练成本。</text><text x="30" y="528" font-size="22" >实测冻结和微调都未超过从零基线；失败结果同样用于学习。</text></g></svg>
