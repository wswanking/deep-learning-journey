<svg xmlns="http://www.w3.org/2000/svg" width="900" height="605" viewBox="0 0 900 605" role="img" aria-labelledby="c12-batchnorm-modes-title c12-batchnorm-modes-desc"><title id="c12-batchnorm-modes-title">图12-3：真实BatchNorm手算与模式输出</title><desc id="c12-batchnorm-modes-desc">本批平均和用于前向的有偏方差可手算。PyTorch存储的移动方差使用无偏估计，本例momentum设为一，训练归一化结果约正负一，评估约正负零点七零七。</desc><defs><marker id="c12-batchnorm-modes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="605" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">相同输入，BatchNorm训练与评估可以不同</text><text x="30" y="82" font-size="22" >X=[[1,2],[3,6]]，γ=1、β=0、ε=10⁻⁵；momentum=1。</text><text x="30" y="135" font-size="24" font-weight="700">量</text><text x="340" y="135" font-size="24" font-weight="700">通道1</text><text x="615" y="135" font-size="24" font-weight="700">通道2</text><line x1="30" y1="204" x2="865" y2="204" stroke="#d0dbe7" stroke-width="1.5" /><text x="30" y="185" font-size="23" >本批均值</text><text x="340" y="185" font-size="23" >2.000000</text><text x="615" y="185" font-size="23" >4.000000</text><line x1="30" y1="266" x2="865" y2="266" stroke="#d0dbe7" stroke-width="1.5" /><text x="30" y="247" font-size="23" >前向方差：除以2</text><text x="340" y="247" font-size="23" >1.000000</text><text x="615" y="247" font-size="23" >4.000000</text><line x1="30" y1="328" x2="865" y2="328" stroke="#d0dbe7" stroke-width="1.5" /><text x="30" y="309" font-size="23" >存储方差：除以1</text><text x="340" y="309" font-size="23" >2.000000</text><text x="615" y="309" font-size="23" >8.000000</text><line x1="30" y1="390" x2="865" y2="390" stroke="#d0dbe7" stroke-width="1.5" /><text x="30" y="371" font-size="23" >首样本 train 输出</text><text x="340" y="371" font-size="23" >-0.999995</text><text x="615" y="371" font-size="23" >-0.999999</text><line x1="30" y1="452" x2="865" y2="452" stroke="#d0dbe7" stroke-width="1.5" /><text x="30" y="433" font-size="23" >首样本 eval 输出</text><text x="340" y="433" font-size="23" >-0.707105</text><text x="615" y="433" font-size="23" >-0.707106</text><text x="30" y="525" font-size="22" >这是一批数据后的刻意演示；实际默认momentum=0.1。</text><text x="30" y="567" font-size="22" >冻结γ、β不会冻结running_mean/var；它们是缓冲区。</text></g></svg>
