<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="c12-normalization-axes-title c12-normalization-axes-desc"><title id="c12-normalization-axes-title">图12-2：BatchNorm与LayerNorm的统计轴</title><desc id="c12-normalization-axes-desc">二维批次矩阵的列对应特征、行对应样本。BatchNorm按列跨样本归一化，LayerNorm在每个样本内跨指定末尾特征归一化。另注明NCHW图像的BatchNorm统计轴和LayerNorm接口要求。</desc><defs><marker id="c12-normalization-axes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="580" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">归一化轴：先问哪些元素共同计算均值与方差</text><text x="30" y="82" font-size="22" >示例输入 X 为 B×C；每行一个样本，每列一个特征。</text><text x="70" y="139" font-size="25" font-weight="700">BatchNorm1d：按列</text><rect x="95" y="180" width="80" height="75" fill="#dceafe" stroke="#71869d"/><text x="135" y="229" font-size="27" text-anchor="middle">1</text><rect x="175" y="180" width="80" height="75" fill="#ffead6" stroke="#71869d"/><text x="215" y="229" font-size="27" text-anchor="middle">2</text><rect x="255" y="180" width="80" height="75" fill="#e1f0e7" stroke="#71869d"/><text x="295" y="229" font-size="27" text-anchor="middle">3</text><rect x="95" y="255" width="80" height="75" fill="#dceafe" stroke="#71869d"/><text x="135" y="304" font-size="27" text-anchor="middle">4</text><rect x="175" y="255" width="80" height="75" fill="#ffead6" stroke="#71869d"/><text x="215" y="304" font-size="27" text-anchor="middle">5</text><rect x="255" y="255" width="80" height="75" fill="#e1f0e7" stroke="#71869d"/><text x="295" y="304" font-size="27" text-anchor="middle">6</text><text x="215" y="365" font-size="22" text-anchor="middle">同色元素共享统计量</text><text x="215" y="405" font-size="22" text-anchor="middle">跨样本，逐特征</text><text x="500" y="139" font-size="25" font-weight="700">LayerNorm(C)：按行</text><rect x="525" y="180" width="80" height="75" fill="#dceafe" stroke="#71869d"/><text x="565" y="229" font-size="27" text-anchor="middle">1</text><rect x="605" y="180" width="80" height="75" fill="#dceafe" stroke="#71869d"/><text x="645" y="229" font-size="27" text-anchor="middle">2</text><rect x="685" y="180" width="80" height="75" fill="#dceafe" stroke="#71869d"/><text x="725" y="229" font-size="27" text-anchor="middle">3</text><rect x="525" y="255" width="80" height="75" fill="#ffead6" stroke="#71869d"/><text x="565" y="304" font-size="27" text-anchor="middle">4</text><rect x="605" y="255" width="80" height="75" fill="#ffead6" stroke="#71869d"/><text x="645" y="304" font-size="27" text-anchor="middle">5</text><rect x="685" y="255" width="80" height="75" fill="#ffead6" stroke="#71869d"/><text x="725" y="304" font-size="27" text-anchor="middle">6</text><text x="645" y="365" font-size="22" text-anchor="middle">同色元素共享统计量</text><text x="645" y="405" font-size="22" text-anchor="middle">单个样本，跨特征</text><text x="30" y="460" font-size="23" >NCHW 图像：BatchNorm2d 固定 C，统计 B、H、W 三个轴。</text><text x="30" y="503" font-size="22" >LayerNorm 的轴由 normalized_shape 指定；不会自动识别“通道”。</text><text x="30" y="546" font-size="21" >BN 的 γ、β 通常每通道一对；LN 的可学习参数跟随指定的末尾形状。</text></g></svg>
