<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="c12-residual-block-title c12-residual-block-desc"><title id="c12-residual-block-title">图12-1：残差分支、恒等捷径与形状要求</title><desc id="c12-residual-block-desc">输入分到残差分支和恒等捷径，在加法处按相同位置相加。形状不同时必须投影或调整，局部导数为恒等矩阵加分支雅可比，不存在无条件的梯度下界。</desc><defs><marker id="c12-residual-block-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="430" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">残差块：相加需要形状相同</text><text x="30" y="82" font-size="22" >学习分支 F(x)；捷径把输入直接送到加法处。</text><rect x="35" y="195" width="140" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="105.0" y="233" font-size="25" text-anchor="middle" font-weight="700">输入 x</text><text x="105.0" y="274" font-size="22" text-anchor="middle">形状 d</text><rect x="300" y="195" width="225" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="412.5" y="233" font-size="25" text-anchor="middle" font-weight="700">残差分支 F</text><text x="412.5" y="274" font-size="22" text-anchor="middle">输出形状 d</text><rect x="705" y="195" width="160" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="785.0" y="233" font-size="25" text-anchor="middle" font-weight="700">输出 y</text><text x="785.0" y="274" font-size="22" text-anchor="middle">x + F(x)</text><line x1="175" y1="245" x2="295" y2="245" stroke="#246cc0" stroke-width="3" marker-end="url(#c12-residual-block-arrow)"/><line x1="525" y1="245" x2="614" y2="245" stroke="#246cc0" stroke-width="3" marker-end="url(#c12-residual-block-arrow)"/><line x1="665" y1="245" x2="700" y2="245" stroke="#246cc0" stroke-width="3" marker-end="url(#c12-residual-block-arrow)"/><circle cx="640" cy="245" r="25" fill="#e4effc" stroke="#246cc0" stroke-width="2"/><text x="640" y="255" font-size="33" text-anchor="middle">+</text><path d="M 210.000 245.000 L 210.000 135.000 L 640.000 135.000 L 640.000 216.000" fill="none" stroke="#246cc0" stroke-width="3" marker-end="url(#c12-residual-block-arrow)"/><text x="415" y="123" font-size="22" text-anchor="middle">恒等捷径 I；尺寸变化时用投影 P</text><text x="30" y="352" font-size="23" >局部雅可比：I + J_F；上游梯度可以沿两条路径传递。</text><text x="30" y="395" font-size="22" >若 F(x)=−x，两条导数恰好抵消；残差不保证梯度永不消失。</text></g></svg>
