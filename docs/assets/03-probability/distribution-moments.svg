<svg xmlns="http://www.w3.org/2000/svg" width="900" height="615" viewBox="0 0 900 615" role="img" aria-labelledby="c03-distribution-moments-title c03-distribution-moments-desc"><title id="c03-distribution-moments-title">图03-2：离散分布的期望与方差</title><desc id="c03-distribution-moments-desc">两个分布都在0、1、2取值，均值为1。A的概率为0.25、0.50、0.25，方差0.5。B的概率为0.50、0、0.50，方差1。</desc><rect x="0" y="0" width="900" height="615" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">期望相同，波动程度仍可以不同</text><text x="30" y="77" font-size="21" fill="#425b74">柱高为概率；虚线标出均值 μ=1，横轴是随机变量的取值。</text><text x="50" y="122" font-size="23" font-weight="700">分布A：均值1，方差0.5</text><line x1="70" y1="400" x2="375" y2="400" stroke="#d1dbe6" stroke-width="1" /><text x="60" y="407" font-size="20" text-anchor="end">0</text><line x1="70" y1="280" x2="375" y2="280" stroke="#d1dbe6" stroke-width="1" /><text x="60" y="287" font-size="20" text-anchor="end">0.25</text><line x1="70" y1="160" x2="375" y2="160" stroke="#d1dbe6" stroke-width="1" /><text x="60" y="167" font-size="20" text-anchor="end">0.5</text><line x1="70" y1="150" x2="70" y2="400" stroke="#172c44" stroke-width="2" /><line x1="70" y1="400" x2="375" y2="400" stroke="#172c44" stroke-width="2" /><line x1="225" y1="147" x2="225" y2="400" stroke="#246cc0" stroke-width="2" stroke-dasharray="6 6"/><rect x="90" y="280" width="60" height="120" fill="#246cc0" fill-opacity="0.82"/><text x="120" y="268" font-size="21" text-anchor="middle">0.25</text><text x="120" y="433" font-size="22" text-anchor="middle">0</text><rect x="195" y="160" width="60" height="240" fill="#246cc0" fill-opacity="0.82"/><text x="225" y="148" font-size="21" text-anchor="middle">0.50</text><text x="225" y="433" font-size="22" text-anchor="middle">1</text><rect x="300" y="280" width="60" height="120" fill="#246cc0" fill-opacity="0.82"/><text x="330" y="268" font-size="21" text-anchor="middle">0.25</text><text x="330" y="433" font-size="22" text-anchor="middle">2</text><text x="368" y="463" font-size="23" text-anchor="end">x</text><text x="480" y="122" font-size="23" font-weight="700">分布B：均值1，方差1</text><line x1="500" y1="400" x2="805" y2="400" stroke="#d1dbe6" stroke-width="1" /><text x="490" y="407" font-size="20" text-anchor="end">0</text><line x1="500" y1="280" x2="805" y2="280" stroke="#d1dbe6" stroke-width="1" /><text x="490" y="287" font-size="20" text-anchor="end">0.25</text><line x1="500" y1="160" x2="805" y2="160" stroke="#d1dbe6" stroke-width="1" /><text x="490" y="167" font-size="20" text-anchor="end">0.5</text><line x1="500" y1="150" x2="500" y2="400" stroke="#172c44" stroke-width="2" /><line x1="500" y1="400" x2="805" y2="400" stroke="#172c44" stroke-width="2" /><line x1="655" y1="147" x2="655" y2="400" stroke="#bd611a" stroke-width="2" stroke-dasharray="6 6"/><rect x="520" y="160" width="60" height="240" fill="#bd611a" fill-opacity="0.82"/><text x="550" y="148" font-size="21" text-anchor="middle">0.50</text><text x="550" y="433" font-size="22" text-anchor="middle">0</text><text x="655" y="388" font-size="21" text-anchor="middle">0.00</text><text x="655" y="433" font-size="22" text-anchor="middle">1</text><rect x="730" y="160" width="60" height="240" fill="#bd611a" fill-opacity="0.82"/><text x="760" y="148" font-size="21" text-anchor="middle">0.50</text><text x="760" y="433" font-size="22" text-anchor="middle">2</text><text x="798" y="463" font-size="23" text-anchor="end">x</text><text x="30" y="505" font-size="22" >A：0×0.25 + 1×0.50 + 2×0.25 = 1</text><text x="30" y="544" font-size="22" >B：0×0.50 + 1×0.00 + 2×0.50 = 1</text><text x="30" y="584" font-size="22" fill="#425b74">方差按距均值的平方加权；B把更多概率放在两侧。</text></g></svg>
