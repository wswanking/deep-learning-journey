<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" role="img" aria-labelledby="c03-joint-conditioning-title c03-joint-conditioning-desc"><title id="c03-joint-conditioning-title">图03-1：联合概率表与条件概率归一化</title><desc id="c03-joint-conditioning-desc">联合分布行表示X，列表示Y。条件Y等于1时，保留概率为0.20和0.40的一列，除以0.60，得到三分之一和三分之二。</desc><rect x="0" y="0" width="900" height="545" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">条件概率：保留 Y=1 的情形，再归一化</text><text x="30" y="77" font-size="21" fill="#425b74">联合表中的四格相加为1；蓝色列的总概率为0.60。</text><rect x="30" y="105" width="505" height="275" fill="#fff" /><rect x="285" y="105" width="125" height="275" fill="#e0edff" /><rect x="30" y="105" width="505" height="65" fill="#e8eef6" /><rect x="285" y="105" width="125" height="65" fill="#d0e2fb" /><rect x="410" y="170" width="125" height="210" fill="#edf1f6" /><rect x="30" y="310" width="380" height="70" fill="#edf1f6" /><rect x="285" y="310" width="125" height="70" fill="#d0e2fb" /><line x1="30" y1="105" x2="30" y2="380" stroke="#a5b4c5" stroke-width="2" /><line x1="160" y1="105" x2="160" y2="380" stroke="#a5b4c5" stroke-width="2" /><line x1="285" y1="105" x2="285" y2="380" stroke="#a5b4c5" stroke-width="2" /><line x1="410" y1="105" x2="410" y2="380" stroke="#a5b4c5" stroke-width="2" /><line x1="535" y1="105" x2="535" y2="380" stroke="#a5b4c5" stroke-width="2" /><line x1="30" y1="105" x2="535" y2="105" stroke="#a5b4c5" stroke-width="2" /><line x1="30" y1="170" x2="535" y2="170" stroke="#a5b4c5" stroke-width="2" /><line x1="30" y1="240" x2="535" y2="240" stroke="#a5b4c5" stroke-width="2" /><line x1="30" y1="310" x2="535" y2="310" stroke="#a5b4c5" stroke-width="2" /><line x1="30" y1="380" x2="535" y2="380" stroke="#a5b4c5" stroke-width="2" /><text x="95" y="145" font-size="23" text-anchor="middle">X / Y</text><text x="222.5" y="145" font-size="23" text-anchor="middle">Y=0</text><text x="347.5" y="145" font-size="23" text-anchor="middle">Y=1</text><text x="472.5" y="145" font-size="23" text-anchor="middle">P(X)</text><text x="95" y="214" font-size="23" text-anchor="middle">X=0</text><text x="222.5" y="214" font-size="23" text-anchor="middle">0.10</text><text x="347.5" y="214" font-size="23" text-anchor="middle">0.20</text><text x="472.5" y="214" font-size="23" text-anchor="middle">0.30</text><text x="95" y="284" font-size="23" text-anchor="middle">X=1</text><text x="222.5" y="284" font-size="23" text-anchor="middle">0.30</text><text x="347.5" y="284" font-size="23" text-anchor="middle">0.40</text><text x="472.5" y="284" font-size="23" text-anchor="middle">0.70</text><text x="95" y="354" font-size="23" text-anchor="middle">P(Y)</text><text x="222.5" y="354" font-size="23" text-anchor="middle">0.40</text><text x="347.5" y="354" font-size="23" text-anchor="middle">0.60</text><text x="472.5" y="354" font-size="23" text-anchor="middle">1.00</text><rect x="590" y="105" width="280" height="275" fill="#fff" rx="12" stroke="#246cc0" stroke-width="2"/><text x="610" y="143" font-size="24" font-weight="700">固定 Y=1</text><text x="610" y="187" font-size="22" >P(X=0 | Y=1)</text><text x="610" y="219" font-size="21" fill="#246cc0">= 0.20 / 0.60 = 1/3</text><text x="610" y="274" font-size="22" >P(X=1 | Y=1)</text><text x="610" y="306" font-size="21" fill="#246cc0">= 0.40 / 0.60 = 2/3</text><text x="610" y="352" font-size="21" >条件列：1/3 + 2/3 = 1</text><text x="30" y="427" font-size="22" >联合概率问“同时发生”；条件概率问“已知条件下的比例”。</text><text x="30" y="468" font-size="23" >P(X=1, Y=1) = 0.40</text><text x="30" y="510" font-size="22" fill="#425b74">P(X=1 | Y=1) = 2/3；P(Y=1 | X=1) = 4/7</text></g></svg>
