<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc">
<title id="title">数据对象、形状与轴</title><desc id="desc">从标量到三阶张量；数学列向量与代码一维数组的对应。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="815" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#172d44" text-anchor="start">图01-1  数据对象、形状与轴：先说明每条轴装的是什么</text><rect x="40" y="78" width="250" height="210" rx="12" fill="#edf5fb" stroke="#acbecb" stroke-width="2"/><text x="55" y="113" font-size="22" fill="#156da3" text-anchor="start">标量</text><text x="165" y="169" font-size="27" fill="#172d44" text-anchor="middle">s = 2</text><text x="165" y="216" font-size="21" fill="#172d44" text-anchor="middle">shape = ()</text><text x="165" y="259" font-size="17" fill="#40566b" text-anchor="middle">0条轴，1个元素</text><rect x="330" y="78" width="250" height="210" rx="12" fill="#edf5fb" stroke="#acbecb" stroke-width="2"/><text x="345" y="113" font-size="22" fill="#156da3" text-anchor="start">一个样本的特征向量</text><text x="455" y="169" font-size="27" fill="#172d44" text-anchor="middle">[2, 1, 0]</text><text x="455" y="216" font-size="21" fill="#172d44" text-anchor="middle">shape = (3,)</text><text x="455" y="259" font-size="17" fill="#40566b" text-anchor="middle">1条轴：特征</text><rect x="620" y="78" width="250" height="210" rx="12" fill="#edf5fb" stroke="#acbecb" stroke-width="2"/><text x="635" y="113" font-size="22" fill="#156da3" text-anchor="start">一批样本</text><text x="745" y="169" font-size="27" fill="#172d44" text-anchor="middle">2行 × 3列</text><text x="745" y="216" font-size="21" fill="#172d44" text-anchor="middle">shape = (2, 3)</text><text x="745" y="259" font-size="17" fill="#40566b" text-anchor="middle">轴0：样本；轴1：特征</text><rect x="910" y="78" width="250" height="210" rx="12" fill="#edf5fb" stroke="#acbecb" stroke-width="2"/><text x="925" y="113" font-size="22" fill="#156da3" text-anchor="start">一批序列</text><text x="1035" y="169" font-size="27" fill="#172d44" text-anchor="middle">2 × 3 × 4</text><text x="1035" y="216" font-size="21" fill="#172d44" text-anchor="middle">shape = (2, 3, 4)</text><text x="1035" y="259" font-size="17" fill="#40566b" text-anchor="middle">样本、时间、特征</text><text x="40" y="337" font-size="24" fill="#172d44" text-anchor="start">同一批次矩阵：行是样本，列是特征</text><rect x="100" y="365" width="85" height="55" rx="0" fill="#e6f4ee" stroke="#acbecb" stroke-width="2"/><text x="142.5" y="401.3" font-size="22" fill="#172d44" text-anchor="middle">2</text><rect x="185" y="365" width="85" height="55" rx="0" fill="#e6f4ee" stroke="#acbecb" stroke-width="2"/><text x="227.5" y="401.3" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="270" y="365" width="85" height="55" rx="0" fill="#e6f4ee" stroke="#acbecb" stroke-width="2"/><text x="312.5" y="401.3" font-size="22" fill="#172d44" text-anchor="middle">0</text><rect x="100" y="420" width="85" height="55" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="142.5" y="456.3" font-size="22" fill="#172d44" text-anchor="middle">0</text><rect x="185" y="420" width="85" height="55" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="227.5" y="456.3" font-size="22" fill="#172d44" text-anchor="middle">-1</text><rect x="270" y="420" width="85" height="55" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="312.5" y="456.3" font-size="22" fill="#172d44" text-anchor="middle">2</text><text x="60" y="402" font-size="18" fill="#172d44" text-anchor="start">i=0</text><text x="60" y="457" font-size="18" fill="#172d44" text-anchor="start">i=1</text><text x="142" y="505" font-size="18" fill="#40566b" text-anchor="middle">j=0</text><text x="227" y="505" font-size="18" fill="#40566b" text-anchor="middle">j=1</text><text x="312" y="505" font-size="18" fill="#40566b" text-anchor="middle">j=2</text><text x="415" y="397" font-size="22" fill="#172d44" text-anchor="start">X[0, :] = [2, 1, 0]</text><text x="415" y="441" font-size="22" fill="#172d44" text-anchor="start">X[:, 1] = [1, -1]</text><text x="415" y="489" font-size="20" fill="#40566b" text-anchor="start">索引从0开始；数学下标通常从1开始。</text><line x1="40" y1="537" x2="1160" y2="537" stroke="#acbecb" stroke-width="2"/><text x="40" y="578" font-size="24" fill="#ad540f" text-anchor="start">列向量约定 ≠ 一维数组天然具有列轴</text><text x="75" y="627" font-size="22" fill="#172d44" text-anchor="start">数学：x ∈ ℝ³，默认列向量</text><rect x="100" y="652" width="58" height="40" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="129" y="678.4" font-size="22" fill="#172d44" text-anchor="middle">2</text><rect x="100" y="692" width="58" height="40" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="129" y="718.4" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="100" y="732" width="58" height="40" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="129" y="758.4" font-size="22" fill="#172d44" text-anchor="middle">0</text><text x="200" y="719" font-size="22" fill="#172d44" text-anchor="start">显式列矩阵：(3, 1)</text><text x="650" y="627" font-size="22" fill="#172d44" text-anchor="start">代码：x = tensor([2., 1., 0.])</text><text x="650" y="679" font-size="21" fill="#172d44" text-anchor="start">x.shape = (3,)：没有行/列方向</text><text x="650" y="729" font-size="22" fill="#156da3" text-anchor="start">x[:, None] → (3, 1)</text><text x="650" y="772" font-size="22" fill="#087d77" text-anchor="start">x[None, :] → (1, 3)</text></g></svg>
