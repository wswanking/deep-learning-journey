<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc">
<title id="title">行乘列与行批次线性层</title><desc id="desc">高亮一行与一列计算一个输出元素；批次输入、转置权重和共享偏置的形状。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="825" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#172d44" text-anchor="start">图01-2  矩阵乘法：内侧维度求和，外侧维度留下</text><text x="50" y="96" font-size="24" fill="#156da3" text-anchor="start">A：2 × 3</text><text x="470" y="96" font-size="24" fill="#087d77" text-anchor="start">B：3 × 2</text><text x="850" y="96" font-size="24" fill="#ad540f" text-anchor="start">C = AB：2 × 2</text><rect x="50" y="125" width="70" height="52" rx="0" fill="#e3f0fc" stroke="#acbecb" stroke-width="2"/><text x="85" y="159.32" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="120" y="125" width="70" height="52" rx="0" fill="#e3f0fc" stroke="#acbecb" stroke-width="2"/><text x="155" y="159.32" font-size="22" fill="#172d44" text-anchor="middle">2</text><rect x="190" y="125" width="70" height="52" rx="0" fill="#e3f0fc" stroke="#acbecb" stroke-width="2"/><text x="225" y="159.32" font-size="22" fill="#172d44" text-anchor="middle">3</text><rect x="50" y="177" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="85" y="211.32" font-size="22" fill="#172d44" text-anchor="middle">4</text><rect x="120" y="177" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="155" y="211.32" font-size="22" fill="#172d44" text-anchor="middle">5</text><rect x="190" y="177" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="225" y="211.32" font-size="22" fill="#172d44" text-anchor="middle">6</text><rect x="470" y="125" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="505" y="159.32" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="540" y="125" width="70" height="52" rx="0" fill="#e1f2ed" stroke="#acbecb" stroke-width="2"/><text x="575" y="159.32" font-size="22" fill="#172d44" text-anchor="middle">2</text><rect x="470" y="177" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="505" y="211.32" font-size="22" fill="#172d44" text-anchor="middle">0</text><rect x="540" y="177" width="70" height="52" rx="0" fill="#e1f2ed" stroke="#acbecb" stroke-width="2"/><text x="575" y="211.32" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="470" y="229" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="505" y="263.32" font-size="22" fill="#172d44" text-anchor="middle">-1</text><rect x="540" y="229" width="70" height="52" rx="0" fill="#e1f2ed" stroke="#acbecb" stroke-width="2"/><text x="575" y="263.32" font-size="22" fill="#172d44" text-anchor="middle">0</text><rect x="850" y="125" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="885" y="159.32" font-size="22" fill="#172d44" text-anchor="middle">-2</text><rect x="920" y="125" width="70" height="52" rx="0" fill="#fff0dd" stroke="#acbecb" stroke-width="2"/><text x="955" y="159.32" font-size="22" fill="#172d44" text-anchor="middle">4</text><rect x="850" y="177" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="885" y="211.32" font-size="22" fill="#172d44" text-anchor="middle">-2</text><rect x="920" y="177" width="70" height="52" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="955" y="211.32" font-size="22" fill="#172d44" text-anchor="middle">13</text><text x="350" y="187" font-size="34" fill="#172d44" text-anchor="middle">×</text><text x="735" y="187" font-size="34" fill="#172d44" text-anchor="middle">=</text><text x="50" y="332" font-size="24" fill="#172d44" text-anchor="start">例如 c₁₂ = 第1行 · 第2列 = 1×2 + 2×1 + 3×0 = 4</text><text x="50" y="379" font-size="23" fill="#40566b" text-anchor="start">形状：(m, k) @ (k, n) → (m, n)；k轴相乘求和，不是逐元素乘。</text><line x1="40" y1="413" x2="1160" y2="413" stroke="#acbecb" stroke-width="2"/><text x="40" y="458" font-size="26" fill="#172d44" text-anchor="start">行批次线性层：每行一个样本，使用同一组权重</text><rect x="50" y="497" width="270" height="144" rx="12" fill="#edf5fb" stroke="#acbecb" stroke-width="2"/><text x="185" y="540" font-size="24" fill="#156da3" text-anchor="middle">X：(B, d) = (2, 3)</text><text x="185" y="587" font-size="22" fill="#172d44" text-anchor="middle">样本 × 输入特征</text><text x="185" y="620" font-size="19" fill="#40566b" text-anchor="middle">两条样本分别计算</text><rect x="440" y="497" width="270" height="144" rx="12" fill="#edf7f2" stroke="#acbecb" stroke-width="2"/><text x="575" y="540" font-size="23" fill="#087d77" text-anchor="middle">Wᵀ：(d, m) = (3, 2)</text><text x="575" y="587" font-size="21" fill="#172d44" text-anchor="middle">输入特征 × 输出特征</text><text x="575" y="620" font-size="19" fill="#40566b" text-anchor="middle">W本身存成 (m, d)</text><rect x="830" y="497" width="320" height="144" rx="12" fill="#fff5e8" stroke="#acbecb" stroke-width="2"/><text x="990" y="540" font-size="24" fill="#ad540f" text-anchor="middle">Z：(B, m) = (2, 2)</text><text x="990" y="587" font-size="22" fill="#172d44" text-anchor="middle">样本 × 输出特征</text><text x="990" y="620" font-size="19" fill="#40566b" text-anchor="middle">批次轴B保持不变</text><path d="M 330 565 L 430 565" fill="none" stroke="#156da3" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="539" font-size="24" fill="#172d44" text-anchor="middle">@</text><path d="M 720 565 L 820 565" fill="none" stroke="#156da3" stroke-width="3" marker-end="url(#arrow)"/><text x="770" y="539" font-size="23" fill="#172d44" text-anchor="middle">+ b</text><rect x="515" y="685" width="250" height="72" rx="12" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="640" y="729" font-size="24" fill="#ad540f" text-anchor="middle">b：(m,) = (2,)</text><path d="M 775 720 L 991 652" fill="none" stroke="#ad540f" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="786" font-size="23" fill="#172d44" text-anchor="start">Z = X Wᵀ + 1_B bᵀ；代码为 X @ W.T + b，偏置沿样本轴共享。</text></g></svg>
