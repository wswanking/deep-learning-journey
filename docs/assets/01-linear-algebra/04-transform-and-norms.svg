t-size="17" fill="#40566b" text-anchor="start">纵坐标</text><line x1="512" y1="381" x2="896" y2="381" stroke="#cfdae3" stroke-width="1.4"/><line x1="512" y1="381" x2="704" y2="189" stroke="#cfdae3" stroke-width="1.4"/><line x1="560" y1="333" x2="944" y2="333" stroke="#cfdae3" stroke-width="1.4"/><line x1="608" y1="381" x2="800" y2="189" stroke="#cfdae3" stroke-width="1.4"/><line x1="608" y1="285" x2="992" y2="285" stroke="#cfdae3" stroke-width="1.4"/><line x1="704" y1="381" x2="896" y2="189" stroke="#cfdae3" stroke-width="1.4"/><line x1="656" y1="237" x2="1040" y2="237" stroke="#cfdae3" stroke-width="1.4"/><line x1="800" y1="381" x2="992" y2="189" stroke="#cfdae3" stroke-width="1.4"/><line x1="704" y1="189" x2="1088" y2="189" stroke="#cfdae3" stroke-width="1.4"/><line x1="896" y1="381" x2="1088" y2="189" stroke="#cfdae3" stroke-width="1.4"/><path d="M 680 285 L 1000 285" fill="none" stroke="#40566b" stroke-width="3" marker-end="url(#arrow)"/><path d="M 800 395 L 800 110" fill="none" stroke="#40566b" stroke-width="3" marker-end="url(#arrow)"/><path d="M 800 285 L 896 285" fill="none" stroke="#156da3" stroke-width="3" marker-end="url(#arrow)"/><text x="904" y="306" font-size="21" fill="#156da3" text-anchor="start">Ae₁</text><path d="M 800 285 L 848 237" fill="none" stroke="#087d77" stroke-width="3" marker-end="url(#arrow)"/><text x="856" y="229" font-size="21" fill="#087d77" text-anchor="start">Ae₂</text><path d="M 800 285 L 992 189" fill="none" stroke="#ad540f" stroke-width="3" marker-end="url(#arrow)"/><text x="1002" y="179" font-size="21" fill="#ad540f" text-anchor="start">Ax</text><text x="1005" y="306" font-size="17" fill="#40566b" text-anchor="start">横坐标</text><text x="818" y="118" font-size="17" fill="#40566b" text-anchor="start">纵坐标</text><text x="72" y="445" font-size="21" fill="#172d44" text-anchor="start">e₁=(1,0)，e₂=(0,1)，x=(1,2)</text><text x="620" y="445" font-size="21" fill="#172d44" text-anchor="start">Ae₁=(2,0)，Ae₂=(1,1)，Ax=(4,2)</text><text x="80" y="48