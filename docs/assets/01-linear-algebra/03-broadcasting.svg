<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">偏置广播与样本目标静默错位</title><desc id="desc">正确偏置共享和一个形状合法但样本语义错误的两两相减。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="860" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="40" y="46" font-size="28" fill="#172d44" text-anchor="start">图01-3  广播从右向左对齐；形状合法还要检查语义</text><text x="40" y="96" font-size="24" fill="#156da3" text-anchor="start">正确共享偏置：每行都加同一组输出特征偏置</text><rect x="60" y="127" width="80" height="49" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="100" y="159.34" font-size="22" fill="#172d44" text-anchor="middle">4</text><rect x="140" y="127" width="80" height="49" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="180" y="159.34" font-size="22" fill="#172d44" text-anchor="middle">-1</text><rect x="60" y="176" width="80" height="49" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="100" y="208.34" font-size="22" fill="#172d44" text-anchor="middle">-4</text><rect x="140" y="176" width="80" height="49" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="180" y="208.34" font-size="22" fill="#172d44" text-anchor="middle">7</text><text x="267" y="185" font-size="30" fill="#172d44" text-anchor="start">+</text><rect x="335" y="127" width="80" height="49" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="375" y="159.34" font-size="22" fill="#172d44" text-anchor="middle">0.5</text><rect x="415" y="127" width="80" height="49" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="455" y="159.34" font-size="22" fill="#172d44" text-anchor="middle">-1</text><text x="335" y="224" font-size="19" fill="#40566b" text-anchor="start">(2,) → (1, 2)</text><text x="555" y="185" font-size="30" fill="#172d44" text-anchor="start">=</text><rect x="635" y="127" width="80" height="49" rx="0" fill="#e3f0fc" stroke="#acbecb" stroke-width="2"/><text x="675" y="159.34" font-size="22" fill="#172d44" text-anchor="middle">4.5</text><rect x="715" y="127" width="80" height="49" rx="0" fill="#e3f0fc" stroke="#acbecb" stroke-width="2"/><text x="755" y="159.34" font-size="22" fill="#172d44" text-anchor="middle">-2</text><rect x="635" y="176" width="80" height="49" rx="0" fill="#e1f2ed" stroke="#acbecb" stroke-width="2"/><text x="675" y="208.34" font-size="22" fill="#172d44" text-anchor="middle">-3.5</text><rect x="715" y="176" width="80" height="49" rx="0" fill="#e1f2ed" stroke="#acbecb" stroke-width="2"/><text x="755" y="208.34" font-size="22" fill="#172d44" text-anchor="middle">6</text><text x="60" y="274" font-size="23" fill="#172d44" text-anchor="start">形状：(2, 2) + (2,) → (2, 2)</text><text x="635" y="274" font-size="21" fill="#40566b" text-anchor="start">概念上扩展偏置，不必复制存储。</text><line x1="40" y1="309" x2="1160" y2="309" stroke="#acbecb" stroke-width="2"/><text x="40" y="355" font-size="24" fill="#ad540f" text-anchor="start">静默错误：pred 的样本轴 与 target 的样本轴对齐到了不同位置</text><text x="60" y="402" font-size="23" fill="#156da3" text-anchor="start">pred：(3, 1)</text><text x="390" y="402" font-size="23" fill="#087d77" text-anchor="start">target：(3,)</text><rect x="60" y="426" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="92.5" y="457.68" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="60" y="474" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="92.5" y="505.68" font-size="22" fill="#172d44" text-anchor="middle">2</text><rect x="60" y="522" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="92.5" y="553.6800000000001" font-size="22" fill="#172d44" text-anchor="middle">3</text><text x="224" y="509" font-size="30" fill="#172d44" text-anchor="start">−</text><rect x="390" y="426" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="422.5" y="457.68" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="455" y="426" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="487.5" y="457.68" font-size="22" fill="#172d44" text-anchor="middle">2</text><rect x="520" y="426" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="552.5" y="457.68" font-size="22" fill="#172d44" text-anchor="middle">3</text><text x="390" y="512" font-size="21" fill="#40566b" text-anchor="start">缺少左侧轴 → (1, 3)</text><text x="680" y="509" font-size="30" fill="#172d44" text-anchor="start">=</text><rect x="785" y="426" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="817.5" y="457.68" font-size="22" fill="#172d44" text-anchor="middle">0</text><rect x="850" y="426" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="882.5" y="457.68" font-size="22" fill="#172d44" text-anchor="middle">-1</text><rect x="915" y="426" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="947.5" y="457.68" font-size="22" fill="#172d44" text-anchor="middle">-2</text><rect x="785" y="474" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="817.5" y="505.68" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="850" y="474" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="882.5" y="505.68" font-size="22" fill="#172d44" text-anchor="middle">0</text><rect x="915" y="474" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="947.5" y="505.68" font-size="22" fill="#172d44" text-anchor="middle">-1</text><rect x="785" y="522" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="817.5" y="553.6800000000001" font-size="22" fill="#172d44" text-anchor="middle">2</text><rect x="850" y="522" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="882.5" y="553.6800000000001" font-size="22" fill="#172d44" text-anchor="middle">1</text><rect x="915" y="522" width="65" height="48" rx="0" fill="#fff" stroke="#acbecb" stroke-width="2"/><text x="947.5" y="553.6800000000001" font-size="22" fill="#172d44" text-anchor="middle">0</text><text x="785" y="610" font-size="22" fill="#ad540f" text-anchor="start">输出：(3, 3)，不是 (3, 1)</text><text x="60" y="650" font-size="23" fill="#172d44" text-anchor="start">第i行第j列 = pred[i, 0] − target[j]：计算了所有样本两两差。</text><rect x="40" y="684" width="1120" height="141" rx="12" fill="#edf5fb" stroke="#acbecb" stroke-width="2"/><text x="65" y="722" font-size="23" fill="#156da3" text-anchor="start">修正：target[:, None] → (3, 1)，同一个样本只和自己的目标相减。</text><text x="65" y="763" font-size="23" fill="#172d44" text-anchor="start">错误平均平方差 = 12 / 9 = 4/3；正确平均平方差 = 0。</text><text x="65" y="803" font-size="21" fill="#40566b" text-anchor="start">判定顺序：说明轴含义 → 手算输出形状 → 运算 → 同时检查数值与形状。</text></g></svg>
