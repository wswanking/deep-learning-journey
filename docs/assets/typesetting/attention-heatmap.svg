<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"><title>带数字标注的矢量热图</title><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="340" y="31" text-anchor="middle" font-size="22" fill="#17243b">归一化权重矩阵</text><text x="190" y="64" text-anchor="middle" font-size="18" fill="#526277">键 1</text><text x="330" y="64" text-anchor="middle" font-size="18" fill="#526277">键 2</text><text x="470" y="64" text-anchor="middle" font-size="18" fill="#526277">键 3</text><text x="100" y="117" text-anchor="end" font-size="18" fill="#526277">查询 1</text><rect x="125" y="78" width="130" height="60" rx="5" fill="#2456a6" stroke="#fff" stroke-width="2"/><text x="190" y="116" text-anchor="middle" font-size="22" fill="#fff">0.70</text><rect x="265" y="78" width="130" height="60" rx="5" fill="#dee9f9" stroke="#fff" stroke-width="2"/><text x="330" y="116" text-anchor="middle" font-size="22" fill="#17243b">0.20</text><rect x="405" y="78" width="130" height="60" rx="5" fill="#edf3fc" stroke="#fff" stroke-width="2"/><text x="470" y="116" text-anchor="middle" font-size="22" fill="#17243b">0.10</text><text x="100" y="187" text-anchor="end" font-size="18" fill="#526277">查询 2</text><rect x="125" y="148" width="130" height="60" rx="5" fill="#dee9f9" stroke="#fff" stroke-width="2"/><text x="190" y="186" text-anchor="middle" font-size="22" fill="#17243b">0.15</text><rect x="265" y="148" width="130" height="60" rx="5" fill="#4575b6" stroke="#fff" stroke-width="2"/><text x="330" y="186" text-anchor="middle" font-size="22" fill="#fff">0.65</text><rect x="405" y="148" width="130" height="60" rx="5" fill="#dee9f9" stroke="#fff" stroke-width="2"/><text x="470" y="186" text-anchor="middle" font-size="22" fill="#17243b">0.20</text><text x="100" y="257" text-anchor="end" font-size="18" fill="#526277">查询 3</text><rect x="125" y="218" width="130" height="60" rx="5" fill="#edf3fc" stroke="#fff" stroke-width="2"/><text x="190" y="256" text-anchor="middle" font-size="22" fill="#17243b">0.10</text><rect x="265" y="218" width="130" height="60" rx="5" fill="#c9dcf4" stroke="#fff" stroke-width="2"/><text x="330" y="256" text-anchor="middle" font-size="22" fill="#17243b">0.25</text><rect x="405" y="218" width="130" height="60" rx="5" fill="#4575b6" stroke="#fff" stroke-width="2"/><text x="470" y="256" text-anchor="middle" font-size="22" fill="#fff">0.65</text><text x="680" y="110" text-anchor="middle" font-size="20" fill="#17243b">每行权重之和为 1</text><text x="680" y="149" text-anchor="middle" font-size="18" fill="#526277">矩形与数字均为矢量</text><text x="450" y="314" text-anchor="middle" font-size="17" fill="#526277">示意数据：仅检验热图排版，不解释为模型实测注意力。</text></g></svg>
