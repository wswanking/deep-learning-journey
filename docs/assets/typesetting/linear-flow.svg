<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" role="img"><title>仿射变换的数据与形状</title><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2456a6"/></marker></defs><rect x="30" y="50" width="230" height="110" rx="10" fill="#f4f7fb" stroke="#a9bdd8" stroke-width="2"/><text x="145" y="92" text-anchor="middle" font-size="24" fill="#17243b">输入向量</text><text x="145" y="131" text-anchor="middle" font-size="19" fill="#526277">x：2 个分量</text><path d="M272 105H320" stroke="#2456a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="335" y="50" width="230" height="110" rx="10" fill="#eaf1fc" stroke="#a9bdd8" stroke-width="2"/><text x="450" y="92" text-anchor="middle" font-size="24" fill="#17243b">仿射变换</text><text x="450" y="131" text-anchor="middle" font-size="19" fill="#526277">z = W x + b</text><path d="M577 105H625" stroke="#2456a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="50" width="230" height="110" rx="10" fill="#f4f7fb" stroke="#a9bdd8" stroke-width="2"/><text x="755" y="92" text-anchor="middle" font-size="24" fill="#17243b">输出向量</text><text x="755" y="131" text-anchor="middle" font-size="19" fill="#526277">z：3 个分量</text><text x="450" y="208" text-anchor="middle" font-size="18" fill="#526277">维度：W 为 3 × 2，b 为 3 × 1，列向量约定</text></g></svg>
