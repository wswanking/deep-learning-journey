<svg xmlns="http://www.w3.org/2000/svg" width="900" height="685" viewBox="0 0 900 685" role="img" aria-labelledby="c30-quality-review-title c30-quality-review-desc"><title id="c30-quality-review-title">图30-6：工程交付与回顾性应用质量门槛分别记录</title><desc id="c30-quality-review-desc">五个明确质量门槛，显示实际指标、门槛及逐项审核结果，数值不可混成总分；工程运行成功并不自动表示应用可用。</desc><defs><marker id="c30-quality-review-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="685" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">交付可复现，与应用质量达标分别验收</text><text x="30" y="82" font-size="21" >门槛是本章回顾性项目要求；前章结果已知，不伪称新盲测预注册。</text><rect x="25" y="120" width="850" height="65" fill="#fff" rx="8"/><text x="40" y="160" font-size="23" font-weight="700">SFT既有任务</text><text x="330" y="160" font-size="24" >实测 25%</text><text x="510" y="160" font-size="23" >门槛 75%</text><text x="735" y="160" font-size="24" fill="#bd611a">未满足</text><rect x="25" y="205" width="850" height="65" fill="#fff" rx="8"/><text x="40" y="245" font-size="23" font-weight="700">SFT新字母</text><text x="330" y="245" font-size="24" >实测 0%</text><text x="510" y="245" font-size="23" >门槛 50%</text><text x="735" y="245" font-size="24" fill="#bd611a">未满足</text><rect x="25" y="290" width="850" height="65" fill="#fff" rx="8"/><text x="40" y="330" font-size="23" font-weight="700">神经证据问答</text><text x="330" y="330" font-size="24" >实测 0%</text><text x="510" y="330" font-size="23" >门槛 75%</text><text x="735" y="330" font-size="24" fill="#bd611a">未满足</text><rect x="25" y="375" width="850" height="65" fill="#fff" rx="8"/><text x="40" y="415" font-size="23" font-weight="700">受限规则问答</text><text x="330" y="415" font-size="24" >实测 100%</text><text x="510" y="415" font-size="23" >门槛 100%</text><text x="735" y="415" font-size="24" fill="#39805b">满足</text><rect x="25" y="460" width="850" height="65" fill="#fff" rx="8"/><text x="40" y="500" font-size="23" font-weight="700">受限规则拒答</text><text x="330" y="500" font-size="24" >实测 100%</text><text x="510" y="500" font-size="23" >门槛 100%</text><text x="735" y="500" font-size="24" fill="#39805b">满足</text><text x="30" y="645" font-size="21" >工程核对通过；当前结果未满足全部应用门槛，项目结论为quality_not_met。</text></g></svg>
