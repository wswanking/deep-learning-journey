<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-labelledby="c30-training-curves-title c30-training-curves-desc"><title id="c30-training-curves-title">图30-4：本章独立训练的预训练与SFT验证曲线</title><desc id="c30-training-curves-desc">读取本章真实重训记录，预训练固定六百步；SFT八百步过程中每五十步评价回答验证NLL并恢复最低检查点，两个纵轴计分范围不同。</desc><defs><marker id="c30-training-curves-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="675" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="26" font-weight="700">本章独立重训的真实曲线：终点与选点规则事先固定</text><text x="30" y="82" font-size="21" >上：预训练按整份切片计分；下：只按SFT回答区间计分，不共用纵轴含义。</text><text x="85" y="123" font-size="23" font-weight="700">预训练CE（nat/byte）：训练实线 / 验证虚线；固定600步</text><line x1="85" y1="295.0" x2="825" y2="295.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="302.0" font-size="20" text-anchor="end">0</text><line x1="85" y1="220.0" x2="825" y2="220.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="227.0" font-size="20" text-anchor="end">3</text><line x1="85" y1="145.0" x2="825" y2="145.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="152.0" font-size="20" text-anchor="end">6</text><line x1="85.0" y1="145" x2="85.0" y2="295" stroke="#d0dbe7" stroke-width="1.5" /><text x="85.0" y="321" font-size="20" text-anchor="middle">0</text><line x1="455.0" y1="145" x2="455.0" y2="295" stroke="#d0dbe7" stroke-width="1.5" /><text x="455.0" y="321" font-size="20" text-anchor="middle">300</text><line x1="825.0" y1="145" x2="825.0" y2="295" stroke="#d0dbe7" stroke-width="1.5" /><text x="825.0" y="321" font-size="20" text-anchor="middle">600</text><path d="M 85.000 156.362 L 146.667 241.066 L 208.333 261.760 L 270.000 269.783 L 331.667 271.027 L 393.333 271.950 L 455.000 273.381 L 516.667 274.153 L 578.333 274.657 L 640.000 274.809 L 701.667 274.244 L 763.333 271.743 L 825.000 273.306" fill="none" stroke="#246cc0" stroke-width="3"/><path d="M 85.000 156.430 L 146.667 240.022 L 208.333 258.749 L 270.000 266.889 L 331.667 269.224 L 393.333 270.792 L 455.000 270.740 L 516.667 271.947 L 578.333 272.769 L 640.000 273.375 L 701.667 272.157 L 763.333 270.068 L 825.000 271.315" fill="none" stroke="#bd611a" stroke-width="3" stroke-dasharray="9 5"/><text x="455.0" y="346" font-size="20" text-anchor="middle">更新步</text><text x="85" y="388" font-size="23" font-weight="700">SFT回答NLL（nat/byte）；验证最低点250步</text><line x1="85" y1="560.0" x2="825" y2="560.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="567.0" font-size="20" text-anchor="end">0</text><line x1="85" y1="485.0" x2="825" y2="485.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="492.0" font-size="20" text-anchor="end">6.5</text><line x1="85" y1="410.0" x2="825" y2="410.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="417.0" font-size="20" text-anchor="end">13</text><line x1="85.0" y1="410" x2="85.0" y2="560" stroke="#d0dbe7" stroke-width="1.5" /><text x="85.0" y="586" font-size="20" text-anchor="middle">0</text><line x1="455.0" y1="410" x2="455.0" y2="560" stroke="#d0dbe7" stroke-width="1.5" /><text x="455.0" y="586" font-size="20" text-anchor="middle">400</text><line x1="825.0" y1="410" x2="825.0" y2="560" stroke="#d0dbe7" stroke-width="1.5" /><text x="825.0" y="586" font-size="20" text-anchor="middle">800</text><path d="M 85.000 431.490 L 131.250 540.298 L 177.500 537.114 L 223.750 541.872 L 270.000 540.890 L 316.250 546.405 L 362.500 540.667 L 408.750 540.322 L 455.000 541.151 L 501.250 541.104 L 547.500 541.049 L 593.750 541.447 L 640.000 541.422 L 686.250 541.562 L 732.500 541.778 L 778.750 541.795 L 825.000 541.696" fill="none" stroke="#39805b" stroke-width="3"/><text x="455.0" y="611" font-size="20" text-anchor="middle">更新步</text><text x="30" y="635" font-size="21" >不同任务损失不能直接比较；验证选点之后才报告固定测试，失败同样保留。</tex