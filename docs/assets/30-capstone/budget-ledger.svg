<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" role="img" aria-labelledby="c30-budget-ledger-title c30-budget-ledger-desc"><title id="c30-budget-ledger-title">图30-3：真实固定训练预算与独立恢复核验工作账本</title><desc id="c30-budget-ledger-desc">六百步八乘六十四预训练三十万七千二百事件，恢复另算同样预算，八百步十六乘三回答SFT三万八千四百，总六十五万二千八百，重复与目标差异明确。</desc><defs><marker id="c30-budget-ledger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="665" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">优化事件账本：预算相加，质量指标不能混加</text><text x="30" y="82" font-size="21" >本章从零重建并独立验证一次237步恢复；SFT每例监督2字母+LF。</text><text x="35" y="145" font-size="23" font-weight="700">阶段</text><text x="345" y="145" font-size="23" font-weight="700">更新步</text><text x="460" y="145" font-size="23" font-weight="700">批大小</text><text x="575" y="145" font-size="23" font-weight="700">目标/例</text><text x="710" y="145" font-size="23" font-weight="700">目标事件</text><rect x="25" y="177" width="850" height="65" fill="#fff" rx="8"/><text x="35" y="215" font-size="22" >主预训练</text><text x="345" y="215" font-size="22" >600</text><text x="460" y="215" font-size="22" >8</text><text x="575" y="215" font-size="22" >64</text><text x="710" y="215" font-size="22" >307,200</text><rect x="25" y="262" width="850" height="65" fill="#fff" rx="8"/><text x="35" y="300" font-size="22" >恢复核验额外路线</text><text x="345" y="300" font-size="22" >600</text><text x="460" y="300" font-size="22" >8</text><text x="575" y="300" font-size="22" >64</text><text x="710" y="300" font-size="22" >307,200</text><rect x="25" y="347" width="850" height="65" fill="#fff" rx="8"/><text x="35" y="385" font-size="22" >回答区间SFT</text><text x="345" y="385" font-size="22" >800</text><text x="460" y="385" font-size="22" >16</text><text x="575" y="385" font-size="22" >3</text><text x="710" y="385" font-size="22" >38,400</text><text x="30" y="525" font-size="23" >总计652,800个优化目标事件，包含大量重复，不是不同文本字节数。</text><text x="30" y="575" font-size="22" >训练的目标范围不同；该合计用于核算工作，不是可以平均的能力分数。</text><text x="30" y="625" font-size="22" >恢复额外路线237+363=600步；主模型与恢复最终参数实测完全相同。</text></g></svg>
