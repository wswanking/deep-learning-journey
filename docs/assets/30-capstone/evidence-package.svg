<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="c30-evidence-package-title c30-evidence-package-desc"><title id="c30-evidence-package-title">图30-2：源与产物指纹、同源出版及重训重放的证据结构</title><desc id="c30-evidence-package-desc">原创证据包图，sources和artifacts记录不同对象，报告同Markdown生成HTMLPDF，manifest排除自身避免循环摘要，状态参数摘要与文件摘要语义区分。</desc><defs><marker id="c30-evidence-package-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="660" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">证据包：源文件指纹与产物指纹是两张账本</text><text x="30" y="82" font-size="21" >SHA256标识确切文件，不证明语义独立，也不保证换版本得到相同数值。</text><rect x="30" y="135" width="390" height="110" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="225.0" y="169" font-size="24" text-anchor="middle" font-weight="700">sources</text><text x="225.0" y="203" font-size="21" text-anchor="middle">代码 / JSONL / 配置 / 依赖</text><rect x="480" y="135" width="390" height="110" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="675.0" y="169" font-size="24" text-anchor="middle" font-weight="700">artifacts</text><text x="675.0" y="203" font-size="21" text-anchor="middle">权重 / 索引 / JSON / SVG</text><rect x="30" y="320" width="390" height="110" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="225.0" y="354" font-size="24" text-anchor="middle" font-weight="700">report.md → HTML / PDF</text><text x="225.0" y="388" font-size="21" text-anchor="middle">同一Markdown + 纯SVG</text><rect x="480" y="320" width="390" height="110" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="675.0" y="354" font-size="24" text-anchor="middle" font-weight="700">manifest + verification</text><text x="675.0" y="388" font-size="21" text-anchor="middle">逐文件复算；不包含自身循环摘要</text><text x="30" y="520" font-size="21" >检查点文件可以因元数据不同而SHA不同；另记state_sha256识别具体参数。</text><text x="30" y="570" font-size="21" >只读前章代码；本章训练与报告全部落入build/experiments/30-capstone。</text><text x="30" y="620" font-size="22" >重新推理与重新训练分别记录；replay不会冒充本次又完成了800步更新。</text></g></svg>
