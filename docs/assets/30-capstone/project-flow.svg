<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" role="img" aria-labelledby="c30-project-flow-title c30-project-flow-desc"><title id="c30-project-flow-title">图30-1：综合项目的文本训练与资料检索两条路线</title><desc id="c30-project-flow-desc">原创项目结构，文本随机初始化预训练与SFT独立于资料索引和规则抽取，两者共享可追溯评估与交付，不把规则成功冒充语言模型生成。</desc><defs><marker id="c30-project-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="710" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">一个小项目，两条独立的证据路线</text><text x="30" y="82" font-size="22" >统一配置与交付记录；语言模型质量和规则检索质量分别计分。</text><rect x="30" y="130" width="250" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="155.0" y="164" font-size="24" text-anchor="middle" font-weight="700">原创文本</text><text x="155.0" y="198" font-size="21" text-anchor="middle">21章语料与分组</text><rect x="350" y="130" width="240" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="470.0" y="164" font-size="24" text-anchor="middle" font-weight="700">随机初始化训练</text><text x="470.0" y="198" font-size="21" text-anchor="middle">35,328参 / 600步</text><rect x="660" y="130" width="210" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="765.0" y="164" font-size="24" text-anchor="middle" font-weight="700">回答区间SFT</text><text x="765.0" y="198" font-size="21" text-anchor="middle">800步 / 验证选点</text><rect x="30" y="320" width="250" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="155.0" y="354" font-size="24" text-anchor="middle" font-weight="700">原创设施文档</text><text x="155.0" y="388" font-size="21" text-anchor="middle">12篇 / 版本与位置</text><rect x="350" y="320" width="240" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="470.0" y="354" font-size="24" text-anchor="middle" font-weight="700">TF-IDF索引</text><text x="470.0" y="388" font-size="21" text-anchor="middle">验证选切分 / 保存</text><rect x="660" y="320" width="210" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="765.0" y="354" font-size="24" text-anchor="middle" font-weight="700">受限规则读者</text><text x="765.0" y="388" font-size="21" text-anchor="middle">抽取 / 引用 / 拒答</text><line x1="280" y1="180" x2="345" y2="180" stroke="#246cc0" stroke-width="3" marker-end="url(#c30-project-flow-arrow)"/><line x1="590" y1="180" x2="655" y2="180" stroke="#246cc0" stroke-width="3" marker-end="url(#c30-project-flow-arrow)"/><line x1="280" y1="370" x2="345" y2="370" stroke="#246cc0" stroke-width="3" marker-end="url(#c30-project-flow-arrow)"/><line x1="590" y1="370" x2="655" y2="370" stroke="#246cc0" stroke-width="3" marker-end="url(#c30-project-flow-arrow)"/><rect x="30" y="510" width="840" height="105" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450.0" y="544" font-size="24" text-anchor="middle" font-weight="700">统一评估与证据包</text><text x="450.0" y="578" font-size="21" text-anchor="middle">固定36条语言任务 + 16条资料问答；保留真实神经读者失败</text><text x="30" y="668" font-size="21" >不把规则答案当成LM生成；视觉分支可另行接入，并有自己的数据与指标。</text></g></svg>
