<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="c30-failure-cases-title c30-failure-cases-desc"><title id="c30-failure-cases-title">图30-5：独立项目运行中SFT和神经问答的真实失败案例</title><desc id="c30-failure-cases-desc">从实际全部输出选择一个既有错误和一个域外错误，另列有完整资料的真实基座问答失败，用原始字节避免掩盖非法编码，不替换为规则成功。</desc><defs><marker id="c30-failure-cases-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="700" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">失败是交付证据：保留输入、输出和阶段边界</text><rect x="30" y="120" width="840" height="140" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="50" y="154" font-size="25" font-weight="700">既有任务：格式正确但答案错误</text><text x="50" y="200" font-size="22" >指令：反转 de；目标：ed</text><text x="50" y="239" font-size="21" >实际输出：de；已LF停止，严格EM=False</text><rect x="30" y="280" width="840" height="140" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="50" y="314" font-size="25" font-weight="700">新字母：输出范围没有泛化</text><text x="50" y="360" font-size="22" >指令：复制 gh；目标：gh</text><text x="50" y="399" font-size="21" >实际输出：af；格式合格但答案错</text><rect x="30" y="440" width="840" height="140" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="50" y="474" font-size="25" font-weight="700">有真实证据：微型模型仍未正确回答</text><text x="50" y="520" font-size="22" >问题：Sol opening time?；答案：08:30</text><text x="50" y="559" font-size="21" >输入含完整证据；实际字节前8项：[32, 114, 101, 32, 114, 101, 32, 114]</text><text x="30" y="660" font-size="21" >所有案例均来自本章独立运行的JSON；不删非法字节，也不把规则输出替换进去。</text></g></svg>
