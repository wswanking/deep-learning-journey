<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img"><title>有效token归约和困惑度的精确反例</title><desc>原创定义/数值图，依据花书12.4.1、D2L9.3及PyTorch2.15；数据管线为本章原创固定协议。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="570" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="34" font-size="22" fill="#24374c">图20-2  困惑度先汇总有效token损失，再指数；不要平均批次或padding</text><rect x="45" y="90" width="455" height="100" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="65" y="125" font-size="18" fill="#24374c">批次A：1个有效token，平均NLL=log2</text><text x="65" y="165" font-size="18" fill="#24374c">批次B：3个有效token，平均NLL=log8</text><path d="M515,140L585,140" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><rect x="605" y="90" width="425" height="100" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="625" y="125" font-size="19" fill="#1475b8">总NLL = log2 + 3log8</text><text x="625" y="165" font-size="18" fill="#1475b8">总有效数 = 4；PPL = √32 ≈ 5.657</text><text x="65" y="240" font-size="19" fill="#bc570e">错误①：平均两批NLL，再指数 → 4。</text><text x="65" y="278" font-size="19" fill="#bc570e">错误②：平均两批PPL：(2+8)/2 → 5。</text><text x="45" y="340" font-size="19" fill="#24374c">另一个padding例：真实目标概率0.5、0.25，后面两格只是填充。</text><rect x="65" y="370" width="180" height="58" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="88" y="405" font-size="18" fill="#24374c">目标1 / 0.5</text><rect x="275" y="370" width="180" height="58" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="298" y="405" font-size="18" fill="#24374c">目标2 / 0.25</text><rect x="485" y="370" width="180" height="58" rx="5" fill="#edf0f4" stroke="#afc4d6"/><text x="508" y="405" font-size="18" fill="#24374c">PAD / 不计</text><rect x="695" y="370" width="180" height="58" rx="5" fill="#edf0f4" stroke="#afc4d6"/><text x="718" y="405" font-size="18" fill="#24374c">PAD / 不计</text><text x="65" y="475" font-size="19" fill="#24374c">正确分母2：PPL=√8≈2.828；错误分母4：PPL=⁴√8≈1.682。</text><text x="65" y="525" font-size="18" fill="#bc570e">分母错了会制造更低数字；它没有提高模型预测能力。</text></g></svg>
