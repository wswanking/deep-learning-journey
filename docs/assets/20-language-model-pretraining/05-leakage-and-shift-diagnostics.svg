<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img"><title>计数泄漏与标签未移位的真实反例</title><rect width="1080" height="520" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="25" y="35" font-size="22" fill="#24374c">图20-5  指标为何会虚假变好：独立玩具反例，不是正式模型成绩</text><text x="60" y="100" font-size="20" fill="#24374c">把测试文本加入计数，等于提前看到答案。</text><text x="60" y="155" font-size="18" fill="#1475b8">仅训练计数</text><rect x="340" y="130" width="580.0" height="40" fill="#1475b8"/><text x="930.0" y="158" font-size="17" fill="#1475b8">256.00</text><text x="60" y="245" font-size="18" fill="#bc570e">违规加入测试计数</text><rect x="340" y="220" width="18.127358200860343" height="40" fill="#bc570e"/><text x="368.12735820086033" y="248" font-size="17" fill="#bc570e">8.00</text><text x="60" y="340" font-size="20" fill="#24374c">无移位的“预测当前输入”可被复制策略作弊：</text><text x="60" y="380" font-size="18" fill="#24374c">未移位损失 0.00000053，正确移位 20.000001</text><text x="60" y="425" font-size="18" fill="#bc570e">前者不是更好的语言模型；它求解了已经可见的当前token。</text><text x="60" y="480" font-size="16" fill="#24374c">玩具计数使用α=0.1，训练aaaaab、测试xxxxxxy；正式测试数据没有加入训练。</text></g></svg>
