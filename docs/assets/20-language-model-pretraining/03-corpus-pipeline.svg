<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img"><title>原创语料去重分组划分和文档内窗口协议</title><desc>原创定义/数值图，依据花书12.4.1、D2L9.3及PyTorch2.15；数据管线为本章原创固定协议。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="610" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="34" font-size="22" fill="#24374c">图20-3  文档先清理、去重和分组划分，再生成训练窗口</text><rect x="45" y="90" width="260" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="65" y="124" font-size="21" fill="#24374c">原始40条JSONL</text><rect x="410" y="90" width="260" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="430" y="124" font-size="21" fill="#24374c">清理后36条文档</text><rect x="775" y="90" width="260" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="795" y="124" font-size="21" fill="#24374c">12个family组</text><text x="65" y="158" font-size="17" fill="#24374c">含2重复、1空白、1过短</text><text x="430" y="158" font-size="17" fill="#24374c">固定规则 + SHA256去重</text><text x="795" y="158" font-size="17" fill="#24374c">同主题3个变体同组</text><path d="M315,137L397,137" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><path d="M680,137L762,137" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><path d="M905,190V224H195M540,224V250M885,224V250M195,224V250" stroke="#1475b8" stroke-width="2" fill="none"/><rect x="60" y="255" width="270" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="80" y="291" font-size="20" fill="#24374c">训练：8组 / 24文档</text><text x="80" y="325" font-size="18" fill="#24374c">拟合计数/参数</text><rect x="405" y="255" width="270" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="425" y="291" font-size="20" fill="#24374c">验证：2组 / 6文档</text><text x="425" y="325" font-size="18" fill="#24374c">只选择α等配置</text><rect x="750" y="255" width="270" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="770" y="291" font-size="20" fill="#24374c">测试：2组 / 6文档</text><text x="770" y="325" font-size="18" fill="#24374c">冻结后仅作评估</text><text x="50" y="405" font-size="18" fill="#24374c">组内模板变体不跨集合；精确重复与group_id冲突时拒绝，先核对来源身份。</text><rect x="45" y="440" width="990" height="90" rx="5" fill="#fff2e6" stroke="#afc4d6"/><text x="65" y="472" font-size="18" fill="#24374c">文档ABCD，窗口长2：[A B]→[B C]；[C]→[D]。标签B/C/D各出现一次。</text><text x="65" y="508" font-size="18" fill="#24374c">文档边界不生成相邻对；右padding输入0，但mask=False、目标=-100。</text><text x="50" y="572" font-size="17" fill="#bc570e">仅按原始行先切分，本例会留下2个跨训练/测试重复哈希；不能用更多训练步修复。</text></g></svg>
