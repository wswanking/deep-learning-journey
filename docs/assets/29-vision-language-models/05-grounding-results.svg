<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img"><title>真实完整回答指标与图像干预结果</title><desc>原创结构与小数值示意，依据LLaVA2023第4节、BLIP2第3节和本章真实报告。图像样例以256个矩形直接表达实际RGB数组，无嵌入位图。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="640" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="22" fill="#24374c">图29-5  生成时是否依据图像：完整回答率与换图/遮图诊断</text><text x="45" y="125" font-size="18" fill="#24374c">只训连接器</text><rect x="490" y="105" width="16.296296296296294" height="28" fill="#1475b8"/><text x="516.2962962962963" y="127" font-size="18" fill="#24374c">3.70%</text><text x="45" y="190" font-size="18" fill="#24374c">联合微调</text><rect x="490" y="170" width="435.9259259259259" height="28" fill="#1475b8"/><text x="935.9259259259259" y="192" font-size="18" fill="#24374c">99.07%</text><text x="45" y="255" font-size="18" fill="#24374c">恒定黑图训练</text><rect x="490" y="235" width="114.07407407407406" height="28" fill="#1475b8"/><text x="614.074074074074" y="257" font-size="18" fill="#24374c">25.93%</text><text x="45" y="320" font-size="18" fill="#24374c">联合模型：换图仍按原答案评分</text><rect x="490" y="300" width="2.716049382716049" height="28" fill="#bc570e"/><text x="502.71604938271605" y="322" font-size="18" fill="#24374c">0.62%</text><text x="45" y="385" font-size="18" fill="#24374c">联合模型：换图按新图答案评分</text><rect x="490" y="365" width="435.9259259259259" height="28" fill="#bc570e"/><text x="935.9259259259259" y="387" font-size="18" fill="#24374c">99.07%</text><text x="45" y="450" font-size="18" fill="#24374c">联合模型：用黑图遮挡</text><rect x="490" y="430" width="0.0" height="28" fill="#bc570e"/><text x="500.0" y="452" font-size="18" fill="#24374c">0.00%</text><text x="45" y="540" font-size="18" fill="#24374c">同9类、新渲染seed；测试108图×3问题=324条。换图规则让颜色和形状都变。</text><text x="45" y="585" font-size="17" fill="#bc570e">遮挡是分布外诊断，不能将低分自动解释为统一“幻觉率”；这里只测封闭属性。</text></g></svg>
