<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img"><title>连续视觉前缀的完整形状与两阶段训练</title><desc>原创结构与小数值示意，依据LLaVA2023第4节、BLIP2第3节和本章真实报告。图像样例以256个矩形直接表达实际RGB数组，无嵌入位图。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="600" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="22" fill="#24374c">图29-1  图像经视觉编码、连接器，成为语言模型可读取的连续前缀</text><rect x="35" y="100" width="160" height="130" rx="5" fill="#edf0f4" stroke="#afc4d6"/><circle cx="115" cy="148" r="30" fill="#2143ca"/><text x="55" y="210" font-size="17" fill="#24374c">图像 [3,16,16]</text><path d="M205,165L245,165" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><rect x="255" y="100" width="220" height="130" rx="5" fill="#edf0f4" stroke="#afc4d6"/><text x="277" y="137" font-size="21" fill="#24374c">冻结视觉编码器</text><text x="277" y="177" font-size="18" fill="#24374c">4×4补丁 → 16位置</text><text x="277" y="210" font-size="18" fill="#24374c">每位置32维</text><path d="M485,165L525,165" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><rect x="535" y="100" width="225" height="130" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="555" y="137" font-size="20" fill="#24374c">连接器32→64→32</text><text x="555" y="177" font-size="17" fill="#24374c">共享MLP逐位置映射</text><text x="555" y="210" font-size="18" fill="#24374c">4192可训练参数</text><path d="M770,165L810,165" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="100" width="225" height="130" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="840" y="137" font-size="20" fill="#24374c">视觉前缀 [16,32]</text><text x="840" y="177" font-size="18" fill="#24374c">不是16个词表ID</text><text x="840" y="210" font-size="18" fill="#24374c">再接问题/答案历史</text><path d="M935,240V282H200V325" fill="none" stroke="#1475b8" stroke-width="2"/><rect x="65" y="335" width="285" height="100" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="85" y="373" font-size="21" fill="#24374c">16视觉 + T文字位置</text><text x="85" y="410" font-size="17" fill="#24374c">总长度≤64，显式因果mask</text><path d="M360,385L425,385" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><rect x="435" y="335" width="270" height="100" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="455" y="373" font-size="21" fill="#24374c">因果微型语言模型</text><text x="455" y="410" font-size="18" fill="#24374c">逐字节预测分布 [256]</text><path d="M715,385L780,385" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="335" width="255" height="100" rx="5" fill="#fff2e6" stroke="#afc4d6"/><text x="810" y="373" font-size="18" fill="#24374c">describe: → blue circle</text><text x="810" y="410" font-size="17" fill="#24374c">生成答案字节，遇LF停</text><text x="50" y="500" font-size="18" fill="#24374c">阶段1：视觉/语言都冻结，只训连接器；阶段2：视觉仍冻结，连接器+语言模型联合更新。</text><text x="50" y="550" font-size="18" fill="#bc570e">图标是概念示意；实际数据是原创16×16 RGB噪声图，不是自然照片或大型VLM。</text></g></svg>
