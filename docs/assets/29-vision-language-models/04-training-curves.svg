374c">0</text><text x="600.0" y="460" font-size="14" fill="#24374c">0</text><path d="M610,357.5H1000" stroke="#e0e7ef"/><text x="568" y="362.5" font-size="14" fill="#24374c">1.25</text><text x="697.5" y="460" font-size="14" fill="#24374c">200</text><path d="M610,285.0H1000" stroke="#e0e7ef"/><text x="568" y="290.0" font-size="14" fill="#24374c">2.5</text><text x="795.0" y="460" font-size="14" fill="#24374c">400</text><path d="M610,212.5H1000" stroke="#e0e7ef"/><text x="568" y="217.5" font-size="14" fill="#24374c">3.75</text><text x="892.5" y="460" font-size="14" fill="#24374c">600</text><path d="M610,140.0H1000" stroke="#e0e7ef"/><text x="568" y="145.0" font-size="14" fill="#24374c">5</text><text x="990.0" y="460" font-size="14" fill="#24374c">800</text><polyline points="610.0,304.34715318225676 634.375,428.6311354762032 658.75,429.1999390227454 683.125,429.5343349417051 707.5,429.7145270290829 731.875,429.72105804227647 756.25,429.80331474074296 780.625,427.7756390741893 805.0,429.82274869545586 829.375,429.7215204150194 853.75,429.8613301393532 878.125,429.9008407529621 902.5,429.86133830256404 926.875,429.9158222914097 951.25,429.9243463277462 975.625,429.9386671430653 1000.0,429.8315159963" stroke="#1475b8" fill="none" stroke-width="2.7"/><polyline points="610.0,145.9219079880487 634.375,417.09994712557113 658.75,417.63488548369634 683.125,418.26459087190176 707.5,418.2830470130557 731.875,418.23086541493734 756.25,418.57106290544783 780.625,418.19652091207956 805.0,418.61775230680195 829.375,418.3896749519167 853.75,418.7905577069237 878.125,418.6536752746219 902.5,418.844129771278 926.875,418.6936757405599 951.25,418.62699960526965 975.625,418.22863998413084 1000.0,418.6459650221325" stroke="#bc570e" fill="none" stroke-width="2.7" stroke-dasharray="8 6"/><text x="735" y="500" font-size="18" fill="#24374c">该阶段更新步数</text><text x="65" y="550" font-size="18" fill="#24374c">蓝实线：真实图像；橙虚线：恒定黑图；纵轴=验证回答平均NLL（自然对数）。</text><text x="65" y="590" font-size="17" fill="#bc570