<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img"><title>离散文字与连续视觉表示、连接器的原创手算</title><desc>原创结构与小数值示意，依据LLaVA2023第4节、BLIP2第3节和本章真实报告。图像样例以256个矩形直接表达实际RGB数组，无嵌入位图。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="620" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="22" fill="#24374c">图29-2  “同维度”只是接口条件；连接器还需学会被语言模型使用</text><rect x="50" y="90" width="450" height="135" rx="5" fill="#edf0f4" stroke="#afc4d6"/><text x="75" y="128" font-size="22" fill="#24374c">离散文字</text><text x="75" y="171" font-size="18" fill="#24374c">byte ID 65 → embedding查表 → 32维</text><text x="75" y="205" font-size="18" fill="#24374c">输入是整数类别；输出是连续向量</text><rect x="550" y="90" width="480" height="135" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="575" y="128" font-size="22" fill="#24374c">连续视觉</text><text x="575" y="171" font-size="18" fill="#24374c">图像特征32维 → 学习连接器 → 32维</text><text x="575" y="205" font-size="18" fill="#24374c">没有先强行挑一个“最相近的单词ID”</text><text x="50" y="285" font-size="20" fill="#24374c">线性手算：Z = F Wᵀ + b；2个位置、视觉2维，输出语言3维。</text><rect x="50" y="325" width="270" height="145" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="75" y="365" font-size="22" fill="#24374c">F = [1 2; 3 4]</text><text x="75" y="410" font-size="18" fill="#24374c">每一行是一个位置</text><path d="M330,395L385,395" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><rect x="395" y="325" width="320" height="145" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="415" y="365" font-size="20" fill="#24374c">W = [1 0; 0 1; 1 −1]</text><text x="415" y="410" font-size="20" fill="#24374c">b = [0.5, −0.5, 1]</text><path d="M725,395L775,395" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#a)"/><rect x="785" y="325" width="245" height="145" rx="5" fill="#fff2e6" stroke="#afc4d6"/><text x="805" y="365" font-size="20" fill="#24374c">Z = [1.5 1.5 0;</text><text x="845" y="410" font-size="20" fill="#24374c">3.5 3.5 0]</text><text x="50" y="530" font-size="18" fill="#24374c">仅有Z的形状正确不等于语义已对齐；回答损失经冻结语言模型把梯度传回连接器。</text><text x="50" y="575" font-size="18" fill="#bc570e">本机使用两层MLP；上面的线性例子只为手算与NumPy/PyTorch逐项核对。</text></g></svg>
