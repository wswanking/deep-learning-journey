<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="c27-calibration-toy-title c27-calibration-toy-desc"><title id="c27-calibration-toy-title">图27-3：虚构二分类概率的Brier与分桶校准手算</title><desc id="c27-calibration-toy-desc">原创四例校准演示，两个桶的平均预测类别信心和准确率，二元Brier零点二零五，ECE零点二五。明确不是LM实测校准结论。</desc><defs><marker id="c27-calibration-toy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="680" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">校准手算：信心高不代表答得对</text><text x="30" y="82" font-size="21" >独立的二分类虚构例：正类概率[0.9,0.8,0.6,0.1]，标签[1,0,1,0]。</text><rect x="165" y="255.0" width="100" height="150.0" fill="#246cc0" rx="5"/><rect x="280" y="155.0" width="100" height="250.0" fill="#bd611a" rx="5"/><text x="215" y="238.0" font-size="22" text-anchor="middle">0.600</text><text x="330" y="138.0" font-size="22" text-anchor="middle">1.000</text><text x="270" y="443" font-size="24" text-anchor="middle">[0.5,0.75)</text><text x="270" y="480" font-size="22" text-anchor="middle">n=1</text><rect x="565" y="188.33333333333331" width="100" height="216.66666666666669" fill="#246cc0" rx="5"/><rect x="680" y="238.33333333333334" width="100" height="166.66666666666666" fill="#bd611a" rx="5"/><text x="615" y="171.33333333333331" font-size="22" text-anchor="middle">0.867</text><text x="730" y="221.33333333333334" font-size="22" text-anchor="middle">0.667</text><text x="670" y="443" font-size="24" text-anchor="middle">[0.75,1]</text><text x="670" y="480" font-size="22" text-anchor="middle">n=3</text><line x1="80" y1="405" x2="830" y2="405" stroke="#172c44" stroke-width="2" /><line x1="40" y1="535" x2="85" y2="535" stroke="#246cc0" stroke-width="4" /><text x="95" y="543" font-size="22" >平均预测类别信心</text><line x1="460" y1="535" x2="505" y2="535" stroke="#bd611a" stroke-width="4" /><text x="515" y="543" font-size="22" >实际类别准确率</text><text x="30" y="594" font-size="21" >二元Brier=(0.01+0.64+0.16+0.01)/4=0.205；这两个桶的ECE=0.25。</text><text x="30" y="641" font-size="21" >分桶改变ECE；小样本有噪声。它不是本章语言模型的实测校准曲线。</text></g></svg>
