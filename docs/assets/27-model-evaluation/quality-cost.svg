<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="c27-quality-cost-title c27-quality-cost-desc"><title id="c27-quality-cost-title">图27-7：真实固定任务EM与一次预热中位CPU延迟</title><desc id="c27-quality-cost-desc">实际基座SFT原样输出基线在既有测试上的质量和毫秒延迟对数点图，输出长度不同且只有单次小样本，不声称服务性能或每token提速。</desc><defs><marker id="c27-quality-cost-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="640" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">单次本机质量—成本点图：输出长度影响耗时</text><text x="30" y="82" font-size="21" >只画既有22测试切片；横轴为单次预热后中位耗时，毫秒，对数刻度。</text><line x1="100.0" y1="145" x2="100.0" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="100.0" y="445" font-size="21" text-anchor="middle">0.001</text><line x1="243.0" y1="145" x2="243.0" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="243.0" y="445" font-size="21" text-anchor="middle">0.01</text><line x1="386.0" y1="145" x2="386.0" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="386.0" y="445" font-size="21" text-anchor="middle">0.1</text><line x1="529.0" y1="145" x2="529.0" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="529.0" y="445" font-size="21" text-anchor="middle">1</text><line x1="672.0" y1="145" x2="672.0" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="672.0" y="445" font-size="21" text-anchor="middle">10</text><line x1="815.0" y1="145" x2="815.0" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="815.0" y="445" font-size="21" text-anchor="middle">100</text><line x1="100" y1="415.0" x2="815" y2="415.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="90" y="422.0" font-size="21" text-anchor="end">0%</text><line x1="100" y1="302.5" x2="815" y2="302.5" stroke="#d0dbe7" stroke-width="1.5" /><text x="90" y="309.5" font-size="21" text-anchor="end">25%</text><line x1="100" y1="190.0" x2="815" y2="190.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="90" y="197.0" font-size="21" text-anchor="end">50%</text><circle cx="718.3541404084534" cy="415.0" r="8" fill="#246cc0"/><text x="706.3541404084534" y="400.0" font-size="21" text-anchor="end">基座 21.0938ms</text><circle cx="638.4682292749845" cy="302.5" r="8" fill="#bd611a"/><text x="626.4682292749845" y="287.5" font-size="21" >SFT 5.8279ms</text><circle cx="225.13326957173774" cy="190.0" r="8" fill="#39805b"/><text x="213.13326957173774" y="175.0" font-size="21" >原样输出 0.0075ms</text><text x="30" y="505" font-size="21" >基座每例用满8字节，SFT通常3字节就停止；不能据此说SFT每步算子更快。</text><text x="30" y="551" font-size="21" >规则基线不运行神经网络；计时含张量创建和解码，不含训练与模型加载。</text><text x="30" y="597" font-size="22" >样本仅24例、一次进程；不外推服务P95、并发吞吐或CPU峰值性能。</text></g></svg>
