<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="c27-rag-failures-title c27-rag-failures-desc"><title id="c27-rag-failures-title">图27-5：实际RAG组件结果与明确受控失效注入</title><desc id="c27-rag-failures-desc">规则读者十二回答四拒答成功，实际相同基座十二有证据仍错误；另主动删除来源和设零上下文验证错误分类，干预不计入自然测试成绩。</desc><defs><marker id="c27-rag-failures-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="660" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="25" font-weight="700">RAG错误按证据链定位：规则读者与真实LM分别报告</text><text x="30" y="82" font-size="21" >原始26章冻结测试：12题有答案+4题无资料；引用均核对原文区间。</text><rect x="30" y="135" width="840" height="110" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450.0" y="169" font-size="24" text-anchor="middle" font-weight="700">规则抽取器：12个有支持答案 + 4个正确拒答</text><text x="450.0" y="203" font-size="21" text-anchor="middle">单实体/字段语法限定；不代表神经模型已会读文档</text><rect x="30" y="290" width="840" height="110" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450.0" y="324" font-size="24" text-anchor="middle" font-weight="700">真实35k字节模型：12题证据在上下文，仍全部答错</text><text x="450.0" y="358" font-size="21" text-anchor="middle">reader_error=12；保留全部实际字节与非法UTF-8</text><rect x="30" y="445" width="840" height="110" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450.0" y="479" font-size="24" text-anchor="middle" font-weight="700">受控诊断：删去正确来源 → retrieval_miss</text><text x="450.0" y="513" font-size="21" text-anchor="middle">另将上下文预算设0 → context_lost；是主动干预，不混入自然测试</text><text x="30" y="620" font-size="21" >候选未命中、上下文丢失、读错、引用不支持、无证据乱答需要不同检查。</text></g></svg>
