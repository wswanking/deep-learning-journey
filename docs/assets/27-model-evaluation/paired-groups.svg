<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-labelledby="c27-paired-groups-title c27-paired-groups-desc"><title id="c27-paired-groups-title">图27-4：按组配对比较与小样本bootstrap边界</title><desc id="c27-paired-groups-desc">真实三个字母组SFT减基座差值分别二十五十二点五三十七点五个百分点，组bootstrap范围十二点五至三十七点五，只做描述性范围，不保证总体覆盖或域外零差。</desc><defs><marker id="c27-paired-groups-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="630" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">同一组同时比较两个模型，再重抽组</text><text x="30" y="82" font-size="21" >既有测试只有3个无序字母组，每组8个变体；不能当成24个无关问题。</text><line x1="190.0" y1="145" x2="190.0" y2="365" stroke="#d0dbe7" stroke-width="1.5" /><text x="190.0" y="395" font-size="21" text-anchor="middle">0%</text><line x1="347.5" y1="145" x2="347.5" y2="365" stroke="#d0dbe7" stroke-width="1.5" /><text x="347.5" y="395" font-size="21" text-anchor="middle">12.5%</text><line x1="505.0" y1="145" x2="505.0" y2="365" stroke="#d0dbe7" stroke-width="1.5" /><text x="505.0" y="395" font-size="21" text-anchor="middle">25%</text><line x1="662.5" y1="145" x2="662.5" y2="365" stroke="#d0dbe7" stroke-width="1.5" /><text x="662.5" y="395" font-size="21" text-anchor="middle">37.5%</text><line x1="820.0" y1="145" x2="820.0" y2="365" stroke="#d0dbe7" stroke-width="1.5" /><text x="820.0" y="395" font-size="21" text-anchor="middle">50%</text><text x="170" y="197" font-size="23" text-anchor="end">pair:ac</text><line x1="190" y1="190" x2="505.0" y2="190" stroke="#246cc0" stroke-width="5" /><circle cx="505.0" cy="190" r="7" fill="#246cc0"/><text x="170" y="267" font-size="23" text-anchor="end">pair:bc</text><line x1="190" y1="260" x2="347.5" y2="260" stroke="#246cc0" stroke-width="5" /><circle cx="347.5" cy="260" r="7" fill="#246cc0"/><text x="170" y="337" font-size="23" text-anchor="end">pair:de</text><line x1="190" y1="330" x2="662.5" y2="330" stroke="#246cc0" stroke-width="5" /><circle cx="662.5" cy="330" r="7" fill="#246cc0"/><text x="30" y="455" font-size="22" >平均差=SFT−基座=25个百分点；2000次组重抽的2.5%~97.5%范围</text><text x="30" y="500" font-size="22" >为12.5~37.5个百分点。仅有3个合成组，不能保证总体95%覆盖率。</text><text x="30" y="545" font-size="21" >新字母各组两模型均错：重抽区间[0,0]，也不表示真实差异必然为0。</text><text x="30" y="590" font-size="23" >配对保留“同一问题”的相关性；按组重抽保留组内变体关系。</text></g></svg>
