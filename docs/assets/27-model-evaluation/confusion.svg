<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="c27-confusion-title c27-confusion-desc"><title id="c27-confusion-title">图27-2：二分类混淆矩阵与准确率精确率召回率F1</title><desc id="c27-confusion-desc">原创二十例手算矩阵，真实作为行预测作为列，八真阳两假阳四假阴六真阴，展示不同分母和零分母不适用。</desc><defs><marker id="c27-confusion-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="610" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">混淆矩阵手算：先声明正类，再计算分母</text><text x="30" y="82" font-size="21" >教学虚构例：真实正类表示应触发告警；共20个示例，仅用于手算。</text><text x="340" y="145" font-size="25" text-anchor="middle" font-weight="700">预测正</text><text x="620" y="145" font-size="25" text-anchor="middle" font-weight="700">预测负</text><text x="130" y="245" font-size="25" text-anchor="middle" font-weight="700">真实正</text><text x="130" y="365" font-size="25" text-anchor="middle" font-weight="700">真实负</text><rect x="220" y="175" width="260" height="100" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="350" y="235" font-size="29" text-anchor="middle">TP = 8</text><rect x="500" y="175" width="260" height="100" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="630" y="235" font-size="29" text-anchor="middle">FN = 4</text><rect x="220" y="295" width="260" height="100" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="350" y="355" font-size="29" text-anchor="middle">FP = 2</text><rect x="500" y="295" width="260" height="100" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="630" y="355" font-size="29" text-anchor="middle">TN = 6</text><text x="30" y="470" font-size="24" >准确率=(8+6)/20=70%；精确率=8/(8+2)=80%。</text><text x="30" y="520" font-size="24" >召回率=8/(8+4)=66.7%；F1=16/(16+2+4)=72.7%。</text><text x="30" y="570" font-size="22" >没有预测正类时精确率分母为0；本章记null，而不是100%。</text></g></svg>
