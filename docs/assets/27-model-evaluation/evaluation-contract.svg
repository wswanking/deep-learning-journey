<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" role="img" aria-labelledby="c27-evaluation-contract-title c27-evaluation-contract-desc"><title id="c27-evaluation-contract-title">图27-1：冻结对象与评估协议的完整流程</title><desc id="c27-evaluation-contract-desc">原创评估合同流程，冻结权重数据模板和停止规则，保存逐例结果，按切片基线与分组比较，再定位失败，不用反复测试反馈作未披露调参。</desc><defs><marker id="c27-evaluation-contract-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="670" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="25" font-weight="700">评估先写合同：模型、输入、指标与停止规则一起固定</text><text x="30" y="82" font-size="21" >相同模型也会因模板、答案归一化、字节预算或数据切片得到不同分数。</text><rect x="30" y="130" width="370" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="215.0" y="164" font-size="24" text-anchor="middle" font-weight="700">① 冻结评估对象</text><text x="215.0" y="198" font-size="21" text-anchor="middle">权重 / tokenizer / 来源SHA</text><rect x="500" y="130" width="370" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="685.0" y="164" font-size="24" text-anchor="middle" font-weight="700">② 固定数据和协议</text><text x="685.0" y="198" font-size="21" text-anchor="middle">分组 / 模板 / 8字节 / LF停止</text><rect x="30" y="295" width="370" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="215.0" y="329" font-size="24" text-anchor="middle" font-weight="700">③ 保存所有逐例结果</text><text x="215.0" y="363" font-size="21" text-anchor="middle">字节 / 终止 / NLL / 耗时</text><rect x="500" y="295" width="370" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="685.0" y="329" font-size="24" text-anchor="middle" font-weight="700">④ 按切片汇总与比较</text><text x="685.0" y="363" font-size="21" text-anchor="middle">分母 / 基线 / 组重抽范围</text><line x1="400" y1="180" x2="495" y2="180" stroke="#246cc0" stroke-width="3" marker-end="url(#c27-evaluation-contract-arrow)"/><line x1="685" y1="230" x2="685" y2="265" stroke="#246cc0" stroke-width="3" /><line x1="685" y1="265" x2="215" y2="265" stroke="#246cc0" stroke-width="3" /><line x1="215" y1="265" x2="215" y2="290" stroke="#246cc0" stroke-width="3" marker-end="url(#c27-evaluation-contract-arrow)"/><line x1="400" y1="345" x2="495" y2="345" stroke="#246cc0" stroke-width="3" marker-end="url(#c27-evaluation-contract-arrow)"/><rect x="30" y="475" width="840" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450.0" y="509" font-size="24" text-anchor="middle" font-weight="700">⑤ 定位失败与决定下一轮开发</text><text x="450.0" y="543" font-size="21" text-anchor="middle">新假设使用开发数据；不根据这批测试答案调参后继续称盲测</text><text x="30" y="630" font-size="21" >本章不训练；22既有测试复评与新增域外诊断分别报告，不包装成新排行榜。</text></g></svg>
