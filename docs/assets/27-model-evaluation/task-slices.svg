<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="c27-task-slices-title c27-task-slices-desc"><title id="c27-task-slices-title">图27-6：冻结基座SFT与原样输出基线按数据切片的真实EM</title><desc id="c27-task-slices-desc">真实两任务切片柱图，基座均零，SFT既有测试百分之二十五域外零，原样输出基线两套百分之五十，格式与内容分开。</desc><defs><marker id="c27-task-slices-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="640" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">真实任务切片：格式变好，与正确率变好是两件事</text><text x="30" y="82" font-size="21" >既有22测试24例；新增g..l域外12例；均固定8字节上限与LF停止。</text><text x="70" y="140" font-size="25" font-weight="700">既有测试：a..f</text><rect x="70" y="405.0" width="75" height="1" fill="#246cc0" rx="4"/><text x="107" y="388.0" font-size="24" text-anchor="middle">0%</text><text x="107" y="438" font-size="21" text-anchor="middle">基座</text><rect x="185" y="305.0" width="75" height="100.0" fill="#bd611a" rx="4"/><text x="222" y="288.0" font-size="24" text-anchor="middle">25%</text><text x="222" y="438" font-size="21" text-anchor="middle">SFT</text><rect x="300" y="205.0" width="75" height="200.0" fill="#39805b" rx="4"/><text x="337" y="188.0" font-size="24" text-anchor="middle">50%</text><text x="337" y="438" font-size="21" text-anchor="middle">原样输出</text><line x1="60" y1="405" x2="410" y2="405" stroke="#172c44" stroke-width="2" /><text x="510" y="140" font-size="25" font-weight="700">新字母诊断：g..l</text><rect x="510" y="405.0" width="75" height="1" fill="#246cc0" rx="4"/><text x="547" y="388.0" font-size="24" text-anchor="middle">0%</text><text x="547" y="438" font-size="21" text-anchor="middle">基座</text><rect x="625" y="405.0" width="75" height="1" fill="#bd611a" rx="4"/><text x="662" y="388.0" font-size="24" text-anchor="middle">0%</text><text x="662" y="438" font-size="21" text-anchor="middle">SFT</text><rect x="740" y="205.0" width="75" height="200.0" fill="#39805b" rx="4"/><text x="777" y="188.0" font-size="24" text-anchor="middle">50%</text><text x="777" y="438" font-size="21" text-anchor="middle">原样输出</text><line x1="500" y1="405" x2="850" y2="405" stroke="#172c44" stroke-width="2" /><text x="30" y="505" font-size="22" >SFT既有测试格式100%，答案只有6/24；新字母格式100%，答案0/12。</text><text x="30" y="552" font-size="22" >原样输出基线只会复制，不会反转；平衡两任务使它恰好得到50%。</text><text x="30" y="599" font-size="23" >简单基线更高也是结果；两套数据不能拼成一个“通用能力分”。</text></g></svg>
