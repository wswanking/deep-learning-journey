<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img"><title>二维互相关逐格计算与参数共享</title><desc>原创解析示意；定义依据花书第9章、D2L第7章及PyTorch2.15。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="570" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="34" font-size="23" fill="#24374c" text-anchor="start">图11-1  一个核在所有空间位置重复使用：互相关手算</text><text x="55" y="85" font-size="18" fill="#24374c" text-anchor="start">输入 X：3 × 3</text><rect x="55" y="105" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="84" y="140" font-size="18" fill="#1475b8" text-anchor="middle">1</text><rect x="113" y="105" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="142" y="140" font-size="18" fill="#1475b8" text-anchor="middle">2</text><rect x="171" y="105" width="58" height="58" rx="0" fill="white" stroke="#afc4d6"/><text x="200" y="140" font-size="18" fill="#24374c" text-anchor="middle">3</text><rect x="55" y="163" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="84" y="198" font-size="18" fill="#1475b8" text-anchor="middle">4</text><rect x="113" y="163" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="142" y="198" font-size="18" fill="#1475b8" text-anchor="middle">5</text><rect x="171" y="163" width="58" height="58" rx="0" fill="white" stroke="#afc4d6"/><text x="200" y="198" font-size="18" fill="#24374c" text-anchor="middle">6</text><rect x="55" y="221" width="58" height="58" rx="0" fill="white" stroke="#afc4d6"/><text x="84" y="256" font-size="18" fill="#24374c" text-anchor="middle">7</text><rect x="113" y="221" width="58" height="58" rx="0" fill="white" stroke="#afc4d6"/><text x="142" y="256" font-size="18" fill="#24374c" text-anchor="middle">8</text><rect x="171" y="221" width="58" height="58" rx="0" fill="white" stroke="#afc4d6"/><text x="200" y="256" font-size="18" fill="#24374c" text-anchor="middle">9</text><text x="335" y="85" font-size="18" fill="#24374c" text-anchor="start">核 K：2 × 2</text><rect x="335" y="105" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="364" y="140" font-size="18" fill="#1475b8" text-anchor="middle">1</text><rect x="393" y="105" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="422" y="140" font-size="18" fill="#1475b8" text-anchor="middle">2</text><rect x="335" y="163" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="364" y="198" font-size="18" fill="#1475b8" text-anchor="middle">0</text><rect x="393" y="163" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="422" y="198" font-size="18" fill="#1475b8" text-anchor="middle">-1</text><text x="680" y="85" font-size="18" fill="#24374c" text-anchor="start">输出 Y：2 × 2</text><rect x="680" y="105" width="58" height="58" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><text x="709" y="140" font-size="18" fill="#1475b8" text-anchor="middle">0</text><rect x="738" y="105" width="58" height="58" rx="0" fill="white" stroke="#afc4d6"/><text x="767" y="140" font-size="18" fill="#24374c" text-anchor="middle">2</text><rect x="680" y="163" width="58" height="58" rx="0" fill="white" stroke="#afc4d6"/><text x="709" y="198" font-size="18" fill="#24374c" text-anchor="middle">6</text><rect x="738" y="163" width="58" height="58" rx="0" fill="white" stroke="#afc4d6"/><text x="767" y="198" font-size="18" fill="#24374c" text-anchor="middle">8</text><path d="M245,165 L315,165" fill="none" stroke="#1475b8" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M470,165 L655,165" fill="none" stroke="#1475b8" stroke-width="1.8" marker-end="url(#arrow)"/><text x="490" y="145" font-size="16" fill="#24374c" text-anchor="start">逐元素乘后求和</text><rect x="55" y="310" width="960" height="78" rx="4" fill="#eaf4fc" stroke="#afc4d6"/><text x="75" y="340" font-size="20" fill="#24374c" text-anchor="start">左上窗口：1 × 1 + 2 × 2 + 4 × 0 + 5 × (−1) = 0</text><text x="75" y="370" font-size="18" fill="#24374c" text-anchor="start">向右移动1格：2 × 1 + 3 × 2 + 5 × 0 + 6 × (−1) = 2</text><rect x="55" y="410" width="960" height="92" rx="4" fill="#fff2e6" stroke="#afc4d6"/><text x="75" y="441" font-size="20" fill="#bc570e" text-anchor="start">四个窗口共享同一组4个权重；有偏置时再加1个共享标量。</text><text x="75" y="476" font-size="18" fill="#bc570e" text-anchor="start">数学卷积会将核翻转180°：本例翻转后输出 [12,14;18,20]，不能混用。</text><text x="55" y="540" font-size="16" fill="#24374c" text-anchor="start">窗口不是矩阵乘法；这里核不翻转，偏置为0，步幅1，无填充。</text></g></svg>
