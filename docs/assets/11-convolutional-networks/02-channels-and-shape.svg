<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img"><title>多通道聚合、参数量与步幅尺寸</title><desc>原创解析示意；定义依据花书第9章、D2L第7章及PyTorch2.15。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs><rect width="1080" height="660" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="34" font-size="22" fill="#24374c" text-anchor="start">图11-2  输入通道求和，输出通道保留；尺寸由窗口能放几次决定</text><text x="50" y="85" font-size="18" fill="#24374c" text-anchor="start">两输入通道小例子：第二通道是2X，第二片核是0.5K</text><rect x="50" y="110" width="230" height="76" rx="4" fill="#eaf4fc" stroke="#afc4d6"/><text x="70" y="140" font-size="20" fill="#1475b8" text-anchor="start">X 与 K → R</text><text x="70" y="170" font-size="17" fill="#24374c" text-anchor="start">R = [0,2;6,8]</text><rect x="50" y="215" width="230" height="76" rx="4" fill="#eaf4fc" stroke="#afc4d6"/><text x="70" y="245" font-size="20" fill="#1475b8" text-anchor="start">2X 与 0.5K → R</text><text x="70" y="275" font-size="17" fill="#24374c" text-anchor="start">按输入通道分别计算</text><path d="M285,148 L360,195" fill="none" stroke="#1475b8" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M285,253 L360,205" fill="none" stroke="#1475b8" stroke-width="1.8" marker-end="url(#arrow)"/><text x="370" y="210" font-size="35" fill="#1475b8" text-anchor="start">＋</text><path d="M410,200 L470,200" fill="none" stroke="#1475b8" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="490" y="145" width="52" height="52" rx="0" fill="white" stroke="#afc4d6"/><text x="516" y="177" font-size="18" fill="#24374c" text-anchor="middle">0</text><rect x="542" y="145" width="52" height="52" rx="0" fill="white" stroke="#afc4d6"/><text x="568" y="177" font-size="18" fill="#24374c" text-anchor="middle">4</text><rect x="490" y="197" width="52" height="52" rx="0" fill="white" stroke="#afc4d6"/><text x="516" y="229" font-size="18" fill="#24374c" text-anchor="middle">12</text><rect x="542" y="197" width="52" height="52" rx="0" fill="white" stroke="#afc4d6"/><text x="568" y="229" font-size="18" fill="#24374c" text-anchor="middle">16</text><text x="650" y="165" font-size="19" fill="#24374c" text-anchor="start">相加得到1张输出图</text><text x="650" y="198" font-size="17" fill="#24374c" text-anchor="start">换另一组完整核 → 另1张图</text><text x="650" y="231" font-size="17" fill="#24374c" text-anchor="start">偏置：每个输出通道1个</text><rect x="45" y="335" width="990" height="75" rx="4" fill="#fff2e6" stroke="#afc4d6"/><text x="65" y="365" font-size="20" fill="#24374c" text-anchor="start">核形状 (Cout, Cin, kh, kw)：例如 (4,3,3,3)</text><text x="65" y="395" font-size="18" fill="#24374c" text-anchor="start">参数数 = 4 × (3 × 3 × 3 + 1) = 112；不乘输出图的高与宽。</text><text x="50" y="455" font-size="19" fill="#24374c" text-anchor="start">单轴例：H=8，k=3，p=1（两侧各1），s=2，d=1</text><rect x="65" y="480" width="77" height="24" rx="0" fill="#eef0f3" stroke="#afc4d6"/><rect x="148" y="480" width="77" height="24" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><rect x="231" y="480" width="77" height="24" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><rect x="314" y="480" width="77" height="24" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><rect x="397" y="480" width="77" height="24" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><rect x="480" y="480" width="77" height="24" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><rect x="563" y="480" width="77" height="24" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><rect x="646" y="480" width="77" height="24" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><rect x="729" y="480" width="77" height="24" rx="0" fill="#eaf4fc" stroke="#afc4d6"/><rect x="812" y="480" width="77" height="24" rx="0" fill="#eef0f3" stroke="#afc4d6"/><path d="M65,522 L308,522" fill="none" stroke="#1475b8" stroke-width="1.8"/><text x="165" y="538" font-size="15" fill="#1475b8" text-anchor="start">0</text><path d="M231,542 L474,542" fill="none" stroke="#1475b8" stroke-width="1.8"/><text x="331" y="558" font-size="15" fill="#1475b8" text-anchor="start">1</text><path d="M397,562 L640,562" fill="none" stroke="#1475b8" stroke-width="1.8"/><text x="497" y="578" font-size="15" fill="#1475b8" text-anchor="start">2</text><path d="M563,582 L806,582" fill="none" stroke="#1475b8" stroke-width="1.8"/><text x="663" y="598" font-size="15" fill="#1475b8" text-anchor="start">3</text><text x="50" y="630" font-size="17" fill="#24374c" text-anchor="start">起点0、2、4、6：每次跨度3，均放在填充后的长度10内，共4个输出。</text></g></svg>
