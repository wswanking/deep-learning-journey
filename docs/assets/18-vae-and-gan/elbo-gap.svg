<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="c18-elbo-gap-title c18-elbo-gap-desc"><title id="c18-elbo-gap-title">图18-1：两个潜状态下ELBO与真实证据的精确间隙</title><desc id="c18-elbo-gap-desc">用离散潜变量手算证据零点五，ELBO负零点九一六，真实对数证据负零点六九三，两者间隙为到真实后验的KL零点二二三。强调到先验和到真实后验是不同KL。</desc><defs><marker id="c18-elbo-gap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="560" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">ELBO是下界：先用两个离散潜状态精确核对</text><text x="30" y="82" font-size="22" >p(z)=(0.5,0.5)，p(x|z)=(0.8,0.2)，q(z|x)=(0.5,0.5)。</text><line x1="201.3636363636364" y1="145" x2="201.3636363636364" y2="350" stroke="#d0dbe7" stroke-width="1.5" /><text x="201.3636363636364" y="382" font-size="22" text-anchor="middle">-1</text><line x1="483.18181818181824" y1="145" x2="483.18181818181824" y2="350" stroke="#d0dbe7" stroke-width="1.5" /><text x="483.18181818181824" y="382" font-size="22" text-anchor="middle">-0.5</text><line x1="765.0" y1="145" x2="765.0" y2="350" stroke="#d0dbe7" stroke-width="1.5" /><text x="765.0" y="382" font-size="22" text-anchor="middle">0</text><line x1="145" y1="200" x2="248.54522385274913" y2="200" stroke="#246cc0" stroke-width="5" /><circle cx="248.54522385274913" cy="200" r="7" fill="#246cc0"/><text x="263.54522385274913" y="207" font-size="24" >ELBO = −0.916291</text><line x1="145" y1="300" x2="374.31704368439455" y2="300" stroke="#bd611a" stroke-width="5" /><circle cx="374.31704368439455" cy="300" r="7" fill="#bd611a"/><text x="389.31704368439455" y="307" font-size="24" >ln p(x) = −0.693147</text><text x="30" y="432" font-size="24" >p(x)=0.5，真实后验=(0.8,0.2)。</text><text x="30" y="477" font-size="22" >间隙 KL(q || 真实后验)=0.223144，恰好补足两个对数值的差。</text><text x="30" y="522" font-size="21" >这个q与先验相同，所以“到先验的KL”为0，但后验近似仍不精确。</text></g></svg>
