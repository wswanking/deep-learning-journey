<svg xmlns="http://www.w3.org/2000/svg" width="900" height="585" viewBox="0 0 900 585" role="img" aria-labelledby="c18-vae-paths-title c18-vae-paths-desc"><title id="c18-vae-paths-title">图18-2：VAE概率模型与可微计算路径</title><desc id="c18-vae-paths-desc">区分从观测到近似后验再重参数化的训练路径，和从标准正态先验到解码条件分布采样的生成路径。解码器输出均值并另加观测噪声，不能把均值曲线当完整采样分布。</desc><defs><marker id="c18-vae-paths-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="585" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">VAE：生成模型与近似推断是不同方向</text><text x="30" y="82" font-size="22" >生成从先验z开始；训练用观测x构造近似后验q(z|x)。</text><rect x="30" y="140" width="190" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="125.0" y="178" font-size="24" text-anchor="middle" font-weight="700">观测 x</text><text x="125.0" y="217" font-size="21" text-anchor="middle">二维数据</text><rect x="315" y="140" width="245" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="437.5" y="178" font-size="24" text-anchor="middle" font-weight="700">编码器 qφ(z|x)</text><text x="437.5" y="217" font-size="21" text-anchor="middle">输出 μ、logσ²</text><rect x="650" y="140" width="220" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="760.0" y="178" font-size="24" text-anchor="middle" font-weight="700">重参数化</text><text x="760.0" y="217" font-size="21" text-anchor="middle">z=μ+σε</text><rect x="650" y="350" width="220" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="760.0" y="388" font-size="24" text-anchor="middle" font-weight="700">解码器 pθ(x|z)</text><text x="760.0" y="427" font-size="21" text-anchor="middle">均值 fθ(z)、固定噪声</text><rect x="315" y="350" width="245" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="437.5" y="388" font-size="24" text-anchor="middle" font-weight="700">新样本 x̃</text><text x="437.5" y="427" font-size="21" text-anchor="middle">均值 + 观测噪声</text><rect x="30" y="350" width="190" height="100" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="125.0" y="388" font-size="24" text-anchor="middle" font-weight="700">先验 p(z)</text><text x="125.0" y="427" font-size="21" text-anchor="middle">标准正态</text><line x1="220" y1="190" x2="310" y2="190" stroke="#246cc0" stroke-width="3" marker-end="url(#c18-vae-paths-arrow)"/><line x1="560" y1="190" x2="645" y2="190" stroke="#246cc0" stroke-width="3" marker-end="url(#c18-vae-paths-arrow)"/><line x1="760" y1="240" x2="760" y2="345" stroke="#246cc0" stroke-width="3" marker-end="url(#c18-vae-paths-arrow)"/><line x1="650" y1="400" x2="565" y2="400" stroke="#246cc0" stroke-width="3" marker-end="url(#c18-vae-paths-arrow)"/><path d="M 125.000 350.000 L 125.000 295.000 L 605.000 295.000 L 605.000 370.000 L 645.000 370.000" fill="none" stroke="#246cc0" stroke-width="3" marker-end="url(#c18-vae-paths-arrow)"/><text x="345" y="282" font-size="22" text-anchor="middle">生成时直接从先验采样z</text><text x="30" y="504" font-size="23" >训练：重建对数密度的期望 − KL(qφ(z|x) || p(z))。</text><text x="30" y="548" font-size="22" >ε与参数无关；固定一次ε后，μ、σ到z的路径可求导。</text></g></svg>
