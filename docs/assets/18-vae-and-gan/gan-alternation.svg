<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="c18-gan-alternation-title c18-gan-alternation-desc"><title id="c18-gan-alternation-title">图18-3：GAN判别器与生成器交替更新及梯度边界</title><desc id="c18-gan-alternation-desc">两步分别最小化判别二元交叉熵与生成器非饱和损失。判别器步骤分离假样本，生成器步骤冻结判别器参数但保留输入导数，不能对判别前向关闭求导。</desc><defs><marker id="c18-gan-alternation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="600" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">GAN交替训练：两步更新不同参数</text><text x="30" y="82" font-size="22" >D输出真实来源的概率；代码使用未sigmoid的logit与稳定BCE。</text><rect x="30" y="125" width="840" height="145" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="55" y="162" font-size="25" font-weight="700">① 更新D：真样本标1，假样本标0</text><text x="55" y="205" font-size="22" >G(z).detach()切断到G的求导，更新D参数</text><text x="55" y="246" font-size="23" >最小化 L_D=−E lnD(x)−E ln(1−D(G(z)))</text><rect x="30" y="320" width="840" height="145" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="55" y="357" font-size="25" font-weight="700">② 更新G：希望假样本被D判真</text><text x="55" y="400" font-size="22" >冻结D参数；梯度仍穿过D的输入路径回到G</text><text x="55" y="441" font-size="23" >最小化 L_G=−E lnD(G(z))（非饱和目标）</text><text x="30" y="517" font-size="22" >生成器步不对D前向使用no_grad；那会连通向G的导数一起切断。</text><text x="30" y="562" font-size="22" >本实验每轮1次D更新+1次G更新；两条损失不是同一固定函数。</text></g></svg>
