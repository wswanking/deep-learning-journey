<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="c09-optimizer-paths-title c09-optimizer-paths-desc"><title id="c09-optimizer-paths-title">图09-2：三种优化器在同一二次目标上的真实路径</title><desc id="c09-optimizer-paths-desc">二次函数两个方向曲率不同，SGD、带动量SGD与Adam从同一点开始，各用明确学习率运行三十步，显示真实二维参数路径。</desc><defs><marker id="c09-optimizer-paths-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="610" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">同一个二次目标，不同更新规则产生不同路径</text><text x="30" y="78" font-size="21" >J(θ)=0.5(θ₁²+10θ₂²)，初始(4,2)，各运行30步；细线为等高线。</text><line x1="141.42857142857142" y1="120" x2="141.42857142857142" y2="450" stroke="#d0dbe7" stroke-width="1.5" /><text x="141.42857142857142" y="480" font-size="21" text-anchor="middle">-2</text><line x1="347.14285714285717" y1="120" x2="347.14285714285717" y2="450" stroke="#d0dbe7" stroke-width="1.5" /><text x="347.14285714285717" y="480" font-size="21" text-anchor="middle">0</text><line x1="552.8571428571429" y1="120" x2="552.8571428571429" y2="450" stroke="#d0dbe7" stroke-width="1.5" /><text x="552.8571428571429" y="480" font-size="21" text-anchor="middle">2</text><line x1="758.5714285714286" y1="120" x2="758.5714285714286" y2="450" stroke="#d0dbe7" stroke-width="1.5" /><text x="758.5714285714286" y="480" font-size="21" text-anchor="middle">4</text><line x1="90" y1="417.0" x2="810" y2="417.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="78" y="424.0" font-size="21" text-anchor="end">-2</text><line x1="90" y1="285.0" x2="810" y2="285.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="78" y="292.0" font-size="21" text-anchor="end">0</text><line x1="90" y1="153.0" x2="810" y2="153.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="78" y="160.0" fon