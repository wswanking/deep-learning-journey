<svg xmlns="http://www.w3.org/2000/svg" width="900" height="505" viewBox="0 0 900 505" role="img" aria-labelledby="c09-training-loop-title c09-training-loop-desc"><title id="c09-training-loop-title">图09-1：一次训练迭代的职责与顺序</title><desc id="c09-training-loop-desc">先取批次并设置学习率，清除旧梯度，前向计算损失，反向计算梯度，按需裁剪，更新参数和优化器状态，再做评估记录并进入下一批。</desc><defs><marker id="c09-training-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="505" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">训练循环：每一步负责什么</text><text x="30" y="78" font-size="21" >反向传播计算梯度；优化器使用梯度和自身状态更新参数。</text><rect x="30" y="115" width="195" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="127.5" y="152" font-size="23" text-anchor="middle" font-weight="700">取mini-batch</text><text x="127.5" y="187" font-size="21" text-anchor="middle">设置本步 ηₖ</text><rect x="245" y="115" width="195" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="342.5" y="152" font-size="23" text-anchor="middle" font-weight="700">清除旧梯度</text><text x="342.5" y="187" font-size="21" text-anchor="middle">zero_grad</text><rect x="460" y="115" width="195" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="557.5" y="152" font-size="23" text-anchor="middle" font-weight="700">前向与损失</text><text x="557.5" y="187" font-size="21" text-anchor="middle">得到标量损失</text><rect x="675" y="115" width="195" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="772.5" y="152" font-size="23" text-anchor="middle" font-weight="700">反向求导</text><text x="772.5" y="187" font-size="21" text-anchor="middle">backward</text><rect x="30" y="290" width="195" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="127.5" y="327" font-size="23" text-anchor="middle" font-weight="700">下一批数据</text><text x="127.5" y="362" font-size="21" text-anchor="middle">更新计数 k</text><rect x="245" y="290" width="195" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="342.5" y="327" font-size="23" text-anchor="middle" font-weight="700">评估与记录</text><text x="342.5" y="362" font-size="21" text-anchor="middle">固定验证集</text><rect x="460" y="290" width="195" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="557.5" y="327" font-size="23" text-anchor="middle" font-weight="700">参数与状态更新</text><text x="557.5" y="362" font-size="21" text-anchor="middle">optimizer.step</text><rect x="675" y="290" width="195" height="92" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="772.5" y="327" font-size="23" text-anchor="middle" font-weight="700">可选梯度裁剪</text><text x="772.5" y="362" font-size="21" text-anchor="middle">限制梯度范数</text><line x1="225" y1="161" x2="242" y2="161" stroke="#246cc0" stroke-width="3" marker-end="url(#c09-training-loop-arrow)"/><line x1="440" y1="161" x2="457" y2="161" stroke="#246cc0" stroke-width="3" marker-end="url(#c09-training-loop-arrow)"/><line x1="655" y1="161" x2="672" y2="161" stroke="#246cc0" stroke-width="3" marker-end="url(#c09-training-loop-arrow)"/><line x1="772" y1="207" x2="772" y2="285" stroke="#246cc0" stroke-width="3" marker-end="url(#c09-training-loop-arrow)"/><line x1="675" y1="336" x2="658" y2="336" stroke="#246cc0" stroke-width="3" marker-end="url(#c09-training-loop-arrow)"/><line x1="460" y1="336" x2="443" y2="336" stroke="#246cc0" stroke-width="3" marker-end="url(#c09-training-loop-arrow)"/><line x1="245" y1="336" x2="228" y2="336" stroke="#246cc0" stroke-width="3" marker-end="url(#c09-training-loop-arrow)"/><path d="M 127 290 V 248 H 12 V 161 H 26" fill="none" stroke="#246cc0" stroke-width="3" marker-end="url(#c09-training-loop-arrow)"/><text x="30" y="432" font-size="22" >梯度清零在本次 backward 前；裁剪在 backward 后、step 前。</text><text x="30" y="474" font-size="21" >验证只前向：eval + no_grad；恢复训练时还要恢复优化器与采样状态。</text></g></svg>
