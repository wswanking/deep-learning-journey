<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">分叉计算图与链式法则</title><desc id="desc">x1到输出有直接和经乘法节点两条路径，路径内导数相乘、各路径贡献相加，得到梯度18,6。</desc><rect width="1120" height="650" fill="#ffffff"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="40" y="48" font-size="30" fill="#16324f" text-anchor="start">图02-3  复合函数的依赖路径：y = (x₁x₂ + x₁)²</text><rect x="50" y="155" width="160" height="80" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="130" y="205" font-size="27" fill="#16324f" text-anchor="middle">x₁ = 1</text><rect x="50" y="370" width="160" height="80" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="130" y="420" font-size="27" fill="#16324f" text-anchor="middle">x₂ = 2</text><rect x="365" y="260" width="180" height="90" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="455" y="295" font-size="25" fill="#16324f" text-anchor="middle">a = x₁x₂</text><text x="455" y="332" font-size="24" fill="#16324f" text-anchor="middle">a = 2</text><rect x="655" y="260" width="175" height="90" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="742" y="295" font-size="24" fill="#16324f" text-anchor="middle">z = a + x₁</text><text x="742" y="332" font-size="24" fill="#16324f" text-anchor="middle">z = 3</text><rect x="930" y="260" width="140" height="90" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="1000" y="295" font-size="25" fill="#16324f" text-anchor="middle">y = z²</text><text x="1000" y="332" font-size="24" fill="#16324f" text-anchor="middle">y = 9</text><line x1="210" y1="205" x2="365" y2="278" stroke="#235bc7" stroke-width="3"/><path d="M 353.0417547090248 279.0001847633664 L 365 278 L 358.15469194095897 268.14394817501307" fill="none" stroke="#235bc7" stroke-width="3"/><text x="235" y="220" font-size="22" fill="#235bc7" text-anchor="start">× x₂ = 2</text><line x1="210" y1="410" x2="365" y2="335" stroke="#526b80" stroke-width="3"/><path d="M 358.2586362184967 344.9274374521039 L 365 335 L 353.0319050812453 334.12552643511776" fill="none" stroke="#526b80" stroke-width="3"/><text x="235" y="407" font-size="22" fill="#526b80" text-anchor="start">× x₁ = 1</text><line x1="130" y1="155" x2="130" y2="110" stroke="#007d75" stroke-width="3"/><line x1="130" y1="110" x2="742" y2="110" stroke="#007d75" stroke-width="3"/><line x1="742" y1="110" x2="742" y2="260" stroke="#007d75" stroke-width="3"/><path d="M 736 249.60769515458674 L 742 260 L 748 249.60769515458674" fill="none" stroke="#007d75" stroke-width="3"/><text x="395" y="98" font-size="23" fill="#007d75" text-anchor="start">直接路径：∂z/∂x₁ = 1</text><line x1="545" y1="305" x2="655" y2="305" stroke="#235bc7" stroke-width="3"/><path d="M 644.6076951545867 311 L 655 305 L 644.6076951545867 299" fill="none" stroke="#235bc7" stroke-width="3"/><text x="600" y="286" font-size="22" fill="#235bc7" text-anchor="middle">× 1</text><line x1="830" y1="305" x2="930" y2="305" stroke="#16324f" stroke-width="3"/><path d="M 919.6076951545867 311 L 930 305 L 919.6076951545867 299" fill="none" stroke="#16324f" stroke-width="3"/><text x="880" y="245" font-size="22" fill="#16324f" text-anchor="middle">× 2z = 6</text><rect x="80" y="490" width="940" height="120" rx="14" fill="#f5f9fc" stroke="#c7d6e1" stroke-width="2"/><text x="105" y="530" font-size="25" fill="#16324f" text-anchor="start">x₁的总影响：间接路径 6×1×2 + 直接路径 6×1 = 18</text><text x="105" y="576" font-size="25" fill="#16324f" text-anchor="start">x₂的总影响：只有间接路径 6×1×1 = 6</text></g></svg>
