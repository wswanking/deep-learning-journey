<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">非方形Jacobian与维度</title><desc id="desc">二输入三输出函数的Jacobian为3行2列，将2维输入变化映射成3维输出变化；标量输出梯度用转置映射回输入。</desc><rect width="1100" height="590" fill="#ffffff"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="40" y="48" font-size="30" fill="#16324f" text-anchor="start">图02-4  Jacobian的行是输出，列是输入</text><text x="550" y="100" font-size="27" fill="#16324f" text-anchor="middle">在 x = (2, 3)ᵀ 处：Δz ≈ J Δx</text><rect x="50" y="190" width="190" height="160" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="145" y="235" font-size="24" fill="#16324f" text-anchor="middle">输入微小变化</text><text x="145" y="284" font-size="27" fill="#16324f" text-anchor="middle">Δx₁</text><text x="145" y="323" font-size="27" fill="#16324f" text-anchor="middle">Δx₂</text><line x1="245" y1="270" x2="335" y2="270" stroke="#235bc7" stroke-width="4"/><path d="M 324.60769515458674 276 L 335 270 L 324.60769515458674 264" fill="none" stroke="#235bc7" stroke-width="4"/><text x="510" y="160" font-size="23" fill="#235bc7" text-anchor="middle">输入x₁</text><text x="650" y="160" font-size="23" fill="#235bc7" text-anchor="middle">输入x₂</text><text x="405" y="220" font-size="22" fill="#526b80" text-anchor="end">输出z₁</text><rect x="445" y="177" width="125" height="65" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="507" y="220" font-size="28" fill="#16324f" text-anchor="middle">4</text><rect x="585" y="177" width="125" height="65" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="647" y="220" font-size="28" fill="#16324f" text-anchor="middle">1</text><text x="405" y="295" font-size="22" fill="#526b80" text-anchor="end">输出z₂</text><rect x="445" y="252" width="125" height="65" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="507" y="295" font-size="28" fill="#16324f" text-anchor="middle">3</text><rect x="585" y="252" width="125" height="65" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="647" y="295" font-size="28" fill="#16324f" text-anchor="middle">2</text><text x="405" y="370" font-size="22" fill="#526b80" text-anchor="end">输出z₃</text><rect x="445" y="327" width="125" height="65" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="507" y="370" font-size="28" fill="#16324f" text-anchor="middle">2</text><rect x="585" y="327" width="125" height="65" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="647" y="370" font-size="28" fill="#16324f" text-anchor="middle">-1</text><line x1="735" y1="270" x2="815" y2="270" stroke="#235bc7" stroke-width="4"/><path d="M 804.6076951545867 276 L 815 270 L 804.6076951545867 264" fill="none" stroke="#235bc7" stroke-width="4"/><rect x="825" y="170" width="235" height="220" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="942" y="216" font-size="24" fill="#16324f" text-anchor="middle">输出微小变化</text><text x="942" y="264" font-size="27" fill="#16324f" text-anchor="middle">Δz₁</text><text x="942" y="306" font-size="27" fill="#16324f" text-anchor="middle">Δz₂</text><text x="942" y="348" font-size="27" fill="#16324f" text-anchor="middle">Δz₃</text><text x="145" y="405" font-size="25" fill="#16324f" text-anchor="middle">2×1</text><text x="580" y="450" font-size="27" fill="#235bc7" text-anchor="middle">J：3×2</text><text x="942" y="435" font-size="25" fill="#16324f" text-anchor="middle">3×1</text><text x="60" y="505" font-size="24" fill="#16324f" text-anchor="start">映射：z₁=x₁²+x₂；z₂=x₁x₂；z₃=2x₁−x₂。</text><text x="60" y="550" font-size="24" fill="#16324f" text-anchor="start">若最终量是标量L，输入梯度由 Jᵀ∇zL 得到，形状回到2×1。</text></g></svg>
