<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">等高线与梯度</title><desc id="desc">函数x1平方加2倍x2平方的等高线为椭圆，在点1,1的梯度为列向量2,4，与f等于3的等高线切线垂直。</desc><rect width="1100" height="600" fill="#ffffff"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="40" y="48" font-size="28" fill="#16324f" text-anchor="start">图02-2  等高线、偏导与梯度：f(x₁, x₂) = x₁² + 2x₂²</text><ellipse cx="395" cy="365" rx="90" ry="63.63961030678928" fill="none" stroke="#c7d6e1" stroke-width="2"/><text x="301" y="355" font-size="20" fill="#526b80" text-anchor="end">f=1</text><ellipse cx="395" cy="365" rx="155.88457268119896" ry="110.22703842524301" fill="none" stroke="#235bc7" stroke-width="3"/><text x="235.11542731880104" y="355" font-size="20" fill="#526b80" text-anchor="end">f=3</text><ellipse cx="395" cy="365" rx="220.45407685048602" ry="155.88457268119896" fill="none" stroke="#c7d6e1" stroke-width="2"/><text x="170.54592314951398" y="355" font-size="20" fill="#526b80" text-anchor="end">f=6</text><ellipse cx="395" cy="365" rx="270" ry="190.9188309203678" fill="none" stroke="#c7d6e1" stroke-width="2"/><text x="121" y="355" font-size="20" fill="#526b80" text-anchor="end">f=9</text><line x1="85" y1="365" x2="715" y2="365" stroke="#16324f" stroke-width="3"/><path d="M 704.6076951545867 371 L 715 365 L 704.6076951545867 359" fill="none" stroke="#16324f" stroke-width="3"/><line x1="395" y1="575" x2="395" y2="100" stroke="#16324f" stroke-width="3"/><path d="M 401 110.39230484541326 L 395 100 L 389 110.39230484541326" fill="none" stroke="#16324f" stroke-width="3"/><text x="680" y="399" font-size="24" fill="#16324f" text-anchor="start">x₁</text><text x="409" y="112" font-size="24" fill="#16324f" text-anchor="start">x₂</text><line x1="215" y1="360" x2="215" y2="370" stroke="#16324f" stroke-width="2"/><text x="215" y="399" font-size="20" fill="#526b80" text-anchor="middle">-2</text><line x1="305" y1="360" x2="305" y2="370" stroke="#16324f" stroke-width="2"/><text x="305" y="399" font-size="20" fill="#526b80" text-anchor="middle">-1</text><line x1="485" y1="360" x2="485" y2="370" stroke="#16324f" stroke-width="2"/><text x="485" y="399" font-size="20" fill="#526b80" text-anchor="middle">1</text><line x1="575" y1="360" x2="575" y2="370" stroke="#16324f" stroke-width="2"/><text x="575" y="399" font-size="20" fill="#526b80" text-anchor="middle">2</text><line x1="665" y1="360" x2="665" y2="370" stroke="#16324f" stroke-width="2"/><text x="665" y="399" font-size="20" fill="#526b80" text-anchor="middle">3</text><line x1="390" y1="545" x2="400" y2="545" stroke="#16324f" stroke-width="2"/><text x="380" y="552" font-size="20" fill="#526b80" text-anchor="end">-2</text><line x1="390" y1="455" x2="400" y2="455" stroke="#16324f" stroke-width="2"/><text x="380" y="462" font-size="20" fill="#526b80" text-anchor="end">-1</text><line x1="390" y1="275" x2="400" y2="275" stroke="#16324f" stroke-width="2"/><text x="380" y="282" font-size="20" fill="#526b80" text-anchor="end">1</text><line x1="390" y1="185" x2="400" y2="185" stroke="#16324f" stroke-width="2"/><text x="380" y="192" font-size="20" fill="#526b80" text-anchor="end">2</text><line x1="399.5" y1="232.25" x2="570.5" y2="317.75" stroke="#b45b11" stroke-width="3" stroke-dasharray="7 6"/><line x1="485" y1="275" x2="557" y2="131" stroke="#007d75" stroke-width="5"/><path d="M 557.7189831305506 142.97844160389755 L 557 131 L 546.9858568385516 137.61187845789806" fill="none" stroke="#007d75" stroke-width="5"/><line x1="485" y1="275" x2="584" y2="275" stroke="#235bc7" stroke-width="3"/><path d="M 573.6076951545867 281 L 584 275 L 573.6076951545867 269" fill="none" stroke="#235bc7" stroke-width="3"/><circle cx="485" cy="275" r="7" fill="#16324f"/><text x="470" y="345" font-size="23" fill="#16324f" text-anchor="start">P=(1,1)</text><text x="566" y="140" font-size="27" fill="#007d75" text-anchor="start">∇f</text><text x="557" y="311" font-size="22" fill="#235bc7" text-anchor="start">只改x₁</text><text x="100" y="560" font-size="20" fill="#526b80" text-anchor="start">坐标轴同尺度；绿色梯度箭头按0.4倍长度绘制。</text><rect x="760" y="115" width="300" height="400" rx="14" fill="#eef5fa" stroke="#c7d6e1" stroke-width="2"/><text x="780" y="160" font-size="25" fill="#16324f" text-anchor="start">在 P 点：</text><text x="780" y="208" font-size="25" fill="#235bc7" text-anchor="start">∂f/∂x₁ = 2</text><text x="780" y="252" font-size="25" fill="#16324f" text-anchor="start">∂f/∂x₂ = 4</text><text x="780" y="304" font-size="23" fill="#007d75" text-anchor="start">梯度 ∇f = (2, 4)ᵀ</text><text x="780" y="350" font-size="21" fill="#b45b11" text-anchor="start">橙虚线：等高线切线</text><text x="780" y="395" font-size="24" fill="#16324f" text-anchor="start">梯度与切线垂直</text><text x="780" y="451" font-size="21" fill="#16324f" text-anchor="start">方向导数还取决于方向</text></g></svg>
