<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-labelledby="c24-training-curves-title c24-training-curves-desc"><title id="c24-training-curves-title">图24-5：真实DPO与翻转标签控制组训练损失</title><desc id="c24-training-curves-desc">从本机结果JSON绘制三个配置每25步实际优化目标，翻转标签组同样快速降低其错误目标，不能用损失下降代替正确性评估。</desc><defs><marker id="c24-training-curves-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="675" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="25" font-weight="700">三组真实训练曲线：翻转标签也可以把自己的损失降很低</text><text x="30" y="82" font-size="21" >纵轴为各组实际优化标签下的平均DPO损失；横轴为更新步。</text><line x1="85" y1="415.0" x2="825" y2="415.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="422.0" font-size="21" text-anchor="end">0</text><line x1="85" y1="347.5" x2="825" y2="347.5" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="354.5" font-size="21" text-anchor="end">0.25</text><line x1="85" y1="280.0" x2="825" y2="280.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="287.0" font-size="21" text-anchor="end">0.5</text><line x1="85" y1="212.5" x2="825" y2="212.5" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="219.5" font-size="21" text-anchor="end">0.75</text><line x1="85" y1="145.0" x2="825" y2="145.0" stroke="#d0dbe7" stroke-width="1.5" /><text x="75" y="152.0" font-size="21" text-anchor="end">1</text><line x1="85.0" y1="145" x2="85.0" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="85.0" y="445" font-size="21" text-anchor="middle">0</text><line x1="331.66666666666663" y1="145" x2="331.66666666666663" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="331.66666666666663" y="445" font-size="21" text-anchor="middle">100</text><line x1="578.3333333333333" y1="145" x2="578.3333333333333" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="578.3333333333333" y="445" font-size="21" text-anchor="middle">200</text><line x1="825.0" y1="145" x2="825.0" y2="415" stroke="#d0dbe7" stroke-width="1.5" /><text x="825.0" y="445" font-size="21" text-anchor="middle">300</text><path d="M 85.000 227.850 L 146.667 203.813 L 208.333 178.876 L 270.000 253.635 L 331.667 267.662 L 393.333 316.615 L 455.000 396.469 L 516.667 414.334 L 578.333 414.876 L 640.000 414.940 L 701.667 414.960 L 763.333 414.969 L 825.000 414.975" fill="none" stroke="#246cc0" stroke-width="3"/><path d="M 85.000 227.850 L 146.667 225.697 L 208.333 235.012 L 270.000 265.167 L 331.667 284.118 L 393.333 311.366 L 455.000 341.737 L 516.667 364.943 L 578.333 375.014 L 640.000 361.832 L 701.667 392.017 L 763.333 395.338 L 825.000 400.126" fill="none" stroke="#39805b" stroke-width="3"/><path d="M 85.000 227.850 L 146.667 178.736 L 208.333 189.840 L 270.000 225.826 L 331.667 272.669 L 393.333 341.307 L 455.000 383.337 L 516.667 404.573 L 578.333 413.931 L 640.000 414.798 L 701.667 414.940 L 763.333 414.935 L 825.000 414.973" fill="none" stroke="#bd611a" stroke-width="3"/><line x1="35" y1="483" x2="85" y2="483" stroke="#246cc0" stroke-width="4" /><text x="100" y="490" font-size="22" >β=1，真实合成标签</text><line x1="35" y1="528" x2="85" y2="528" stroke="#39805b" stroke-width="4" /><text x="100" y="535" font-size="22" >β=0.1，真实合成标签</text><line x1="35" y1="573" x2="85" y2="573" stroke="#bd611a" stroke-width="4" /><text x="100" y="580" font-size="22" >β=1，故意翻转训练标签</text><text x="30" y="633" font-size="21" >低训练损失说明拟合了给定标签；标签标准错误时，优化不会自动修正它。</text></g></svg>
