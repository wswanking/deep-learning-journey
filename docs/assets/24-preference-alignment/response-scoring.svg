<svg xmlns="http://www.w3.org/2000/svg" width="900" height="595" viewBox="0 0 900 595" role="img" aria-labelledby="c24-response-scoring-title c24-response-scoring-desc"><title id="c24-response-scoring-title">图24-4：偏好回答对数概率的移位与计分范围</title><desc id="c24-response-scoring-desc">原创提示与两候选流程，每个回答为一个字母加换行，两目标字节概率求和，不计提示和补齐，参考与策略必须一致。</desc><defs><marker id="c24-response-scoring-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="595" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="26" font-weight="700">两个候选各自做teacher forcing，只有回答字节计分</text><text x="30" y="82" font-size="22" >示例提示“首字母 gh”；yw=g+换行，yl=h+换行；候选长度相同。</text><rect x="30" y="130" width="440" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="250.0" y="164" font-size="24" text-anchor="middle" font-weight="700">[指令] 首字母 gh [回答]</text><text x="250.0" y="198" font-size="21" text-anchor="middle">提示位置logits不计入回答分数</text><rect x="550" y="130" width="320" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="710.0" y="164" font-size="24" text-anchor="middle" font-weight="700">chosen: g + LF</text><text x="710.0" y="198" font-size="21" text-anchor="middle">恰好2个目标字节</text><line x1="470" y1="175" x2="545" y2="175" stroke="#246cc0" stroke-width="3" marker-end="url(#c24-response-scoring-arrow)"/><rect x="30" y="265" width="440" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="250.0" y="299" font-size="24" text-anchor="middle" font-weight="700">[指令] 首字母 gh [回答]</text><text x="250.0" y="333" font-size="21" text-anchor="middle">提示位置logits不计入回答分数</text><rect x="550" y="265" width="320" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="710.0" y="299" font-size="24" text-anchor="middle" font-weight="700">rejected: h + LF</text><text x="710.0" y="333" font-size="21" text-anchor="middle">恰好2个目标字节</text><line x1="470" y1="310" x2="545" y2="310" stroke="#bd611a" stroke-width="3" marker-end="url(#c24-response-scoring-arrow)"/><text x="30" y="455" font-size="22" >lnπ(y|x)=lnπ(首个回答字节|完整提示)+lnπ(LF|提示和回答字节)。</text><text x="30" y="505" font-size="22" >先按词表做log_softmax → gather目标 → mask → 沿回答位置求和。</text><text x="30" y="555" font-size="22" >参考与策略使用相同模板、分词、目标位置；本章不按回答长度求平均。</text></g></svg>
