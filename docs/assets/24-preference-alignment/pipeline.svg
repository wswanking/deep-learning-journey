<svg xmlns="http://www.w3.org/2000/svg" width="900" height="735" viewBox="0 0 900 735" role="img" aria-labelledby="c24-pipeline-title c24-pipeline-desc"><title id="c24-pipeline-title">图24-1：SFT、显式奖励RLHF与离线DPO的关系</title><desc id="c24-pipeline-desc">原创流程图，区分示范监督、偏好比较、先拟合奖励再用强化学习与直接偏好优化。本章只执行离线DPO，标签为确定字符串规则，不能称人类反馈实验。</desc><defs><marker id="c24-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="735" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="28" font-weight="700">偏好数据相同，优化路线可以不同</text><text x="30" y="82" font-size="22" >SFT给示范答案；偏好对给同一提示下两个回答的相对选择。</text><rect x="30" y="130" width="250" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="155.0" y="164" font-size="24" text-anchor="middle" font-weight="700">SFT策略 πref</text><text x="155.0" y="198" font-size="21" text-anchor="middle">复制为固定参考</text><rect x="360" y="130" width="510" height="90" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="615.0" y="164" font-size="24" text-anchor="middle" font-weight="700">比较数据 (x, yw, yl)</text><text x="615.0" y="198" font-size="21" text-anchor="middle">记录标签来源、标准与分组划分</text><line x1="280" y1="175" x2="355" y2="175" stroke="#246cc0" stroke-width="3" marker-end="url(#c24-pipeline-arrow)"/><rect x="30" y="295" width="840" height="115" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450.0" y="329" font-size="24" text-anchor="middle" font-weight="700">显式奖励 + RLHF 路线</text><text x="450.0" y="363" font-size="21" text-anchor="middle">拟合奖励差 → 用RL更新策略；期望奖励减βKL</text><rect x="30" y="475" width="840" height="115" fill="#fff" rx="12" stroke="#8a9eb4" stroke-width="2"/><text x="450.0" y="509" font-size="24" text-anchor="middle" font-weight="700">本章实际执行：离线DPO</text><text x="450.0" y="543" font-size="21" text-anchor="middle">固定参考；直接用两个回答的对数概率比训练策略</text><text x="30" y="650" font-size="21" >本章标签来自首/末字母确定规则；没有人类标注、PPO或独立奖励网络。</text><text x="30" y="697" font-size="22" >优化标签偏好不会自动保证事实正确、格式正确或所有人的价值一致。</text></g></svg>
