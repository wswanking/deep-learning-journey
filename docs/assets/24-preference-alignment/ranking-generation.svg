<svg xmlns="http://www.w3.org/2000/svg" width="900" height="695" viewBox="0 0 900 695" role="img" aria-labelledby="c24-ranking-generation-title c24-ranking-generation-desc"><title id="c24-ranking-generation-title">图24-6：真实候选排序、相对间隔与自由生成的分离</title><desc id="c24-ranking-generation-desc">四个固定模型对同一十二测试提示，记录原始候选排序、扣除参考后的相对排序、实际贪心完整生成。beta一相对排序改善但生成零，beta零点一仅两例生成正确。</desc><defs><marker id="c24-ranking-generation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="695" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="25" font-weight="700">同一测试集：候选排序提升，不等于能自由生成正确答案</text><text x="30" y="82" font-size="21" >12个未见组合提示；左列比较两个指定候选，右列实际贪心生成。</text><text x="35" y="145" font-size="22" font-weight="700">配置</text><text x="305" y="145" font-size="22" font-weight="700">候选排序正确</text><text x="500" y="145" font-size="22" font-weight="700">相对变化正确</text><text x="690" y="145" font-size="22" font-weight="700">生成完全正确</text><rect x="25" y="175" width="850" height="58" fill="#fff" rx="8"/><text x="35" y="210" font-size="23" >SFT参考</text><text x="335" y="210" font-size="23" >50.0%</text><text x="530" y="210" font-size="23" >50.0%</text><text x="730" y="210" font-size="23" >0.0%</text><rect x="25" y="247" width="850" height="58" fill="#fff" rx="8"/><text x="35" y="282" font-size="23" >DPO β=1</text><text x="335" y="282" font-size="23" >58.3%</text><text x="530" y="282" font-size="23" >83.3%</text><text x="730" y="282" font-size="23" >0.0%</text><rect x="25" y="319" width="850" height="58" fill="#fff" rx="8"/><text x="35" y="354" font-size="23" >DPO β=0.1</text><text x="335" y="354" font-size="23" >66.7%</text><text x="530" y="354" font-size="23" >83.3%</text><text x="730" y="354" font-size="23" >16.7%</text><rect x="25" y="391" width="850" height="58" fill="#fff" rx="8"/><text x="35" y="426" font-size="23" >翻转训练标签</text><text x="335" y="426" font-size="23" >25.0%</text><text x="530" y="426" font-size="23" >25.0%</text><text x="730" y="426" font-size="23" >0.0%</text><text x="30" y="565" font-size="23" >β=1训练相对排序100%，测试83.3%；测试自由生成仍0%。</text><text x="30" y="610" font-size="22" >β=0.1只答对2/12，格式正确3/12；候选集合外仍有大量概率质量。</text><text x="30" y="655" font-size="23" >不是人类偏好胜率；也不是完整策略KL或通用能力评估。</text></g></svg>
