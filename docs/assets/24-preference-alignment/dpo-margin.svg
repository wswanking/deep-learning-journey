<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="c24-dpo-margin-title c24-dpo-margin-desc"><title id="c24-dpo-margin-title">图24-3：DPO对数概率比、间隔、概率与梯度手算</title><desc id="c24-dpo-margin-desc">原创三回答合法概率例子，两个候选概率零点六与零点三，参考均零点四，beta零点五，margin零点三四六，损失零点五三五。展示独立对数概率偏导与参数耦合边界。</desc><defs><marker id="c24-dpo-margin-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="610" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="26" font-weight="700">DPO比较“相对参考的变化”，不是直接比较两个概率</text><text x="30" y="82" font-size="21" >πθ(yw)=0.6、πθ(yl)=0.3；πref两者均0.4；剩余质量属于其他回答。</text><rect x="30" y="130" width="840" height="80" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="50" y="163" font-size="23" font-weight="700">偏好回答的概率比</text><text x="490" y="180" font-size="25" >0.6 / 0.4 = 1.5</text><rect x="30" y="230" width="840" height="80" fill="#fff" rx="10" stroke="#b6c6d8"/><text x="50" y="263" font-size="23" font-weight="700">非偏好回答的概率比</text><text x="490" y="280" font-size="25" >0.3 / 0.4 = 0.75</text><text x="30" y="378" font-size="24" >β=0.5：m=β[ln1.5−ln0.75]=0.5ln2=0.346574。</text><text x="30" y="426" font-size="23" >偏好概率 σ(m)=0.585786；损失−lnσ(m)=0.534800。</text><text x="30" y="474" font-size="22" >对logπθ(yw)的导数为−0.207107；对logπθ(yl)为+0.207107。</text><text x="30" y="522" font-size="23" >策略与参考完全相同时：两个比值均1，m=0，损失=ln2。</text><text x="30" y="570" font-size="21" >参数共享且还有其他回答：相对排序改善，不保证每条偏好回答绝对概率都上升。</text></g></svg>
