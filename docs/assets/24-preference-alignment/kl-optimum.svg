<svg xmlns="http://www.w3.org/2000/svg" width="900" height="685" viewBox="0 0 900 685" role="img" aria-labelledby="c24-kl-optimum-title c24-kl-optimum-desc"><title id="c24-kl-optimum-title">图24-2：KL正则奖励目标的有限回答空间手算</title><desc id="c24-kl-optimum-desc">原创两个回答概率柱图，参考各零点五，奖励一与零，beta一时最优概率零点七三一与零点二六九，KL零点一一一。强调归一化和支持条件。</desc><defs><marker id="c24-kl-optimum-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246cc0"/></marker></defs><rect x="0" y="0" width="900" height="685" fill="#f7f9fc" rx="16"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172c44"><text x="30" y="42" font-size="27" font-weight="700">KL正则化的理想解：参考概率按奖励重新加权</text><text x="30" y="82" font-size="21" >先用只有两个回答的完整有限空间，β=1，r=(1,0)，πref=(0.5,0.5)。</text><text x="80" y="135" font-size="25" font-weight="700">固定参考</text><rect x="80" y="265.0" width="95" height="130.0" fill="#246cc0" rx="5"/><text x="127" y="430" font-size="22" text-anchor="middle">回答1</text><text x="127" y="250.0" font-size="23" text-anchor="middle">0.5000</text><rect x="220" y="265.0" width="95" height="130.0" fill="#bd611a" rx="5"/><text x="267" y="430" font-size="22" text-anchor="middle">回答2</text><text x="267" y="250.0" font-size="23" text-anchor="middle">0.5000</text><line x1="70" y1="395" x2="350" y2="395" stroke="#172c44" stroke-width="2" /><text x="515" y="135" font-size="25" font-weight="700">理想最优策略</text><rect x="515" y="204.92476955619873" width="95" height="190.07523044380127" fill="#246cc0" rx="5"/><text x="562" y="430" font-size="22" text-anchor="middle">回答1</text><text x="562" y="189.92476955619873" font-size="23" text-anchor="middle">0.7311</text><rect x="655" y="325.0752304438013" width="95" height="69.92476955619874" fill="#bd611a" rx="5"/><text x="702" y="430" font-size="22" text-anchor="middle">回答2</text><text x="702" y="310.0752304438013" font-size="23" text-anchor="middle">0.2689</text><line x1="505" y1="395" x2="785" y2="395" stroke="#172c44" stroke-width="2" /><text x="30" y="498" font-size="24" >π*(y) = πref(y) exp(r(y)/β) / Z；Z使总概率恰好为1。</text><text x="30" y="547" font-size="22" >奖励更高的回答被增权；参考为0的回答不能靠这个比值获得支持。</text><text x="30" y="596" font-size="23" >实测手算：KL=0.110944，E[r]−KL=0.620115。</text><text x="30" y="645" font-size="21" >本图是完整二回答玩具空间；实际LM实验没有精确计算完整回答空间KL。</text></g></svg>
