<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img"><title>KV缓存数据流</title><desc>当前q读取历史和新追加的键值，逐层保留缓存；新位置必须接续历史位置。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="35" y="45" font-size="28" fill="#163451" text-anchor="start">图25-2 单层单头KV缓存：旧K/V保留，新查询读取全部可见历史</text><rect x="40" y="115" width="220" height="80" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="150.0" y="163.0" font-size="24" fill="#2459bf" text-anchor="middle">新输入 → 新隐藏</text><path d="M260,155L330,155" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M320,148L330,155L320,162" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="330" y="115" width="210" height="80" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="435.0" y="163.0" font-size="24" fill="#2459bf" text-anchor="middle">新q、新k、新v</text><rect x="330" y="300" width="210" height="80" rx="12" fill="#f5f9ff" stroke="#008b86" stroke-width="2"/><text x="435.0" y="348.0" font-size="24" fill="#008b86" text-anchor="middle">历史K/V缓存</text><path d="M540,340L610,340" fill="none" stroke="#008b86" stroke-width="3" stroke-dasharray=""/><path d="M600,333L610,340L600,347" fill="none" stroke="#008b86" stroke-width="3"/><rect x="610" y="300" width="280" height="80" rx="12" fill="#f5f9ff" stroke="#008b86" stroke-width="2"/><text x="750.0" y="348.0" font-size="24" fill="#008b86" text-anchor="middle">追加新k/v：长度 S+1</text><path d="M435,195L435,235" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M435,235L750,235" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M750,235L750,300" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><rect x="610" y="115" width="280" height="80" rx="12" fill="#f5f9ff" stroke="#cf6b12" stroke-width="2"/><text x="750.0" y="163.0" font-size="24" fill="#cf6b12" text-anchor="middle">q读全部K/V → 当前输出</text><path d="M540,155L610,155" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M600,148L610,155L600,162" fill="none" stroke="#2459bf" stroke-width="3"/><text x="565" y="140" font-size="21" fill="#163451" text-anchor="start">q</text><path d="M890,155L960,155" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M960,155L960,340" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M890,340L960,340" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M900,148L890,155L900,162" fill="none" stroke="#cf6b12" stroke-width="3"/><text x="970" y="255" font-size="20" fill="#163451" text-anchor="start">K/V</text><text x="460" y="228" font-size="21" fill="#163451" text-anchor="start">k/v</text><text x="40" y="455" font-size="24" fill="#163451" text-anchor="start">每层分别缓存；仅旧K/V可复用，当前q和当前输出仍须计算。</text><text x="40" y="505" font-size="24" fill="#163451" text-anchor="start">位置从S继续；新分块中第r行只看键位置 ≤ S+r。</text><text x="40" y="555" font-size="22" fill="#163451" text-anchor="start">因果性保证旧隐藏不受未来影响；更换前缀、权重或位置方案后不能直接沿用。</text></g></svg>
