<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="600" viewBox="0 0 1130 600" role="img"><title>量化和反量化手算</title><desc>五个权重逐项映射int8和重建值，区分存储压缩与计算内核加速。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="35" y="45" font-size="28" fill="#163451" text-anchor="start">图25-4 逐行对称int8量化：保存整数与比例尺，近似重建权重</text><text x="40" y="110" font-size="24" fill="#163451" text-anchor="start">原权重</text><text x="340" y="110" font-size="24" fill="#163451" text-anchor="start">q = round(w/s)</text><text x="730" y="110" font-size="24" fill="#163451" text-anchor="start">重建 ŵ = s q</text><text x="80" y="155" font-size="24" fill="#163451" text-anchor="start">-1</text><text x="410" y="155" font-size="24" fill="#163451" text-anchor="start">-127</text><text x="780" y="155" font-size="24" fill="#163451" text-anchor="start">-1.000000</text><path d="M160,146L310,146" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M300,139L310,146L300,153" fill="none" stroke="#2459bf" stroke-width="3"/><path d="M490,146L690,146" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M680,139L690,146L680,153" fill="none" stroke="#2459bf" stroke-width="3"/><text x="80" y="218" font-size="24" fill="#163451" text-anchor="start">-0.2</text><text x="410" y="218" font-size="24" fill="#163451" text-anchor="start">-25</text><text x="780" y="218" font-size="24" fill="#163451" text-anchor="start">-0.196850</text><path d="M160,209L310,209" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M300,202L310,209L300,216" fill="none" stroke="#2459bf" stroke-width="3"/><path d="M490,209L690,209" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M680,202L690,209L680,216" fill="none" stroke="#2459bf" stroke-width="3"/><text x="80" y="281" font-size="24" fill="#163451" text-anchor="start">0</text><text x="410" y="281" font-size="24" fill="#163451" text-anchor="start">0</text><text x="780" y="281" font-size="24" fill="#163451" text-anchor="start">0.000000</text><path d="M160,272L310,272" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M300,265L310,272L300,279" fill="none" stroke="#2459bf" stroke-width="3"/><path d="M490,272L690,272" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M680,265L690,272L680,279" fill="none" stroke="#2459bf" stroke-width="3"/><text x="80" y="344" font-size="24" fill="#163451" text-anchor="start">0.7</text><text x="410" y="344" font-size="24" fill="#163451" text-anchor="start">89</text><text x="780" y="344" font-size="24" fill="#163451" text-anchor="start">0.700787</text><path d="M160,335L310,335" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M300,328L310,335L300,342" fill="none" stroke="#2459bf" stroke-width="3"/><path d="M490,335L690,335" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M680,328L690,335L680,342" fill="none" stroke="#2459bf" stroke-width="3"/><text x="80" y="407" font-size="24" fill="#163451" text-anchor="start">1</text><text x="410" y="407" font-size="24" fill="#163451" text-anchor="start">127</text><text x="780" y="407" font-size="24" fill="#163451" text-anchor="start">1.000000</text><path d="M160,398L310,398" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M300,391L310,398L300,405" fill="none" stroke="#2459bf" stroke-width="3"/><path d="M490,398L690,398" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M680,391L690,398L680,405" fill="none" stroke="#2459bf" stroke-width="3"/><text x="40" y="505" font-size="23" fill="#163451" text-anchor="start">s = max|w|/127 = 1/127；比例尺也占空间；浮点重建仍有舍入误差。</text><text x="40" y="555" font-size="22" fill="#163451" text-anchor="start">本实验存int8，计算时还原float32；未实现整数矩阵内核，不能据此声称推理加速。</text></g></svg>
