<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img"><title>预填充和解码时间线</title><desc>提示预填充产生第一个输出分布，喂入新词元后依次产生后续分布；首输出与后续延迟分开。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="35" y="45" font-size="28" fill="#163451" text-anchor="start">图25-1 预填充先产生首个输出分布；随后每步只读一个新词元</text><rect x="40" y="100" width="250" height="80" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="165.0" y="148.0" font-size="24" fill="#2459bf" text-anchor="middle">提示：P个已知词元</text><path d="M290,140L350,140" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M340,133L350,140L340,147" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="350" y="100" width="265" height="80" rx="12" fill="#f5f9ff" stroke="#2459bf" stroke-width="2"/><text x="482.5" y="148.0" font-size="24" fill="#2459bf" text-anchor="middle">prefill：并行读提示</text><path d="M615,140L680,140" fill="none" stroke="#2459bf" stroke-width="3" stroke-dasharray=""/><path d="M670,133L680,140L670,147" fill="none" stroke="#2459bf" stroke-width="3"/><rect x="680" y="100" width="200" height="80" rx="12" fill="#f5f9ff" stroke="#008b86" stroke-width="2"/><text x="780.0" y="148.0" font-size="24" fill="#008b86" text-anchor="middle">分布 → 词元1</text><rect x="350" y="260" width="265" height="80" rx="12" fill="#f5f9ff" stroke="#cf6b12" stroke-width="2"/><text x="482.5" y="308.0" font-size="24" fill="#cf6b12" text-anchor="middle">decode：读词元1</text><path d="M615,300L680,300" fill="none" stroke="#cf6b12" stroke-width="3" stroke-dasharray=""/><path d="M670,293L680,300L670,307" fill="none" stroke="#cf6b12" stroke-width="3"/><rect x="680" y="260" width="200" height="80" rx="12" fill="#f5f9ff" stroke="#008b86" stroke-width="2"/><text x="780.0" y="308.0" font-size="24" fill="#008b86" text-anchor="middle">分布 → 词元2</text><path d="M780,180L780,220" fill="none" stroke="#008b86" stroke-width="3" stroke-dasharray=""/><path d="M480,220L780,220" fill="none" stroke="#008b86" stroke-width="3" stroke-dasharray=""/><path d="M480,220L480,260" fill="none" stroke="#008b86" stroke-width="3" stroke-dasharray=""/><text x="40" y="405" font-size="24" fill="#163451" text-anchor="start">TTFT ≈ 预填充 + 首次选择；总输出G个词元需 G−1 次单词元解码。</text><text x="40" y="458" font-size="23" fill="#163451" text-anchor="start">这里只展示模型计算；真实服务还包括排队、分词、调度、传输及输出处理。</text></g></svg>
