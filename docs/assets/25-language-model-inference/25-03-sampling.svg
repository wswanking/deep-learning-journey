<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img"><title>温度与截断采样的手算</title><desc>四种分布对照，纵轴为概率零到一，横轴为候选词元A至D，显示真实手算结果。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="35" y="45" font-size="28" fill="#163451" text-anchor="start">图25-3 手算分布：先调整温度，再筛选，最后重新归一化</text><text x="65" y="100" font-size="24" fill="#163451" text-anchor="start">原始</text><path d="M65,420L305,420" fill="none" stroke="#163451" stroke-width="2" stroke-dasharray=""/><path d="M65,130L65,420" fill="none" stroke="#163451" stroke-width="2" stroke-dasharray=""/><rect x="77" y="246.0" width="35" height="174.0" fill="#2459bf"/><text x="94.5" y="238.0" font-size="17" fill="#163451" text-anchor="middle">0.600</text><text x="94.5" y="450" font-size="21" fill="#163451" text-anchor="middle">A</text><rect x="133" y="347.5" width="35" height="72.5" fill="#2459bf"/><text x="150.5" y="339.5" font-size="17" fill="#163451" text-anchor="middle">0.250</text><text x="150.5" y="450" font-size="21" fill="#163451" text-anchor="middle">B</text><rect x="189" y="391.0" width="35" height="29.0" fill="#2459bf"/><text x="206.5" y="383.0" font-size="17" fill="#163451" text-anchor="middle">0.100</text><text x="206.5" y="450" font-size="21" fill="#163451" text-anchor="middle">C</text><rect x="245" y="405.5" width="35" height="14.5" fill="#2459bf"/><text x="262.5" y="397.5" font-size="17" fill="#163451" text-anchor="middle">0.050</text><text x="262.5" y="450" font-size="21" fill="#163451" text-anchor="middle">D</text><text x="365" y="100" font-size="24" fill="#163451" text-anchor="start">温度0.5</text><path d="M365,420L605,420" fill="none" stroke="#163451" stroke-width="2" stroke-dasharray=""/><path d="M365,130L365,420" fill="none" stroke="#163451" stroke-width="2" stroke-dasharray=""/><rect x="377" y="180.0" width="35" height="240.0" fill="#2459bf"/><text x="394.5" y="172.0" font-size="17" fill="#163451" text-anchor="middle">0.828</text><text x="394.5" y="450" font-size="21" fill="#163451" text-anchor="middle">A</text><rect x="433" y="378.33333333333337" width="35" height="41.66666666666667" fill="#2459bf"/><text x="450.5" y="370.33333333333337" font-size="17" fill="#163451" text-anchor="middle">0.144</text><text x="450.5" y="450" font-size="21" fill="#163451" text-anchor="middle">B</text><rect x="489" y="413.3333333333333" width="35" height="6.6666666666666705" fill="#2459bf"/><text x="506.5" y="405.3333333333333" font-size="17" fill="#163451" text-anchor="middle">0.023</text><text x="506.5" y="450" font-size="21" fill="#163451" text-anchor="middle">C</text><rect x="545" y="418.3333333333333" width="35" height="1.666666666666668" fill="#2459bf"/><text x="562.5" y="410.3333333333333" font-size="17" fill="#163451" text-anchor="middle">0.006</text><text x="562.5" y="450" font-size="21" fill="#163451" text-anchor="middle">D</text><text x="665" y="100" font-size="24" fill="#163451" text-anchor="start">top-k=2</text><path d="M665,420L905,420" fill="none" stroke="#163451" stroke-width="2" stroke-dasharray=""/><path d="M665,130L665,420" fill="none" stroke="#163451" stroke-width="2" stroke-dasharray=""/><rect x="677" y="215.29411764705884" width="35" height="204.70588235294116" fill="#008b86"/><text x="694.5" y="207.29411764705884" font-size="17" fill="#163451" text-anchor="middle">0.706</text><text x="694.5" y="450" font-size="21" fill="#163451" text-anchor="middle">A</text><rect x="733" y="334.70588235294116" width="35" height="85.29411764705883" fill="#008b86"/><text x="750.5" y="326.70588235294116" font-size="17" fill="#163451" text-anchor="middle">0.294</text><text x="750.5" y="450" font-size="21" fill="#163451" text-anchor="middle">B</text><rect x="789" y="420.0" width="35" height="0.0" fill="#008b86"/><text x="806.5" y="412.0" font-size="17" fill="#163451" text-anchor="middle">0.000</text><text x="806.5" y="450" font-size="21" fill="#163451" text-anchor="middle">C</text><rect x="845" y="420.0" width="35" height="0.0" fill="#008b86"/><text x="862.5" y="412.0" font-size="17" fill="#163451" text-anchor="middle">0.000</text><text x="862.5" y="450" font-size="21" fill="#163451" text-anchor="middle">D</text><text x="965" y="100" font-size="24" fill="#163451" text-anchor="start">top-p=0.8</text><path d="M965,420L1205,420" fill="none" stroke="#163451" stroke-width="2" stroke-dasharray=""/><path d="M965,130L965,420" fill="none" stroke="#163451" stroke-width="2" stroke-dasharray=""/><rect x="977" y="215.29411764705884" width="35" height="204.70588235294116" fill="#008b86"/><text x="994.5" y="207.29411764705884" font-size="17" fill="#163451" text-anchor="middle">0.706</text><text x="994.5" y="450" font-size="21" fill="#163451" text-anchor="middle">A</text><rect x="1033" y="334.7058823529412" width="35" height="85.29411764705881" fill="#008b86"/><text x="1050.5" y="326.7058823529412" font-size="17" fill="#163451" text-anchor="middle">0.294</text><text x="1050.5" y="450" font-size="21" fill="#163451" text-anchor="middle">B</text><rect x="1089" y="420.0" width="35" height="0.0" fill="#008b86"/><text x="1106.5" y="412.0" font-size="17" fill="#163451" text-anchor="middle">0.000</text><text x="1106.5" y="450" font-size="21" fill="#163451" text-anchor="middle">C</text><rect x="1145" y="420.0" width="35" height="0.0" fill="#008b86"/><text x="1162.5" y="412.0" font-size="17" fill="#163451" text-anchor="middle">0.000</text><text x="1162.5" y="450" font-size="21" fill="#163451" text-anchor="middle">D</text><text x="40" y="515" font-size="23" fill="#163451" text-anchor="start">原分布：[0.60, 0.25, 0.10, 0.05]；top-p必须保留使累计概率首次达到阈值的词元。</text><text x="40" y="563" font-size="23" fill="#163451" text-anchor="start">提高温度不等于增加知识；本例top-k与top-p同分布，仅在这组数字上相同。</text></g></svg>
