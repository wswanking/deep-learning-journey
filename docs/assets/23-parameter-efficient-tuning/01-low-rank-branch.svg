<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img">
<title>低秩增量的双支路形状与手算</title><desc>原创教学示意或本机真实报告图；LoRA依据Hu等2021第4节，QLoRA依据Dettmers等2023第2至3节。所有图形与文字均为矢量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs>
<rect width="1080" height="600" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="22" fill="#24374c">图23-1  冻结原权重，训练低秩增量；同一个输入走两条支路</text><rect x="40" y="200" width="125" height="75" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="66" y="231" font-size="22" fill="#24374c">输入x</text><text x="62" y="260" font-size="16" fill="#24374c">k维列向量</text><path d="M175,235L220,235" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M220,235V115H290M220,235V355H290" stroke="#1475b8" stroke-width="2" fill="none"/><rect x="300" y="70" width="300" height="95" rx="5" fill="#edf0f4" stroke="#afc4d6"/><text x="330" y="110" font-size="22" fill="#24374c">W₀：d×k，冻结</text><text x="330" y="145" font-size="18" fill="#24374c">基座输出 W₀x</text><rect x="300" y="310" width="170" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="320" y="350" font-size="22" fill="#24374c">A：r×k</text><text x="320" y="385" font-size="18" fill="#24374c">压到r维</text><path d="M480,358L540,358" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="310" width="170" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="570" y="350" font-size="22" fill="#24374c">B：d×r</text><text x="570" y="385" font-size="18" fill="#24374c">升到d维</text><path d="M730,358L805,358" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="334" font-size="18" fill="#24374c">×s</text><path d="M610,118H845V230M815,358H845V280" stroke="#1475b8" stroke-width="2" fill="none"/><circle cx="845" cy="255" r="25" fill="#fff2e6" stroke="#bc570e"/><text x="833" y="264" font-size="27" fill="#bc570e">+</text><path d="M880,255L930,255" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#arrow)"/><text x="945" y="250" font-size="25" fill="#24374c">h</text><text x="80" y="460" font-size="19" fill="#24374c">h = W₀x + sBAx；s = α/r。只更新A、B，偏置与其他权重在本章也冻结。</text><text x="80" y="505" font-size="19" fill="#24374c">手算：Ax=3，BAx=(6,−3)，W₀x=(1,0)，s=1 → h=(7,−3)。</text><text x="80" y="550" font-size="18" fill="#bc570e">rank(ΔW) ≤ r；这约束增量，不要求W₀本身低秩，也不保证总权重低秩。</text></g></svg>
