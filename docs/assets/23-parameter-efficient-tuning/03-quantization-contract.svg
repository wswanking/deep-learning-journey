<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img">
<title>NF4 QLoRA概念与明确区分的CPU均匀量化手算</title><desc>原创教学示意或本机真实报告图；LoRA依据Hu等2021第4节，QLoRA依据Dettmers等2023第2至3节。所有图形与文字均为矢量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs>
<rect width="1080" height="600" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="22" fill="#24374c">图23-3  量化是近似表示；存4bit，不等于用4bit完成全部计算</text><rect x="45" y="85" width="475" height="165" rx="5" fill="#edf0f4" stroke="#afc4d6"/><text x="65" y="123" font-size="21" fill="#24374c">论文QLoRA：冻结量化基座</text><text x="65" y="165" font-size="19" fill="#24374c">NF4非均匀码本 + 分块缩放</text><text x="65" y="205" font-size="17" fill="#24374c">双重量化缩放元数据；分页优化器应对峰值</text><text x="65" y="234" font-size="17" fill="#24374c">解量化到计算dtype，梯度流向浮点LoRA</text><rect x="560" y="85" width="475" height="165" rx="5" fill="#fff2e6" stroke="#afc4d6"/><text x="580" y="123" font-size="21" fill="#bc570e">本章CPU替代：不是NF4 QLoRA</text><text x="580" y="165" font-size="18" fill="#24374c">逐行均匀对称−7…7，打包进4bit码</text><text x="580" y="205" font-size="17" fill="#24374c">尺度float64；每次前向解量化到float64</text><text x="580" y="234" font-size="17" fill="#24374c">保留浮点embedding/norm；没有分页优化器</text><text x="50" y="310" font-size="20" fill="#24374c">手算一行 w=[−1, −0.3, 0.2, 0.9]，δ=max|w|/7=1/7。</text><text x="50" y="355" font-size="19" fill="#24374c">整数 q=[−7, −2, 1, 6] → 4bit码 q+8=[1,6,9,14]。</text><text x="50" y="400" font-size="19" fill="#24374c">每两个码打包：1+16×6=97；9+16×14=233。码0未用。</text><text x="50" y="445" font-size="19" fill="#24374c">重建 ŵ=[−1, −2/7, 1/7, 6/7]；最大误差2/35≈0.05714。</text><text x="50" y="490" font-size="18" fill="#24374c">未饱和舍入误差≤δ/2；基座输出、梯度传播也会受到量化误差影响。</text><text x="50" y="550" font-size="18" fill="#bc570e">4权重：原float64为32B；本例打包2B+尺度8B=10B，仍非纯粹“8倍缩小”。</text></g></svg>
