<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img">
<title>冻结与梯度传播、零初始化的区别</title><desc>原创教学示意或本机真实报告图；LoRA依据Hu等2021第4节，QLoRA依据Dettmers等2023第2至3节。所有图形与文字均为矢量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#1475b8"/></marker></defs>
<rect width="1080" height="600" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="25" y="35" font-size="22" fill="#24374c">图23-2  冻结参数仍能传梯度；no_grad会切断所包住的计算</text><rect x="45" y="105" width="215" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="65" y="145" font-size="21" fill="#24374c">前层LoRA</text><text x="65" y="180" font-size="17" fill="#24374c">A₁、B₁可训练</text><path d="M267,150L295,150" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="305" y="105" width="215" height="95" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="325" y="145" font-size="21" fill="#24374c">隐藏状态u</text><text x="325" y="180" font-size="17" fill="#24374c">需要接收梯度</text><path d="M527,150L555,150" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="565" y="105" width="215" height="95" rx="5" fill="#edf0f4" stroke="#afc4d6"/><text x="585" y="145" font-size="21" fill="#24374c">冻结线性W₂</text><text x="585" y="180" font-size="17" fill="#24374c">不积累参数梯度</text><path d="M787,150L815,150" fill="none" stroke="#1475b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="825" y="105" width="215" height="95" rx="5" fill="#fff2e6" stroke="#afc4d6"/><text x="845" y="145" font-size="21" fill="#24374c">损失L</text><text x="845" y="180" font-size="17" fill="#24374c">计算目标误差</text><path d="M920,220V255H155V220" stroke="#bc570e" stroke-width="3" fill="none"/><text x="190" y="290" font-size="19" fill="#24374c">反向：∂L/∂u = W₂ᵀ g；W₂不更新，但u与更早的LoRA仍需这条梯度。</text><rect x="50" y="335" width="475" height="160" rx="5" fill="#eaf4fc" stroke="#afc4d6"/><text x="75" y="375" font-size="22" fill="#24374c">A随机非零，B=0</text><text x="75" y="415" font-size="18" fill="#24374c">开始：BA=0，输出与原基座一致。</text><text x="75" y="455" font-size="18" fill="#24374c">首步：∇A=0，∇B通常非零。</text><rect x="555" y="335" width="475" height="160" rx="5" fill="#fff2e6" stroke="#afc4d6"/><text x="580" y="375" font-size="22" fill="#bc570e">若A=0，B=0</text><text x="580" y="415" font-size="18" fill="#24374c">两因子梯度都为0，支路无法起步。</text><text x="580" y="455" font-size="18" fill="#24374c">不要把“零增量”误写成“双零因子”。</text><text x="60" y="550" font-size="18" fill="#24374c">requires_grad=False冻结参数；eval()控制训练行为；no_grad()关闭计算记录。三者不同。</text></g></svg>
