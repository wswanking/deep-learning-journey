="18" fill="#24374c">3个监督byte/例：两字母回答 + LF；无序字母对按组隔离，测试仅24例。</text><text x="45" y="550" font-size="18" fill="#bc570e">LF为本任务停止约定；低teacher-forced损失不保证生成时复制/反转正确。</text><text x="45" y="590" font-size="17" fill="#24374c">同一基座与数据；量化会改变初始函数；单种子小样本不能推出普遍性能排序。</text></g></svg>
