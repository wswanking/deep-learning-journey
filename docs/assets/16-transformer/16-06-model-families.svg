<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 610" role="img" aria-labelledby="title desc"><title id="title">三类Transformer架构</title><desc id="desc">BERT编码器以双向上下文重建被选中的词并原始加入句间目标，GPT因果预测下一词，编码器解码器以源表示为条件预测目标。</desc><rect width="1230" height="610" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="27" fill="#16344f" text-anchor="start">图16-6  三类架构与训练目标：可见范围和监督位置需要一起规定</text><rect x="35" y="110" width="370" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="220.00" y="155.50" font-size="25" fill="#16344f" text-anchor="middle">Encoder-only / BERT</text><text x="55.00" y="245.00" font-size="23" fill="#16344f" text-anchor="start">双向自注意力</text><text x="55.00" y="310.00" font-size="23" fill="#16344f" text-anchor="start">输入含被选择的遮蔽/替换</text><text x="55.00" y="375.00" font-size="23" fill="#16344f" text-anchor="start">仅选中位置预测原词</text><text x="55.00" y="440.00" font-size="23" fill="#16344f" text-anchor="start">原始BERT另有NSP目标</text><rect x="430" y="110" width="370" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="615.00" y="155.50" font-size="25" fill="#16344f" text-anchor="middle">Decoder-only / GPT</text><text x="450.00" y="245.00" font-size="23" fill="#16344f" text-anchor="start">因果自注意力</text><text x="450.00" y="310.00" font-size="23" fill="#16344f" text-anchor="start">输入右移，预测下一个词</text><text x="450.00" y="375.00" font-size="23" fill="#16344f" text-anchor="start">训练各有效位置并行计算</text><text x="450.00" y="440.00" font-size="23" fill="#16344f" text-anchor="start">生成按新词逐步进行</text><rect x="825" y="110" width="370" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1010.00" y="155.50" font-size="25" fill="#16344f" text-anchor="middle">Encoder–decoder</text><text x="845.00" y="245.00" font-size="23" fill="#16344f" text-anchor="start">源侧双向编码</text><text x="845.00" y="310.00" font-size="23" fill="#16344f" text-anchor="start">目标侧因果自注意力</text><text x="845.00" y="375.00" font-size="23" fill="#16344f" text-anchor="start">交叉注意力读取源表示</text><text x="845.00" y="440.00" font-size="23" fill="#16344f" text-anchor="start">预测目标下一词，条件是源</text><line x1="425.00" y1="195.00" x2="425.00" y2="500.00" stroke="#cbdbe7" stroke-width="2"/><line x1="820.00" y1="195.00" x2="820.00" y2="500.00" stroke="#cbdbe7" stroke-width="2"/><text x="50.00" y="560.00" font-size="23" fill="#16344f" text-anchor="start">“遮住输入词”与“遮住注意力边”不是同一种mask；结构名称也不能代替损失定义。</text></g></svg>
