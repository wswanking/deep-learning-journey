<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">原始Transformer数据流</title><desc id="desc">依据Vaswani等2017图1与第3节重构，编码器自注意力和FFN，解码器因果自注意力、交叉注意力和FFN，各子层采用原始Post-LN。</desc><rect width="1200" height="1080" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="28" fill="#16344f" text-anchor="start">图16-1  原始encoder–decoder结构：先看数据流，再拆解子层</text><text x="85.00" y="95.00" font-size="23" fill="#16344f" text-anchor="start">原始Post-LN：每个子层后做残差相加与LayerNorm；本章实验采用Pre-LN。</text><text x="290.00" y="155.00" font-size="28" fill="#16344f" text-anchor="middle">编码器 Encoder</text><text x="900.00" y="155.00" font-size="28" fill="#16344f" text-anchor="middle">解码器 Decoder</text><rect x="120" y="890" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="290.00" y="927.50" font-size="25" fill="#16344f" text-anchor="middle">源序列嵌入＋位置</text><text x="290.00" y="956.50" font-size="20" fill="#16344f" text-anchor="middle">Tₛ × d</text><rect x="120" y="735" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="290.00" y="772.50" font-size="25" fill="#16344f" text-anchor="middle">多头自注意力</text><text x="290.00" y="801.50" font-size="20" fill="#16344f" text-anchor="middle">Q、K、V均来自源表示</text><rect x="120" y="645" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="290.00" y="682.50" font-size="25" fill="#16344f" text-anchor="middle">Add &amp; Norm</text><text x="290.00" y="711.50" font-size="20" fill="#16344f" text-anchor="middle">残差相加后归一化</text><rect x="120" y="555" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="290.00" y="592.50" font-size="25" fill="#16344f" text-anchor="middle">逐位置FFN</text><text x="290.00" y="621.50" font-size="20" fill="#16344f" text-anchor="middle">相同MLP作用于每个位置</text><rect x="120" y="465" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="290.00" y="502.50" font-size="25" fill="#16344f" text-anchor="middle">Add &amp; Norm</text><text x="290.00" y="531.50" font-size="20" fill="#16344f" text-anchor="middle">一层的输出仍为 Tₛ × d</text><rect x="120" y="320" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="290.00" y="357.50" font-size="25" fill="#16344f" text-anchor="middle">编码器最终表示</text><text x="290.00" y="386.50" font-size="20" fill="#16344f" text-anchor="middle">供每层交叉注意力读取</text><line x1="290.00" y1="890.00" x2="290.00" y2="810.00" stroke="#16344f" stroke-width="3"/><path d="M 295.27 819.65 L 290.00 810.00 L 284.73 819.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="290.00" y1="735.00" x2="290.00" y2="720.00" stroke="#16344f" stroke-width="3"/><path d="M 295.27 729.65 L 290.00 720.00 L 284.73 729.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="290.00" y1="645.00" x2="290.00" y2="630.00" stroke="#16344f" stroke-width="3"/><path d="M 295.27 639.65 L 290.00 630.00 L 284.73 639.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="290.00" y1="555.00" x2="290.00" y2="540.00" stroke="#16344f" stroke-width="3"/><path d="M 295.27 549.65 L 290.00 540.00 L 284.73 549.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="290.00" y1="465.00" x2="290.00" y2="395.00" stroke="#16344f" stroke-width="3"/><path d="M 295.27 404.65 L 290.00 395.00 L 284.73 404.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="80.00" y1="450.00" x2="80.00" y2="825.00" stroke="#007d75" stroke-width="3"/><text x="45.00" y="625.00" font-size="24" fill="#007d75" text-anchor="middle">N层</text><rect x="730" y="890" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="900.00" y="927.50" font-size="25" fill="#16344f" text-anchor="middle">右移目标嵌入＋位置</text><text x="900.00" y="956.50" font-size="20" fill="#16344f" text-anchor="middle">Tᵧ × d</text><rect x="730" y="785" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="900.00" y="822.50" font-size="25" fill="#16344f" text-anchor="middle">因果多头自注意力</text><text x="900.00" y="851.50" font-size="20" fill="#16344f" text-anchor="middle">只读当前及更早输入位置</text><rect x="730" y="695" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="900.00" y="740.50" font-size="25" fill="#16344f" text-anchor="middle">Add &amp; Norm</text><rect x="730" y="605" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="900.00" y="642.50" font-size="25" fill="#16344f" text-anchor="middle">交叉注意力</text><text x="900.00" y="671.50" font-size="20" fill="#16344f" text-anchor="middle">Q来自目标；K、V来自源</text><rect x="730" y="515" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="900.00" y="560.50" font-size="25" fill="#16344f" text-anchor="middle">Add &amp; Norm</text><rect x="730" y="425" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="900.00" y="470.50" font-size="25" fill="#16344f" text-anchor="middle">逐位置FFN</text><rect x="730" y="335" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="900.00" y="372.50" font-size="25" fill="#16344f" text-anchor="middle">Add &amp; Norm</text><text x="900.00" y="401.50" font-size="20" fill="#16344f" text-anchor="middle">一层的输出仍为 Tᵧ × d</text><rect x="730" y="220" width="340" height="75" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="900.00" y="257.50" font-size="25" fill="#16344f" text-anchor="middle">线性读出＋softmax</text><text x="900.00" y="286.50" font-size="20" fill="#16344f" text-anchor="middle">每位置输出词表概率</text><line x1="900.00" y1="890.00" x2="900.00" y2="860.00" stroke="#16344f" stroke-width="3"/><path d="M 905.27 869.65 L 900.00 860.00 L 894.73 869.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="900.00" y1="785.00" x2="900.00" y2="770.00" stroke="#16344f" stroke-width="3"/><path d="M 905.27 779.65 L 900.00 770.00 L 894.73 779.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="900.00" y1="695.00" x2="900.00" y2="680.00" stroke="#16344f" stroke-width="3"/><path d="M 905.27 689.65 L 900.00 680.00 L 894.73 689.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="900.00" y1="605.00" x2="900.00" y2="590.00" stroke="#16344f" stroke-width="3"/><path d="M 905.27 599.65 L 900.00 590.00 L 894.73 599.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="900.00" y1="515.00" x2="900.00" y2="500.00" stroke="#16344f" stroke-width="3"/><path d="M 905.27 509.65 L 900.00 500.00 L 894.73 509.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="900.00" y1="425.00" x2="900.00" y2="410.00" stroke="#16344f" stroke-width="3"/><path d="M 905.27 419.65 L 900.00 410.00 L 894.73 419.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="900.00" y1="335.00" x2="900.00" y2="295.00" stroke="#16344f" stroke-width="3"/><path d="M 905.27 304.65 L 900.00 295.00 L 894.73 304.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="1110.00" y1="325.00" x2="1110.00" y2="870.00" stroke="#007d75" stroke-width="3"/><text x="1150.00" y="600.00" font-size="24" fill="#007d75" text-anchor="middle">N层</text><line x1="465.00" y1="357.00" x2="590.00" y2="357.00" stroke="#16344f" stroke-width="3"/><path d="M 580.35 362.27 L 590.00 357.00 L 580.35 351.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="590.00" y1="357.00" x2="590.00" y2="642.00" stroke="#16344f" stroke-width="3"/><line x1="590.00" y1="642.00" x2="720.00" y2="642.00" stroke="#16344f" stroke-width="3"/><path d="M 710.35 647.27 L 720.00 642.00 L 710.35 636.73" stroke="#16344f" fill="none" stroke-width="3"/><text x="475.00" y="320.00" font-size="22" fill="#16344f" text-anchor="start">源表示作为K、V</text><text x="80.00" y="1030.00" font-size="23" fill="#16344f" text-anchor="start">N层表示重复同一种结构；不同深度拥有各自的参数，并非时间上的权重共享。</text></g></svg>
