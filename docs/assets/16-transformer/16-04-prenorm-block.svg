<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Pre-LN残差块</title><desc id="desc">注意力前做第一层归一化并加回输入，再在第二次归一化后做逐位置FFN并加回中间状态；两条残差均保持宽度。</desc><rect width="1200" height="670" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="29" fill="#16344f" text-anchor="start">图16-4  本章微型Pre-LN block：两条残差路径保持宽度</text><rect x="40" y="220" width="180" height="90" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="130.00" y="265.00" font-size="25" fill="#16344f" text-anchor="middle">输入X</text><text x="130.00" y="294.00" font-size="20" fill="#16344f" text-anchor="middle">B×T×8</text><rect x="300" y="220" width="220" height="90" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="410.00" y="265.00" font-size="25" fill="#16344f" text-anchor="middle">LN₁→MHA</text><text x="410.00" y="294.00" font-size="20" fill="#16344f" text-anchor="middle">B×T×8</text><rect x="620" y="220" width="180" height="90" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="710.00" y="265.00" font-size="25" fill="#16344f" text-anchor="middle">残差相加U</text><text x="710.00" y="294.00" font-size="20" fill="#16344f" text-anchor="middle">B×T×8</text><rect x="900" y="220" width="240" height="90" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1020.00" y="265.00" font-size="25" fill="#16344f" text-anchor="middle">LN₂→FFN</text><text x="1020.00" y="294.00" font-size="20" fill="#16344f" text-anchor="middle">B×T×8</text><line x1="225.00" y1="265.00" x2="290.00" y2="265.00" stroke="#16344f" stroke-width="3"/><path d="M 280.35 270.27 L 290.00 265.00 L 280.35 259.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="525.00" y1="265.00" x2="610.00" y2="265.00" stroke="#16344f" stroke-width="3"/><path d="M 600.35 270.27 L 610.00 265.00 L 600.35 259.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="805.00" y1="265.00" x2="890.00" y2="265.00" stroke="#16344f" stroke-width="3"/><path d="M 880.35 270.27 L 890.00 265.00 L 880.35 259.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="130.00" y1="215.00" x2="130.00" y2="125.00" stroke="#007d75" stroke-width="3"/><line x1="130.00" y1="125.00" x2="710.00" y2="125.00" stroke="#007d75" stroke-width="3"/><line x1="710.00" y1="125.00" x2="710.00" y2="210.00" stroke="#007d75" stroke-width="3"/><path d="M 704.73 200.35 L 710.00 210.00 L 715.27 200.35" stroke="#007d75" fill="none" stroke-width="3"/><rect x="900" y="455" width="240" height="90" rx="10" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1020.00" y="500.00" font-size="25" fill="#16344f" text-anchor="middle">残差相加Y</text><text x="1020.00" y="529.00" font-size="20" fill="#16344f" text-anchor="middle">B×T×8</text><line x1="1020.00" y1="315.00" x2="1020.00" y2="445.00" stroke="#16344f" stroke-width="3"/><path d="M 1014.73 435.35 L 1020.00 445.00 L 1025.27 435.35" stroke="#16344f" fill="none" stroke-width="3"/><line x1="710.00" y1="315.00" x2="710.00" y2="500.00" stroke="#007d75" stroke-width="3"/><line x1="710.00" y1="500.00" x2="890.00" y2="500.00" stroke="#007d75" stroke-width="3"/><path d="M 880.35 505.27 L 890.00 500.00 L 880.35 494.73" stroke="#007d75" fill="none" stroke-width="3"/><text x="245.00" y="110.00" font-size="24" fill="#007d75" text-anchor="start">U = X + MHA(LN₁(X))</text><text x="55.00" y="565.00" font-size="25" fill="#007d75" text-anchor="start">Y = U + FFN(LN₂(U))</text><text x="55.00" y="625.00" font-size="23" fill="#16344f" text-anchor="start">LN按每个位置的8个特征归一化；FFN只变换特征，不混合不同位置。</text></g></svg>
