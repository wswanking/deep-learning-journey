<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" role="img" aria-labelledby="title desc"><title id="title">XOR输入空间与隐藏表示</title><desc id="desc">四个XOR输入点经两单元ReLU映射为三个位置，两个正类重合，随后可用h1减2h2减0.5的阈值分开；标记形状同时区分类别。</desc><rect width="1160" height="640" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="28" fill="#16344f" text-anchor="start">图07-3  XOR经过非线性表示后，可由一条直线分开</text><text x="275.00" y="105.00" font-size="25" fill="#16344f" text-anchor="middle">原输入空间 x₁、x₂</text><line x1="80.00" y1="419.29" x2="470.00" y2="419.29" stroke="#16344f" stroke-width="3"/><path d="M 460.35 424.56 L 470.00 419.29 L 460.35 414.01" fill="none" stroke="#16344f" stroke-width="3"/><line x1="135.71" y1="465.00" x2="135.71" y2="145.00" stroke="#16344f" stroke-width="3"/><path d="M 140.99 154.65 L 135.71 145.00 L 130.44 154.65" fill="none" stroke="#16344f" stroke-width="3"/><text x="135.71" y="493.00" font-size="21" fill="#16344f" text-anchor="middle">0</text><text x="414.29" y="493.00" font-size="21" fill="#16344f" text-anchor="middle">1</text><text x="68.00" y="426.29" font-size="21" fill="#16344f" text-anchor="end">0</text><text x="68.00" y="197.71" font-size="21" fill="#16344f" text-anchor="end">1</text><path d="M 135.71 406.29 L 148.71 419.29 L 135.71 432.29 L 122.71 419.29 Z" fill="#a95813"/><text x="153.71" y="404.29" font-size="23" fill="#16344f" text-anchor="start">00</text><circle cx="135.71" cy="190.71" r="12" fill="white" stroke="#007d75" stroke-width="4"/><text x="153.71" y="175.71" font-size="23" fill="#16344f" text-anchor="start">01</text><circle cx="414.29" cy="419.29" r="12" fill="white" stroke="#007d75" stroke-width="4"/><text x="432.29" y="404.29" font-size="23" fill="#16344f" text-anchor="start">10</text><path d="M 414.29 177.71 L 427.29 190.71 L 414.29 203.71 L 401.29 190.71 Z" fill="#a95813"/><text x="432.29" y="175.71" font-size="23" fill="#16344f" text-anchor="start">11</text><text x="870.00" y="105.00" font-size="25" fill="#16344f" text-anchor="middle">隐藏空间 h₁、h₂</text><line x1="675.00" y1="405.00" x2="1065.00" y2="405.00" stroke="#16344f" stroke-width="3"/><path d="M 1055.35 410.27 L 1065.00 405.00 L 1055.35 399.73" fill="none" stroke="#16344f" stroke-width="3"/><line x1="720.00" y1="465.00" x2="720.00" y2="145.00" stroke="#16344f" stroke-width="3"/><path d="M 725.27 154.65 L 720.00 145.00 L 714.73 154.65" fill="none" stroke="#16344f" stroke-width="3"/><text x="720.00" y="493.00" font-size="21" fill="#16344f" text-anchor="middle">0</text><text x="870.00" y="493.00" font-size="21" fill="#16344f" text-anchor="middle">1</text><text x="1020.00" y="493.00" font-size="21" fill="#16344f" text-anchor="middle">2</text><text x="663.00" y="412.00" font-size="21" fill="#16344f" text-anchor="end">0</text><text x="663.00" y="212.00" font-size="21" fill="#16344f" text-anchor="end">1</text><path d="M 720.00 455.00 L 1065.00 225.00" fill="none" stroke="#235bc7" stroke-width="3" stroke-dasharray="8 6"/><path d="M 720.00 392.00 L 733.00 405.00 L 720.00 418.00 L 707.00 405.00 Z" fill="#a95813"/><text x="738.00" y="390.00" font-size="23" fill="#16344f" text-anchor="start">00</text><circle cx="870.00" cy="405.00" r="12" fill="white" stroke="#007d75" stroke-width="4"/><text x="888.00" y="390.00" font-size="23" fill="#16344f" text-anchor="start">01、10</text><path d="M 1020.00 192.00 L 1033.00 205.00 L 1020.00 218.00 L 1007.00 205.00 Z" fill="#a95813"/><text x="1038.00" y="190.00" font-size="23" fill="#16344f" text-anchor="start">11</text><line x1="505.00" y1="300.00" x2="620.00" y2="300.00" stroke="#007d75" stroke-width="3"/><path d="M 610.35 305.27 L 620.00 300.00 L 610.35 294.73" fill="none" stroke="#007d75" stroke-width="3"/><text x="563.00" y="265.00" font-size="22" fill="#007d75" text-anchor="middle">ReLU表示</text><text x="80.00" y="535.00" font-size="24" fill="#16344f" text-anchor="start">空心圆：标签1；菱形：标签0。</text><text x="675.00" y="535.00" font-size="24" fill="#235bc7" text-anchor="start">虚线：h₁−2h₂−0.5=0</text><text x="80.00" y="590.00" font-size="23" fill="#16344f" text-anchor="start">01与10在隐藏空间重合，因其目标相同；表示并不需要保留全部输入细节。</text></g></svg>
