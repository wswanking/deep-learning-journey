<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc"><title id="title">MLP逐层形状与参数</title><desc id="desc">输入二维，两维隐藏层先仿射再ReLU，最后一个输出分数再经sigmoid；两个参数层共9个参数。</desc><rect width="1160" height="600" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="48.00" font-size="29" fill="#16344f" text-anchor="start">图07-1  两个带参数层，逐步追踪一次前向计算</text><rect x="35" y="140" width="185" height="180" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="127.00" y="185.00" font-size="25" fill="#16344f" text-anchor="middle">输入x</text><text x="127.00" y="238.00" font-size="22" fill="#235bc7" text-anchor="middle">2×1</text><text x="127.00" y="285.00" font-size="18" fill="#16344f" text-anchor="middle">输入维度2</text><line x1="224.00" y1="230.00" x2="252.00" y2="230.00" stroke="#16344f" stroke-width="3"/><path d="M 242.35 235.27 L 252.00 230.00 L 242.35 224.73" fill="none" stroke="#16344f" stroke-width="3"/><rect x="260" y="140" width="185" height="180" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="352.00" y="185.00" font-size="25" fill="#16344f" text-anchor="middle">仿射层1</text><text x="352.00" y="238.00" font-size="22" fill="#235bc7" text-anchor="middle">W[1]：2×2</text><text x="352.00" y="285.00" font-size="18" fill="#16344f" text-anchor="middle">b[1]：2×1</text><line x1="449.00" y1="230.00" x2="477.00" y2="230.00" stroke="#16344f" stroke-width="3"/><path d="M 467.35 235.27 L 477.00 230.00 L 467.35 224.73" fill="none" stroke="#16344f" stroke-width="3"/><rect x="485" y="140" width="185" height="180" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="577.00" y="185.00" font-size="25" fill="#16344f" text-anchor="middle">ReLU</text><text x="577.00" y="238.00" font-size="22" fill="#235bc7" text-anchor="middle">h[1]：2×1</text><text x="577.00" y="285.00" font-size="18" fill="#16344f" text-anchor="middle">逐元素取max(0,z)</text><line x1="674.00" y1="230.00" x2="702.00" y2="230.00" stroke="#16344f" stroke-width="3"/><path d="M 692.35 235.27 L 702.00 230.00 L 692.35 224.73" fill="none" stroke="#16344f" stroke-width="3"/><rect x="710" y="140" width="185" height="180" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="802.00" y="185.00" font-size="25" fill="#16344f" text-anchor="middle">仿射层2</text><text x="802.00" y="238.00" font-size="22" fill="#235bc7" text-anchor="middle">W[2]：1×2</text><text x="802.00" y="285.00" font-size="18" fill="#16344f" text-anchor="middle">b[2]：1×1</text><line x1="899.00" y1="230.00" x2="927.00" y2="230.00" stroke="#16344f" stroke-width="3"/><path d="M 917.35 235.27 L 927.00 230.00 L 917.35 224.73" fill="none" stroke="#16344f" stroke-width="3"/><rect x="935" y="140" width="185" height="180" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="1027.00" y="185.00" font-size="25" fill="#16344f" text-anchor="middle">输出</text><text x="1027.00" y="238.00" font-size="22" fill="#235bc7" text-anchor="middle">z[2]：1×1</text><text x="1027.00" y="285.00" font-size="18" fill="#16344f" text-anchor="middle">p = sigmoid(z[2])</text><text x="350.00" y="365.00" font-size="24" fill="#007d75" text-anchor="middle">第一层参数：4+2=6</text><text x="800.00" y="365.00" font-size="24" fill="#007d75" text-anchor="middle">第二层参数：2+1=3</text><rect x="60" y="425" width="1030" height="125" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="85.00" y="470.00" font-size="26" fill="#16344f" text-anchor="start">手算输入 x=(1,1)ᵀ：z[1]=(2,1)ᵀ → h[1]=(2,1)ᵀ → z[2]=−0.5</text><text x="85.00" y="518.00" font-size="24" fill="#16344f" text-anchor="start">再转为二分类概率 p≈0.37754；总参数9，批次大小不计入参数量。</text></g></svg>
