<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">浮点间距与尺度</title><desc id="desc">三位二进制有效数字的教学格式在1附近间距0.25，在2附近间距0.5；两行采用同一数值尺度。</desc><rect width="1120" height="500" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="40.00" y="48.00" font-size="28" fill="#17344e" text-anchor="start">图04-1  浮点间距随尺度变化：3位二进制有效数字的玩具格式</text><text x="50.00" y="188.00" font-size="24" fill="#17344e" text-anchor="start">指数0</text><line x1="160.00" y1="180.00" x2="750.00" y2="180.00" stroke="#17344e" stroke-width="3"/><path d="M 740.47 185.50 L 750.00 180.00 L 740.47 174.50" fill="none" stroke="#17344e" stroke-width="3"/><line x1="190.00" y1="168.00" x2="190.00" y2="192.00" stroke="#245ec5" stroke-width="3"/><text x="190.00" y="228.00" font-size="24" fill="#17344e" text-anchor="middle">1</text><line x1="270.00" y1="168.00" x2="270.00" y2="192.00" stroke="#245ec5" stroke-width="3"/><text x="270.00" y="228.00" font-size="24" fill="#17344e" text-anchor="middle">1.25</text><line x1="350.00" y1="168.00" x2="350.00" y2="192.00" stroke="#245ec5" stroke-width="3"/><text x="350.00" y="228.00" font-size="24" fill="#17344e" text-anchor="middle">1.5</text><line x1="430.00" y1="168.00" x2="430.00" y2="192.00" stroke="#245ec5" stroke-width="3"/><text x="430.00" y="228.00" font-size="24" fill="#17344e" text-anchor="middle">1.75</text><line x1="190.00" y1="135.00" x2="270.00" y2="135.00" stroke="#007d75" stroke-width="3"/><text x="230.00" y="122.00" font-size="22" fill="#007d75" text-anchor="middle">间距0.25</text><text x="50.00" y="358.00" font-size="24" fill="#17344e" text-anchor="start">指数1</text><line x1="160.00" y1="350.00" x2="750.00" y2="350.00" stroke="#17344e" stroke-width="3"/><path d="M 740.47 355.50 L 750.00 350.00 L 740.47 344.50" fill="none" stroke="#17344e" stroke-width="3"/><line x1="190.00" y1="338.00" x2="190.00" y2="362.00" stroke="#245ec5" stroke-width="3"/><text x="190.00" y="398.00" font-size="24" fill="#17344e" text-anchor="middle">2</text><line x1="350.00" y1="338.00" x2="350.00" y2="362.00" stroke="#245ec5" stroke-width="3"/><text x="350.00" y="398.00" font-size="24" fill="#17344e" text-anchor="middle">2.5</text><line x1="510.00" y1="338.00" x2="510.00" y2="362.00" stroke="#245ec5" stroke-width="3"/><text x="510.00" y="398.00" font-size="24" fill="#17344e" text-anchor="middle">3</text><line x1="670.00" y1="338.00" x2="670.00" y2="362.00" stroke="#245ec5" stroke-width="3"/><text x="670.00" y="398.00" font-size="24" fill="#17344e" text-anchor="middle">3.5</text><line x1="190.00" y1="305.00" x2="350.00" y2="305.00" stroke="#007d75" stroke-width="3"/><text x="270.00" y="292.00" font-size="22" fill="#007d75" text-anchor="middle">间距0.5</text><rect x="800" y="115" width="270" height="270" rx="10" fill="#eff5fa" stroke="#d1dee7" stroke-width="2"/><text x="820.00" y="160.00" font-size="26" fill="#17344e" text-anchor="start">有效位相同</text><text x="820.00" y="215.00" font-size="23" fill="#17344e" text-anchor="start">数值范围扩大2倍</text><text x="820.00" y="270.00" font-size="22" fill="#17344e" text-anchor="start">相邻间距也扩大2倍</text><text x="820.00" y="330.00" font-size="23" fill="#17344e" text-anchor="start">并非等间距实数轴</text><text x="50.00" y="460.00" font-size="22" fill="#506b80" text-anchor="start">两行使用相同数值尺度，仅平移起点；玩具格式不等于float32的位数。</text></g></svg>
