<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">稳定softmax与log-sum-exp流程</title><desc id="desc">原始大分数直接求指数会溢出；减最大值后最大指数项为1，概率及对数归一化可以稳定计算。</desc><rect width="1200" height="560" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="40.00" y="45.00" font-size="29" fill="#17344e" text-anchor="start">图04-2  同一softmax公式，选择可计算的中间值</text><rect x="40" y="100" width="320" height="125" rx="10" fill="#eff5fa" stroke="#d1dee7" stroke-width="2"/><rect x="40" y="335" width="320" height="125" rx="10" fill="#eff5fa" stroke="#d1dee7" stroke-width="2"/><rect x="440" y="100" width="320" height="125" rx="10" fill="#eff5fa" stroke="#d1dee7" stroke-width="2"/><rect x="440" y="335" width="320" height="125" rx="10" fill="#eff5fa" stroke="#d1dee7" stroke-width="2"/><rect x="840" y="100" width="320" height="125" rx="10" fill="#eff5fa" stroke="#d1dee7" stroke-width="2"/><rect x="840" y="335" width="320" height="125" rx="10" fill="#eff5fa" stroke="#d1dee7" stroke-width="2"/><text x="60.00" y="140.00" font-size="25" fill="#17344e" text-anchor="start">输入分数z</text><text x="60.00" y="185.00" font-size="23" fill="#17344e" text-anchor="start">(1000, 1001, 1002)</text><text x="460.00" y="140.00" font-size="25" fill="#b32a3d" text-anchor="start">直接计算 exp(z)</text><text x="460.00" y="185.00" font-size="24" fill="#b32a3d" text-anchor="start">(∞, ∞, ∞)：上溢</text><text x="860.00" y="140.00" font-size="25" fill="#b32a3d" text-anchor="start">直接相除</text><text x="860.00" y="185.00" font-size="25" fill="#b32a3d" text-anchor="start">∞ / ∞ → NaN</text><line x1="365.00" y1="160.00" x2="430.00" y2="160.00" stroke="#b32a3d" stroke-width="3"/><path d="M 420.47 165.50 L 430.00 160.00 L 420.47 154.50" fill="none" stroke="#b32a3d" stroke-width="3"/><line x1="765.00" y1="160.00" x2="830.00" y2="160.00" stroke="#b32a3d" stroke-width="3"/><path d="M 820.47 165.50 L 830.00 160.00 L 820.47 154.50" fill="none" stroke="#b32a3d" stroke-width="3"/><text x="60.00" y="375.00" font-size="24" fill="#007d75" text-anchor="start">减去最大值 m=1002</text><text x="60.00" y="420.00" font-size="24" fill="#17344e" text-anchor="start">得到 (-2, -1, 0)</text><text x="460.00" y="375.00" font-size="25" fill="#007d75" text-anchor="start">指数及求和</text><text x="460.00" y="420.00" font-size="21" fill="#17344e" text-anchor="start">S ≈ 1.5032，至少含一个1</text><text x="860.00" y="375.00" font-size="25" fill="#007d75" text-anchor="start">归一化概率</text><text x="860.00" y="420.00" font-size="22" fill="#17344e" text-anchor="start">(0.0900, 0.2447, 0.6652)</text><line x1="365.00" y1="395.00" x2="430.00" y2="395.00" stroke="#007d75" stroke-width="3"/><path d="M 420.47 400.50 L 430.00 395.00 L 420.47 389.50" fill="none" stroke="#007d75" stroke-width="3"/><line x1="765.00" y1="395.00" x2="830.00" y2="395.00" stroke="#007d75" stroke-width="3"/><path d="M 820.47 400.50 L 830.00 395.00 L 820.47 389.50" fill="none" stroke="#007d75" stroke-width="3"/><text x="50.00" y="285.00" font-size="25" fill="#17344e" text-anchor="start">稳定路径保持同一数学结果，并控制指数输入不大于0。</text><text x="50.00" y="520.00" font-size="24" fill="#17344e" text-anchor="start">LSE(z) = m + log S ≈ 1002.4076；log概率直接用 (z−m)−log S。</text></g></svg>
