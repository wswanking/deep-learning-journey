<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">LSTM门控记忆</title><desc id="desc">旧记忆乘忘记门、新候选乘输入门后相加得到细胞状态，状态通过tanh和输出门得到隐藏状态。门由当前输入及之前隐藏状态计算。</desc><rect width="1200" height="720" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="29" fill="#16344f" text-anchor="start">图13-3  LSTM：旧记忆与新候选相加，再控制读出</text><rect x="35" y="150" width="170" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="120.00" y="192.50" font-size="26" fill="#16344f" text-anchor="middle">cₜ₋₁</text><text x="120.00" y="223.50" font-size="21" fill="#16344f" text-anchor="middle">旧记忆</text><rect x="310" y="150" width="145" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="382.50" y="192.50" font-size="26" fill="#16344f" text-anchor="middle">× fₜ</text><text x="382.50" y="223.50" font-size="21" fill="#16344f" text-anchor="middle">保留比例</text><rect x="600" y="150" width="115" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="657.50" y="200.50" font-size="26" fill="#16344f" text-anchor="middle">＋</text><rect x="875" y="150" width="185" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="967.50" y="192.50" font-size="26" fill="#16344f" text-anchor="middle">cₜ</text><text x="967.50" y="223.50" font-size="21" fill="#16344f" text-anchor="middle">新记忆</text><line x1="210.00" y1="192.00" x2="300.00" y2="192.00" stroke="#16344f" stroke-width="3"/><path d="M 290.35 197.27 L 300.00 192.00 L 290.35 186.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="460.00" y1="192.00" x2="590.00" y2="192.00" stroke="#16344f" stroke-width="3"/><path d="M 580.35 197.27 L 590.00 192.00 L 580.35 186.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="720.00" y1="192.00" x2="865.00" y2="192.00" stroke="#16344f" stroke-width="3"/><path d="M 855.35 197.27 L 865.00 192.00 L 855.35 186.73" stroke="#16344f" fill="none" stroke-width="3"/><rect x="280" y="345" width="175" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="367.50" y="387.50" font-size="26" fill="#16344f" text-anchor="middle">gₜ</text><text x="367.50" y="418.50" font-size="21" fill="#16344f" text-anchor="middle">新候选</text><rect x="600" y="345" width="115" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="657.50" y="395.50" font-size="26" fill="#16344f" text-anchor="middle">× iₜ</text><line x1="460.00" y1="387.00" x2="590.00" y2="387.00" stroke="#16344f" stroke-width="3"/><path d="M 580.35 392.27 L 590.00 387.00 L 580.35 381.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="657.00" y1="340.00" x2="657.00" y2="245.00" stroke="#16344f" stroke-width="3"/><path d="M 662.27 254.65 L 657.00 245.00 L 651.73 254.65" stroke="#16344f" fill="none" stroke-width="3"/><rect x="875" y="345" width="185" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="967.50" y="395.50" font-size="26" fill="#16344f" text-anchor="middle">tanh(cₜ)</text><line x1="967.00" y1="240.00" x2="967.00" y2="335.00" stroke="#16344f" stroke-width="3"/><path d="M 961.73 325.35 L 967.00 335.00 L 972.27 325.35" stroke="#16344f" fill="none" stroke-width="3"/><rect x="875" y="510" width="185" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="967.50" y="560.50" font-size="26" fill="#16344f" text-anchor="middle">× oₜ → hₜ</text><line x1="967.00" y1="435.00" x2="967.00" y2="500.00" stroke="#16344f" stroke-width="3"/><path d="M 961.73 490.35 L 967.00 500.00 L 972.27 490.35" stroke="#16344f" fill="none" stroke-width="3"/><rect x="45" y="515" width="680" height="90" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="385.00" y="560.00" font-size="26" fill="#16344f" text-anchor="middle">门 fₜ、iₜ、oₜ 与候选 gₜ</text><text x="385.00" y="591.00" font-size="21" fill="#16344f" text-anchor="middle">由 xₜ、hₜ₋₁ 的仿射变换及sigmoid/tanh计算</text><text x="45.00" y="675.00" font-size="23" fill="#16344f" text-anchor="start">横向加法路径保留旧记忆；门本身也依赖状态，因此总梯度还包含其他路径。</text></g></svg>
