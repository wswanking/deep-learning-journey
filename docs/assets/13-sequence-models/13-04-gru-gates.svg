<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">GRU保留与候选写入</title><desc id="desc">更新门保留旧状态，重置门作用于循环仿射后再进入候选，另一部分候选按1减更新门写入；明确采用PyTorch形式。</desc><rect width="1200" height="690" fill="white"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="35.00" y="45.00" font-size="27" fill="#16344f" text-anchor="start">图13-4  GRU：保留旧状态与写入候选；采用PyTorch候选公式</text><rect x="45" y="120" width="205" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="147.50" y="162.50" font-size="26" fill="#16344f" text-anchor="middle">hₜ₋₁</text><text x="147.50" y="193.50" font-size="21" fill="#16344f" text-anchor="middle">旧状态</text><rect x="435" y="120" width="165" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="517.50" y="162.50" font-size="26" fill="#16344f" text-anchor="middle">× zₜ</text><text x="517.50" y="193.50" font-size="21" fill="#16344f" text-anchor="middle">保留部分</text><rect x="850" y="120" width="160" height="85" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="930.00" y="170.50" font-size="26" fill="#16344f" text-anchor="middle">＋ → hₜ</text><line x1="255.00" y1="162.00" x2="425.00" y2="162.00" stroke="#16344f" stroke-width="3"/><path d="M 415.35 167.27 L 425.00 162.00 L 415.35 156.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="605.00" y1="162.00" x2="840.00" y2="162.00" stroke="#16344f" stroke-width="3"/><path d="M 830.35 167.27 L 840.00 162.00 L 830.35 156.73" stroke="#16344f" fill="none" stroke-width="3"/><rect x="45" y="315" width="290" height="105" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="190.00" y="367.50" font-size="26" fill="#16344f" text-anchor="middle">Wₕₙhₜ₋₁ + bₕₙ</text><text x="190.00" y="398.50" font-size="21" fill="#16344f" text-anchor="middle">先做循环仿射</text><rect x="435" y="315" width="165" height="105" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="517.50" y="367.50" font-size="26" fill="#16344f" text-anchor="middle">× rₜ</text><text x="517.50" y="398.50" font-size="21" fill="#16344f" text-anchor="middle">再做重置</text><line x1="340.00" y1="367.00" x2="425.00" y2="367.00" stroke="#16344f" stroke-width="3"/><path d="M 415.35 372.27 L 425.00 367.00 L 415.35 361.73" stroke="#16344f" fill="none" stroke-width="3"/><rect x="755" y="315" width="355" height="105" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="932.50" y="375.50" font-size="26" fill="#16344f" text-anchor="middle">nₜ = tanh(输入项 + 重置项)</text><line x1="605.00" y1="367.00" x2="745.00" y2="367.00" stroke="#16344f" stroke-width="3"/><path d="M 735.35 372.27 L 745.00 367.00 L 735.35 361.73" stroke="#16344f" fill="none" stroke-width="3"/><rect x="755" y="495" width="355" height="80" rx="12" fill="#eef5fa" stroke="#cbdbe7" stroke-width="2"/><text x="932.50" y="535.00" font-size="26" fill="#16344f" text-anchor="middle">× (1−zₜ)</text><text x="932.50" y="566.00" font-size="21" fill="#16344f" text-anchor="middle">候选写入部分</text><line x1="932.00" y1="425.00" x2="932.00" y2="485.00" stroke="#16344f" stroke-width="3"/><path d="M 926.73 475.35 L 932.00 485.00 L 937.27 475.35" stroke="#16344f" fill="none" stroke-width="3"/><line x1="1118.00" y1="535.00" x2="1160.00" y2="535.00" stroke="#16344f" stroke-width="3"/><path d="M 1150.35 540.27 L 1160.00 535.00 L 1150.35 529.73" stroke="#16344f" fill="none" stroke-width="3"/><line x1="1160.00" y1="535.00" x2="1160.00" y2="162.00" stroke="#16344f" stroke-width="3"/><path d="M 1165.27 171.65 L 1160.00 162.00 L 1154.73 171.65" stroke="#16344f" fill="none" stroke-width="3"/><line x1="1160.00" y1="162.00" x2="1020.00" y2="162.00" stroke="#16344f" stroke-width="3"/><path d="M 1029.65 156.73 L 1020.00 162.00 L 1029.65 167.27" stroke="#16344f" fill="none" stroke-width="3"/><text x="45.00" y="535.00" font-size="23" fill="#16344f" text-anchor="start">rₜ、zₜ 均由 xₜ、hₜ₋₁ 计算。</text><text x="45.00" y="640.00" font-size="23" fill="#16344f" text-anchor="start">D2L将重置放在循环矩阵乘法之前；向量情况下两种公式一般不相等。</text></g></svg>
